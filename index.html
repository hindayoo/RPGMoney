                        <div className="flex justify-between items-center mb-4 border-b border-theme-border pb-2"><span className="text-theme-text font-pixel text-lg font-bold tracking-widest flex items-center gap-2"><Icon name="Calculator" size={18} className="text-theme-accent"/> 魔法算盤</span><button onClick={onClose} className="text-theme-sub hover:text-theme-text active:scale-95"><Icon name="X"/></button></div>

                            {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','.','+'].map(btn => (

        };

        /* ================= 固定支出管理 Modal ================= */
        const FixedExpenseManagerModal = ({ fixedExpenses, categories, accounts, onClose, onSave, lang, translations }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const [expenses, setExpenses] = useState(fixedExpenses || []);
            const [editingId, setEditingId] = useState(null);
            
            const defaultCat = Object.keys(categories)[0];
            const defaultAcc = accounts[0]?.id || '';
            const [editData, setEditData] = useState({ name: '', amount: '', category: defaultCat, accountId: defaultAcc, dayOfMonth: 1, deductType: 'monthly' });
            const [showCalc, setShowCalc] = useState(false);

            const startEdit = (exp) => {
                setEditingId(exp.id);
                setEditData({ ...exp, amount: exp.amount.toString(), deductType: exp.deductType || 'monthly' });
            };

            const addNew = () => {
                setEditingId('new');
                setEditData({ name: t('fixed_expense'), amount: '', category: defaultCat, accountId: defaultAcc, dayOfMonth: 1, deductType: 'monthly' });
            };

            const saveEdit = () => {
                if (!editData.name || !editData.amount) return;
                const finalAmount = parseFloat(editData.amount);
                if (isNaN(finalAmount) || finalAmount <= 0) return;

                let newExpenses = [...expenses];
                const expToSave = { ...editData, amount: finalAmount };
                
                if (expToSave.deductType === 'interval30' && !expToSave.lastDeductedTime) {
                    expToSave.lastDeductedTime = Date.now();
                }

                if (editingId === 'new') {
                    newExpenses.push({ ...expToSave, id: Date.now().toString() });
                } else {
                    newExpenses = newExpenses.map(e => e.id === editingId ? { ...expToSave, id: editingId } : e);
                }
                setExpenses(newExpenses);
                setEditingId(null);
            };

            const removeExp = (id) => { setExpenses(expenses.filter(e => e.id !== id)); };

            const handlePadClick = (val) => {
                if (val === 'C') setEditData(prev => ({...prev, amount: ''}));
                else if (val === 'DEL') setEditData(prev => ({...prev, amount: prev.amount.length > 1 ? prev.amount.slice(0, -1) : ''}));
                else if (val === '=') { 
                    try { 
                        const res = Function(`'use strict'; return (${editData.amount || '0'})`)(); 
                        setEditData(prev => ({...prev, amount: String(Number(res.toFixed(2)))})); 
                    } catch(e) {} 
                }
                else { 
                    setEditData(prev => { 
                        if (prev.amount === '' || prev.amount === '0') { 
                            if (['+','*','/'].includes(val)) return prev.amount + val; 
                            return val === '.' ? '0.' : val; 
                        } 
                        return prev.amount + val; 
                    }); 
                }
            };

            return (
                <div className="fixed inset-0 z-[90] flex flex-col justify-end animate-[fadeIn_0.2s]">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-theme-card rounded-t-[2.5rem] p-6 shadow-2xl animate-[slideUp_0.3s] pb-safe relative z-10 max-h-[90vh] flex flex-col h-full border-t-4 border-theme-accent/20">
                        <div className="flex justify-between items-center mb-6 shrink-0 border-b border-theme-border pb-4">
                            <button onClick={onClose} className="text-theme-sub hover:text-theme-text active:scale-95"><Icon name="X" size={24}/></button>
                            <h3 className="font-bold text-xl text-theme-text font-pixel tracking-widest flex items-center gap-2"><Icon name="Calendar" className="text-theme-accent"/> {t('fixed_manage')}</h3>
                            <button onClick={() => onSave(expenses)} className="text-theme-accent font-bold"><Icon name="Check" size={24}/></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto space-y-3 custom-scrollbar smooth-scroll pb-24 pr-1">
                            {expenses.length === 0 && <div className="text-center py-10 text-theme-sub opacity-60 text-xs border-2 border-dashed border-theme-border rounded-xl">{t('no_records')}</div>}
                            {expenses.map(exp => {
                                const acc = accounts.find(a => a.id == exp.accountId);
                                return (
                                    <div key={exp.id} className="bg-theme-bg p-4 rounded-2xl border border-theme-border shadow-sm flex items-center justify-between group transition-transform">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className="w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm shrink-0" style={{backgroundColor: categories[exp.category]?.color || '#94a3b8'}}><Icon name={categories[exp.category]?.icon || 'Star'} size={18}/></div>
                                            <div>
                                                <div className="font-bold text-theme-text truncate text-sm">{exp.name}</div>
                                                <div className="text-[10px] text-theme-sub flex items-center gap-1">
                                                    <Icon name="Clock" size={8}/> 
                                                    {exp.deductType === 'interval30' ? t('fixed_interval30') : `${t('fixed_date')} ${exp.dayOfMonth}`}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <div className="font-mono font-bold text-red-500 text-lg">-{exp.amount}</div>
                                            <div className="text-[9px] bg-theme-card px-1.5 py-0.5 rounded border border-theme-border/50 truncate max-w-[80px] text-theme-sub">{acc ? acc.name : '?'}</div>
                                        </div>
                                        <button onClick={() => startEdit(exp)} className="p-2 ml-2 text-theme-sub hover:text-theme-accent bg-theme-card rounded-xl shadow-sm border border-theme-border/50 transition-colors"><Icon name="Edit" size={16}/></button>
                                    </div>
                                );
                            })}
                            <button onClick={addNew} className="w-full py-4 border-2 border-dashed border-theme-accent/50 rounded-2xl text-theme-accent font-bold hover:bg-theme-accent/10 transition-colors flex justify-center items-center gap-2 mt-4"><Icon name="Plus"/> {t('add')} {t('fixed_expense')}</button>
                        </div>

                        {editingId && (
                            <div className="absolute inset-0 bg-theme-card p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.2)] z-20 flex flex-col">
                                <div className="flex justify-between items-center mb-4 shrink-0 pb-2 border-b border-theme-border">
                                    <h4 className="font-bold text-theme-text text-lg">{editingId === 'new' ? t('add') : t('edit_account')}</h4>
                                    <button onClick={() => setEditingId(null)} className="text-theme-sub"><Icon name="X" size={24}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4 pb-20 custom-scrollbar smooth-scroll">
                                    <div><label className="text-[10px] font-bold text-theme-sub uppercase mb-1 block">{t('name')}</label><input type="text" value={editData.name} onChange={e=>setEditData({...editData, name: e.target.value})} className="w-full bg-theme-bg border border-theme-border rounded-xl p-3 font-bold text-theme-text outline-none focus:border-theme-accent"/></div>
                                    <div onClick={() => setShowCalc(true)} className="relative w-full bg-theme-bg p-3 rounded-xl border border-theme-border flex items-center justify-between cursor-pointer group"><span className={`font-bold ${editData.amount ? 'text-theme-text' : 'text-theme-sub/50'}`}>{editData.amount || '0'}</span><div className="p-2 rounded-xl bg-theme-accent/10 text-theme-accent"><Icon name="Calculator" size={20}/></div></div>
                                    
                                    <div>
                                        <label className="text-[10px] font-bold text-theme-sub uppercase mb-1 block">{t('fixed_type') || '扣款模式'}</label>
                                        <select value={editData.deductType || 'monthly'} onChange={e=>setEditData({...editData, deductType: e.target.value})} className="w-full bg-theme-bg p-3 rounded-xl outline-none font-bold text-theme-text border border-theme-border">
                                            <option value="monthly">{t('fixed_monthly') || '每月固定日期'}</option>
                                            <option value="interval30">{t('fixed_interval30') || '每 30 天'}</option>
                                        </select>
                                    </div>

                                    {(!editData.deductType || editData.deductType === 'monthly') && (
                                        <div className="animate-pop-in">
                                            <label className="text-[10px] font-bold text-theme-sub uppercase mb-1 block">{t('fixed_date')}</label>
                                            <select value={editData.dayOfMonth} onChange={e=>setEditData({...editData, dayOfMonth: parseInt(e.target.value)})} className="w-full bg-theme-bg p-3 rounded-xl outline-none font-bold text-theme-text border border-theme-border">{Array.from({length:31}, (_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}</select>
                                        </div>
                                    )}

                                    <div><label className="text-[10px] font-bold text-theme-sub uppercase mb-1 block">{t('category')}</label><select value={editData.category} onChange={e=>setEditData({...editData, category: e.target.value})} className="w-full bg-theme-bg p-3 rounded-xl outline-none font-bold text-theme-text border border-theme-border">{Object.entries(categories).map(([k,c])=><option key={k} value={k}>{c.label}</option>)}</select></div>
                                    <div><label className="text-[10px] font-bold text-theme-sub uppercase mb-1 block">{t('select_account')}</label><select value={editData.accountId} onChange={e=>setEditData({...editData, accountId: e.target.value})} className="w-full bg-theme-bg p-3 rounded-xl outline-none font-bold text-theme-text border border-theme-border">{accounts.map(a=><option key={a.id} value={a.id}>{a.name} ({a.currency})</option>)}</select></div>
                                </div>
                                <div className="flex gap-3 pt-4 border-t border-theme-border shrink-0 bg-theme-card pb-safe">
                                    {editingId !== 'new' && <button onClick={() => {removeExp(editingId); setEditingId(null);}} className="py-4 px-4 bg-red-50 text-red-500 font-bold rounded-xl active:scale-95 border border-red-200"><Icon name="Trash" size={20}/></button>}
                                    <button onClick={saveEdit} className="flex-1 py-4 bg-theme-accent text-white font-bold rounded-xl active:scale-95 shadow-md flex justify-center items-center gap-2"><Icon name="Check" size={20}/> {t('save')}</button>
                                </div>
                                {showCalc && <MagicAbacus value={editData.amount} onPadClick={handlePadClick} onClose={() => setShowCalc(false)} />}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const PixelPet = ({ id, className, animate = true }) => {
            const isSlime = id.includes('slime') || id.includes('rimuru'); 
            const isCat = id.includes('cat'); 
            const isDino = id.includes('dino');
            const isMarten = id.includes('marten');
            const isFlame = id.includes('flame') || id.includes('lotus');
            const isScorpion = id.includes('empress');
            const isSnake = id.includes('medusa');

            const renderContent = () => {
                if (id === 'slime_rimuru') {
                    return (<g className={animate ? "animate-bounce-gentle" : ""}><ellipse cx="16" cy="28" rx="10" ry="2" fill="rgba(0,0,0,0.2)" /><path fill="#93c5fd" d="M8 26 h16 c2 0 4-2 4-6 c0-8-6-12-12-12 c-6 0-12 4-12 12 c0 4 2 6 4 6 Z" stroke="#3b82f6" strokeWidth="0.5" /><path d="M10 18 Q12 20 14 18 M18 18 Q20 20 22 18" stroke="#1e3a8a" fill="none" strokeWidth="1" strokeLinecap="round"/><ellipse cx="10" cy="21" rx="2" ry="1" fill="#fbcfe8" /><ellipse cx="22" cy="21" rx="2" ry="1" fill="#fbcfe8" /></g>);
                } else if (id === 'rimuru_human') {
                    return (<g className={animate ? "animate-idle-breathe origin-bottom" : ""}><ellipse cx="16" cy="30" rx="8" ry="2" fill="rgba(0,0,0,0.2)" /><path fill="#3b82f6" d="M12 20 h8 v10 h-8 z" /><path fill="#ffffff" d="M10 16 h12 v6 h-12 z" /><path fill="#93c5fd" d="M11 6 h10 v8 h-10 z" /><circle cx="14" cy="11" r="1" fill="#1e3a8a"/><circle cx="18" cy="11" r="1" fill="#1e3a8a"/><path fill="#fbcfe8" d="M11 13 h10 v1 h-10 z" /><path fill="#60a5fa" d="M10 4 h12 v4 h-12 z" /></g>);
                } else if (id === 'rimuru_demon_lord') {
                    return (<g className={animate ? "animate-float origin-center" : ""}><ellipse cx="16" cy="30" rx="10" ry="2" fill="rgba(0,0,0,0.2)" /><path fill="#111827" d="M8 12 Q2 4 16 2 Q30 4 24 12 Z" opacity="0.8" className="animate-pulse"/><path fill="#1f2937" d="M10 16 h12 v14 h-12 z" /><path fill="#fbbf24" d="M14 16 h4 v14 h-4 z" /><path fill="#93c5fd" d="M12 6 h8 v8 h-8 z" /><circle cx="14" cy="10" r="1" fill="#ef4444" style={{filter:'drop-shadow(0 0 2px #ef4444)'}}/><circle cx="18" cy="10" r="1" fill="#ef4444" style={{filter:'drop-shadow(0 0 2px #ef4444)'}}/><path fill="#60a5fa" d="M11 4 h10 v3 h-10 z" /></g>);
                } else if (isSlime && !id.includes('rimuru')) {
                    const color = id.includes('king') ? '#3b82f6' : id.includes('ninja') ? '#1e40af' : '#60a5fa'; const hasCrown = id.includes('king'); const hasNinjaMask = id.includes('ninja');
                    return (<g className={animate ? "animate-bounce-gentle" : ""}><ellipse cx="16" cy="28" rx="10" ry="2" fill="rgba(0,0,0,0.2)" /><path fill={color} d="M8 26 h16 c2 0 4-2 4-6 c0-8-6-12-12-12 c-6 0-12 4-12 12 c0 4 2 6 4 6 Z" stroke="#1d4ed8" strokeWidth="0.5" /><path d="M10 14 q4 -4 8 0" strokeLinecap="round" strokeWidth="2" stroke="rgba(255,255,255,0.4)" fill="none" />{hasNinjaMask ? (<g><path fill="#1f2937" d="M6 18 h20 v6 h-20 z" /><rect x="10" y="20" width="4" height="1" fill="white" /><rect x="18" y="20" width="4" height="1" fill="white" /></g>) : (<g className={animate ? "animate-blink" : ""}><rect x="10" y="18" width="2" height="3" fill="#1e3a8a" rx="1" /><rect x="20" y="18" width="2" height="3" fill="#1e3a8a" rx="1" /><circle cx="8" cy="21" r="1.5" fill="rgba(236, 72, 153, 0.4)" /><circle cx="24" cy="21" r="1.5" fill="rgba(236, 72, 153, 0.4)" /></g>)}{hasCrown && (<g transform="translate(8, 2)"><path fill="#fbbf24" d="M4 6 L4 2 L8 6 L12 2 L12 6 Z" stroke="#b45309" strokeWidth="0.5" /><circle cx="4" cy="2" r="1" fill="#ef4444" /><circle cx="8" cy="6" r="1" fill="#3b82f6" /><circle cx="12" cy="2" r="1" fill="#ef4444" /></g>)}{hasNinjaMask && <path fill="#ef4444" d="M24 18 l4 -2 l-2 4 z" />}</g>);
                } else if (isCat) {
                    const color = id.includes('lion') ? '#fcd34d' : id.includes('witch') ? '#d8b4fe' : '#f3f4f6'; const isLion = id.includes('lion'); const isWitch = id.includes('witch');
                    return (<g className={animate ? "animate-pulse-slow" : ""}><ellipse cx="16" cy="28" rx="8" ry="2" fill="rgba(0,0,0,0.2)" /><path fill={color} d="M22 24 q4 -4 2 -8" stroke={color} strokeWidth="3" strokeLinecap="round" />{isLion && <circle cx="16" cy="18" r="11" fill="#ea580c" />}<path fill={color} d="M10 26 h12 v-8 h-12 z" /><path fill={color} d="M16 8 l-6 6 v12 h12 v-12 z" /><path fill={color} d="M10 10 l-2 -4 l4 2 z" /><path fill={color} d="M22 10 l2 -4 l-4 2 z" /><circle cx="14" cy="16" r="1.5" fill="#374151" /><circle cx="18" cy="16" r="1.5" fill="#374151" /><path fill="pink" d="M16 19 l-1 -1 h2 z" />{isWitch && (<g transform="translate(8, 0)"><path fill="#581c87" d="M0 8 h16 l-8 -10 z" /><path fill="#581c87" d="M-2 8 h20 v2 h-20 z" /></g>)}</g>);
                } else if (isDino) {
                    const color = id.includes('dragon') ? '#ef4444' : id.includes('rex') ? '#15803d' : '#4ade80'; const isDragon = id.includes('dragon'); const isRex = id.includes('rex');
                    return (<g className={animate ? "animate-bounce" : ""}><ellipse cx="16" cy="28" rx="9" ry="2" fill="rgba(0,0,0,0.2)" /><path fill={color} d="M8 24 l-6 -4 l6 4" stroke={color} strokeWidth="4" />{isDragon && <path fill="#991b1b" d="M20 16 l8 -6 l-2 10 z" opacity="0.8"/>}<rect x="8" y="16" width="14" height="10" fill={color} rx="2" /><path fill={color} d="M14 8 h10 v10 h-10 z" /><path fill="#fde047" d="M8 16 l-2 -2 l2 2 M12 16 l-2 -4 l2 4 M16 8 l-2 -4 l2 4" /><rect x="20" y="10" width="2" height="2" fill="white" /><rect x="21" y="10" width="1" height="1" fill="black" />{isRex && <path fill="white" d="M24 18 l-1 2 l-1 -2" />}</g>);
                } else if (isMarten) {
                    const color = id.includes('ancestor') ? '#3b0764' : id.includes('human') ? '#581c87' : '#4c1d95';
                    const isAncestor = id.includes('ancestor');
                    return (
                        <g className={animate ? "animate-float" : ""}>
                            <ellipse cx="16" cy="28" rx="8" ry="2" fill="rgba(0,0,0,0.2)" />

                        </g>

                    return (
                        <g className={animate ? "animate-float" : ""}>
                            <ellipse cx="16" cy="28" rx="10" ry="2" fill="rgba(0,0,0,0.2)" />

        };

        const PixelAvatar = ({ gender, colors, equipped, className, auraEffect, level=1 }) => {
            const actualColors = (colors && colors[gender]) ? colors[gender] : (colors || {});
            const { hair = '#8d6e63', armor = '#0d47a1', cape = '#c62828', skin = '#ffccbc' } = actualColors;
            
            const headGear = equipped?.head; 
            const bodyGear = equipped?.body; 
            const mainHand = equipped?.mainHand; 
            const offHand = equipped?.offHand; 
            const feetGear = equipped?.feet;
            const eyeGear = equipped?.eye;

            const backGears = Array.isArray(equipped?.back) ? equipped.back : (equipped?.back ? [equipped.back] : []);
            const spiritRings = Array.isArray(equipped?.spiritRing) ? equipped.spiritRing : (equipped?.spiritRing ? [equipped.spiritRing] : []);
            
            // 依據等級微調基礎大小與氣場 (最高至等級150的0.3倍放大)
            const scaleOffset = Math.min(0.3, (level / 150) * 0.3);

            return (
                <svg viewBox="0 0 32 32" overflow="visible" shapeRendering="crispEdges" className={className} xmlns="http://www.w3.org/2000/svg" style={{transform: `scale(${1 + scaleOffset})`}}>
                    <defs>
                        <radialGradient id="holyGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stopColor="#fef08a" stopOpacity="0.8"/>
                            <stop offset="100%" stopColor="#f59e0b" stopOpacity="0"/>
                        </radialGradient>

                    finalAmount = Function(`'use strict'; return (${amountStr || '0'})`)(); 
                } catch(err) { 
                    finalAmount = parseFloat(amountStr); 
                } 
                if (!finalAmount || isNaN(finalAmount) || finalAmount <= 0 || !accountId) return; 
                onAdd({ type, amount: Number(finalAmount), category, note, accountId, date: txDate }); 
            };
            
            const handlePadClick = (val) => { 
                if (val === 'C') setAmountStr(''); 
                else if (val === 'DEL') setAmountStr(prev => prev.length > 1 ? prev.slice(0, -1) : ''); 
                else if (val === '=') { 
                    try { 
                        const res = Function(`'use strict'; return (${amountStr || '0'})`)(); 
                        setAmountStr(String(Number(res.toFixed(2)))); 
                    } catch(e) {} 
                } else { 
                    setAmountStr(prev => { 
                        if (prev === '' || prev === '0') { 
                            if (['+','*','/'].includes(val)) return prev + val; 
                            return val === '.' ? '0.' : val; 
                        } 
                        return prev + val; 
                    }); 
                } 
            };
            
            const sortedCats = Object.entries(categories).sort((a,b) => (a[1].order || 99) - (b[1].order || 99));

            return (

                                            <div className="w-8 h-8 rounded-full flex items-center justify-center transition-transform text-white shadow-sm" style={{backgroundColor: cat.color}}><Icon name={cat.icon} size={14} color="white"/></div>

                            </div>
                            <input type="text" value={note} onChange={e => setNote(e.target.value)} className="w-full bg-theme-bg border border-theme-border rounded-xl px-4 py-4 text-sm outline-none focus:border-theme-accent font-bold text-theme-text" placeholder={`${t('note')}...`}/>

r border-theme-border items-center"><span className="font-bold text-xs text-theme-text">{item.label}</span><input type="color" value={currentColors[item.id] || '#000000'} onChange={(e) => updateColor(item.id, e.target.value)} className="w-12 h-8 rounded cursor-pointer border-2 border-white shadow-sm"/></div>))}</div></div></div></div>
            );

                        <div className="flex-1 overflow-y-auto px-6 pb-6 custom-scrollbar smooth-scroll">

                                                <span className="text-[10px] font-bold text-theme-text text-center w-20 leading-tight">{PET_DEFINITIONS[pId].name}</span>

                                </div>
                            </div>
                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-6">
                                {STARTER_PET_IDS.map(id => { 
                                    const def = PET_DEFINITIONS[id]; 
                                    const isSelected = selectedId === id; 
                                    return (
                                        <button key={id} onClick={() => setSelectedId(id)} className={`p-3 rounded-2xl flex flex-col items-center gap-2 border-2 transition-all active:scale-95 ${isSelected ? 'bg-theme-accent/10 border-theme-accent shadow-md' : 'bg-theme-card border-theme-border hover:border-theme-sub/30'}`}>
                                            <div className="w-12 h-12"><PixelPet id={id} className="w-full h-full" animate={false} /></div>
                                            <span className={`text-[10px] font-bold leading-tight ${isSelected ? 'text-theme-accent' : 'text-theme-sub'}`}>{def.name}</span>
                                        </button>

                            </div>
                            <button onClick={() => onSelect(selectedId)} className="w-full py-4 bg-theme-accent text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 flex items-center justify-center gap-2"><Icon name="Check" /> Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ClassSelectorModal = ({ currentClass, level, onSelect, onClose, lang, translations, gender, appearance, userEquipped }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const [selected, setSelected] = useState(currentClass || 'novice');
            
            const TIER_0 = ['novice'];
            const TIER_1 = ['warrior', 'mage', 'rogue', 'archer', 'cultivator', 'spirit_master'];
            const TIER_2 = {
                warrior: ['paladin', 'berserker'],
                mage: ['archmage', 'necromancer'],
                rogue: ['assassin', 'ninja'],
                archer: ['sniper', 'ranger'],
                cultivator: ['dou_zong', 'nirvana'],
                spirit_master: ['soul_king']
            };
            const TIER_3 = {
                paladin: ['divine_knight'],
                berserker: ['warlord'],
                archmage: ['grand_magus'],
                necromancer: ['lich_king'],
                assassin: ['shadow_walker'],
                ninja: ['shinobi'],
                sniper: ['phantom_shooter'],
                ranger: ['beast_master'],
                dou_zong: ['dou_di'],
                nirvana: ['martial_ancestor'],
                soul_king: ['titled_douluo', 'god_candidate']
            };
            const TIER_4 = {
                titled_douluo: ['god_inheritor'],
                god_candidate: ['god_inheritor']
            };

            const getParentClass = (clsId, tierDict) => {
                for (const [parent, children] of Object.entries(tierDict)) {
                    if (children.includes(clsId)) return parent;
                }
                return null;
            };

            const isUnlocked = (clsId) => {
                if (clsId === 'novice') return true;
                const def = CLASS_DEFINITIONS[clsId];
                if (!def || level < def.reqLevel) return false;
                
                if (def.tier === 1 && currentClass === 'novice') return true;
                if (def.tier === 2 && TIER_2[currentClass] && TIER_2[currentClass].includes(clsId)) return true;
                if (def.tier === 3 && TIER_3[currentClass] && TIER_3[currentClass].includes(clsId)) return true;
                if (def.tier === 4 && TIER_4[currentClass] && TIER_4[currentClass].includes(clsId)) return true;
                
                if (currentClass === clsId) return true;
                
                const parent2 = getParentClass(clsId, TIER_2);
                if (def.tier === 2 && parent2 === currentClass) return true;
                if (def.tier === 1 && TIER_2[clsId] && TIER_2[clsId].includes(currentClass)) return true;
                
                const parent3 = getParentClass(clsId, TIER_3);
                if (def.tier === 3 && parent3 === currentClass) return true;
                if (def.tier === 2 && TIER_3[clsId] && TIER_3[clsId].includes(currentClass)) return true;
                if (def.tier === 1 && parent3 && getParentClass(parent3, TIER_2) === clsId) return true;

                const parent4 = getParentClass(clsId, TIER_4);
                if (def.tier === 4 && parent4 === currentClass) return true;
                if (def.tier === 3 && TIER_4[clsId] && TIER_4[clsId].includes(currentClass)) return true;

                return false; 
            };

            const selDef = CLASS_DEFINITIONS[selected] || CLASS_DEFINITIONS['novice'];
            const isSelectable = isUnlocked(selected) && selected !== currentClass;

            const previewEquipped = useMemo(() => {
                let eq = { ...userEquipped };
                const specificEquip = selDef.previewEquip || {};
                
                if (specificEquip.mainHand) eq.mainHand = SHOP_ITEMS.find(i => i.id === specificEquip.mainHand.id);
                if (specificEquip.head) eq.head = SHOP_ITEMS.find(i => i.id === specificEquip.head.id);
                if (specificEquip.body) eq.body = SHOP_ITEMS.find(i => i.id === specificEquip.body.id);
                if (specificEquip.offHand) eq.offHand = SHOP_ITEMS.find(i => i.id === specificEquip.offHand.id);
                if (specificEquip.back) eq.back = [SHOP_ITEMS.find(i => i.id === specificEquip.back.id)];
                if (specificEquip.eye) eq.eye = SHOP_ITEMS.find(i => i.id === specificEquip.eye.id);
                if (specificEquip.feet) eq.feet = SHOP_ITEMS.find(i => i.id === specificEquip.feet.id);
                if (specificEquip.spiritRing) eq.spiritRing = [SHOP_ITEMS.find(i => i.id === specificEquip.spiritRing.id)];

                const def = CLASS_DEFINITIONS[clsId];

                const active = selected === clsId;
                const current = currentClass === clsId;

                    </div>

            return (
                <div className="fixed inset-0 z-[100] flex flex-col justify-end animate-[fadeIn_0.2s]">

                        <div className="p-4 shrink-0 flex justify-between items-center border-b border-theme-border bg-theme-bg">
                            <button onClick={onClose} className="w-10 h-10 flex items-center justify-center bg-theme-card rounded-full text-theme-sub hover:text-theme-text active:scale-95 shadow-sm border border-theme-border"><Icon name="X"/></button>

                            <div className="w-10"></div>
                        </div>
                        
                        <div className="flex-1 flex flex-col overflow-hidden">
                            <div className="relative h-[40%] bg-[#0f172a] shrink-0 border-b-4 border-theme-border overflow-hidden flex items-center justify-center">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20"></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 blur-[80px] rounded-full opacity-30 transition-colors duration-500 pointer-events-none" style={{backgroundColor: selDef.color}}></div>
                                
                                <div className="relative z-10 scale-[1.5] transform translate-y-4">
                                    <PixelAvatar gender={gender} colors={appearance} equipped={previewEquipped} auraEffect={selDef.aura} className="w-32 h-32 drop-shadow-[0_10px_15px_rgba(0,0,0,0.8)] filter contrast-110"/>
                                </div>

                                <div className="absolute top-4 left-4 z-20">
                                    <div className="flex items-center gap-2 mb-1">
                                        <div className="w-8 h-8 rounded bg-black/50 border border-white/20 flex items-center justify-center" style={{color: selDef.color}}><Icon name={selDef.icon} size={16}/></div>
                                        <div>
                                            <h2 className="text-white font-bold text-lg font-pixel tracking-widest leading-none drop-shadow-md" style={{color: selDef.color}}>{selDef.name}</h2>
                                            <span className="text-[10px] text-gray-400 font-mono bg-black/50 px-1 rounded mt-1 inline-block">Tier {selDef.tier}</span>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-300 max-w-[200px] leading-tight drop-shadow">{selDef.desc}</p>
                                </div>

                                <div className="absolute bottom-4 right-4 z-20 flex flex-col items-end gap-1">
                                    <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Status Bonus</div>
                                    <div className="grid grid-cols-2 gap-1.5 text-[10px] font-mono font-bold text-right">
                                        {Object.entries(selDef.bonuses).map(([stat, val]) => {
                                            if (stat === 'atkMulti' || stat === 'magMulti' || stat === 'hpMulti') return null; 
                                            const displayVal = stat === 'critBonus' ? `+${val}%` : (val > 0 ? `+${val * 100}%` : val < 0 ? `${val * 100}%` : '0%');
                                            return (
                                                <div key={stat} className={`bg-black/60 px-2 py-1 rounded border ${val > 0 ? 'text-green-400 border-green-900' : val < 0 ? 'text-red-400 border-red-900' : 'text-gray-400 border-gray-700'}`}>
                                                    {stat.toUpperCase()} {displayVal}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto bg-theme-bg relative custom-scrollbar smooth-scroll p-6 pb-24">

                                    <div className="absolute top-8 bottom-16 left-1/2 w-0.5 bg-theme-border -translate-x-1/2 z-0"></div>

                                        {renderClassNode('novice')}

                                            {TIER_1.map(renderClassNode)}

                                                <div className="w-full h-full flex items-center justify-center p-3 relative z-10">{Visual ? <svg viewBox="0 0 32 32" className="w-full h-full drop-shadow-md pixel-icon"><Visual /></svg> : <Icon name={item.icon} className="w-full h-full text-white/80 drop-shadow-md" strokeWidth={1.5} />}</div>
                                                {isOwned && <div className="absolute inset-0 z-20 flex items-center justify-center bg-black/60 backdrop-blur-[1px]"><Icon name="Check" size={20} className="text-green-400 drop-shadow-md" strokeWidth={3} /></div>}
                                            </div>
                                            <div className="mt-1.5 text-center px-1">
                                                <div className={`text-[10px] font-bold leading-tight truncate font-pixel tracking-wide ${isSelected ? 'text-[#ffca28]' : 'text-[#efebe9]/80'}`}>{item.name}</div>
                                                <div className="text-[9px] font-mono text-[#a1887f]">{finalCost} G {discountRate < 1 && <span className="text-green-400">↓</span>}</div>
                                            </div>
                                        </div>
                                    ); 
                                })}
                            </div>
                        )}
                    </div>
                    {!showHistory && previewItem && !inventory.some(i => i.id === previewItem.id) && (
                        <div className="absolute bottom-[80px] left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent z-40 animate-[slideUp_0.2s] pointer-events-none">
                            <div className="bg-[#2d1b1e] border-2 border-[#5d4037] p-4 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.8)] flex flex-col gap-3 relative overflow-hidden pointer-events-auto">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/leather.png')] opacity-30"></div>
                                <div className="flex items-center gap-4 relative z-10">
                                    <div className="flex-1 relative z-10">
                                        <div className="text-xs text-[#a1887f] font-bold uppercase mb-0.5">{t('buy')}</div>
                                        <div className="text-lg font-bold text-[#ffecb3] font-pixel drop-shadow-sm">{previewItem.name}</div>
                                        <div className="text-[10px] text-[#8d6e63] italic truncate">{previewItem.desc}</div>
                                        {previewItem.stats && (
                                            <div className="flex flex-wrap gap-2 mt-2">
                                                {Object.entries(previewItem.stats).map(([statName, val]) => (
                                                    <span key={statName} className="text-[10px] px-2 py-0.5 rounded-md bg-[#1a1012] border border-[#5d4037] text-[#ffca28] font-mono shadow-sm flex items-center gap-1">
                                                        {statName.toUpperCase()} {val > 0 ? `+${val}` : val}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={handleBuyClick} disabled={gold < Math.floor(previewItem.cost * discountRate)} className={`relative z-10 px-6 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all flex flex-col items-center min-w-[100px] shrink-0 ${gold >= Math.floor(previewItem.cost * discountRate) ? 'bg-gradient-to-b from-[#ffca28] to-[#ff8f00] text-[#3e2723] hover:brightness-110 border-b-4 border-[#e65100]' : 'bg-[#3e2723] text-[#8d6e63] border-b-4 border-[#1a1012] cursor-not-allowed'}`}>
                                        <span>{gold >= Math.floor(previewItem.cost * discountRate) ? t('buy') : t('not_enough_gold')}</span>
                                        <span className="text-[10px] opacity-80 font-mono">{Math.floor(previewItem.cost * discountRate)} G</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showConfirmModal && previewItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm animate-[fadeIn_0.2s]">
                            <div className="bg-[#2d1b1e] p-6 rounded-3xl shadow-[0_0_30px_rgba(0,0,0,0.8)] w-full max-w-xs border-2 border-[#5d4037] text-center relative animate-pop-in">
                                <div className="w-16 h-16 bg-[#ffca28]/10 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-[#ffca28] shadow-[0_0_15px_rgba(255,202,40,0.3)]"><Icon name="Coin" size={32} className="text-[#ffca28]"/></div>
                                <h3 className="font-bold text-lg mb-2 text-[#efebe9]">{t('confirm_buy_title')}</h3>
                                <p className="text-sm text-[#a1887f] mb-6 px-2">{t('confirm_buy_msg').replace('{cost}', Math.floor(previewItem.cost * discountRate)).replace('{item}', previewItem.name)}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3 rounded-xl font-bold text-[#a1887f] bg-[#1a1012] border border-[#5d4037] active:scale-95 hover:bg-[#3e2723] transition-colors">{t('cancel')}</button>
                                    <button onClick={confirmBuy} className="flex-1 py-3 rounded-xl font-bold text-[#3e2723] bg-gradient-to-b from-[#ffca28] to-[#ff8f00] shadow-lg active:scale-95 border-b-4 border-[#e65100]">{t('confirm')}</button>
                                </div>

                    {buySuccessId && <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none"><div className="bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-[0_0_20px_rgba(34,197,94,0.5)] animate-bounce flex items-center gap-2"><Icon name="Check" /> {t('buy_success')}</div></div>}
                </div>
            );
        };

        const ForgeView = ({ user, inventory, onEnhance, lang, translations }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const gold = user.gold || 0;
            const stones = user.stones || 0;
            const forgeTalent = user.talents?.forge_master || 0;
            
            const [selectedItem, setSelectedItem] = useState(null);
            const [isEnhancing, setIsEnhancing] = useState(false);
            const [enhanceResult, setEnhanceResult] = useState(null);

            const getEnhanceCost = (item) => {
                const baseRarityCost = { 'common': 100, 'rare': 250, 'epic': 800, 'legendary': 2500, 'mythic': 10000 }; 
                const currentLvl = item.enhanceLevel || 0;
                const goldCost = Math.floor((baseRarityCost[item.rarity] || 100) * Math.pow(1.5, currentLvl));
                const stoneCost = Math.floor(currentLvl / 3) + 1;
                return { gold: goldCost, stone: stoneCost };
            };

            const getSuccessRate = (item) => {
                const currentLvl = item.enhanceLevel || 0;
                const baseRate = Math.max(10, 100 - (currentLvl * 8)); 
                const finalRate = Math.min(100, baseRate + (forgeTalent * 3));
                return finalRate;
            };

            const handleEnhance = () => {
                if (!selectedItem) return;
                const cost = getEnhanceCost(selectedItem);
                if (gold < cost.gold || stones < cost.stone) return;
                
                setIsEnhancing(true);
                setEnhanceResult(null);

                setTimeout(() => {
                    const successRate = getSuccessRate(selectedItem);
                    const isSuccess = (Math.random() * 100) <= successRate;
                    
                    onEnhance(selectedItem, cost.gold, cost.stone, isSuccess);
                    
                    if (isSuccess) {
                        setSelectedItem(prev => ({...prev, enhanceLevel: (prev.enhanceLevel || 0) + 1}));
                        setEnhanceResult('success');
                    } else {
                        setEnhanceResult('fail');
                    }
                    
                    setIsEnhancing(false);
                    setTimeout(() => setEnhanceResult(null), 2500);
                }, 1500);
            };

            const renderVisual = (item, isLarge) => {
                if (!item) return null;
                const Visual = ITEM_ICONS[item.id] || GEAR_VISUALS[item.id];
                if (Visual) { return <svg viewBox="0 0 32 32" className={`${isLarge ? 'w-20 h-20' : 'w-10 h-10'} pixel-icon drop-shadow-md`}><Visual/></svg>; }
                return <Icon name={item.icon} size={isLarge ? 48 : 24}/>;
            };

            return (
                <div className="animate-[fadeIn_0.5s] w-full h-full flex flex-col bg-[#111827] relative overflow-hidden">
                    <div className="p-4 bg-[#1f2937] border-b-4 border-[#374151] flex justify-between items-center shadow-xl z-20 shrink-0">
                        <h2 className="text-xl font-bold font-pixel flex items-center gap-2 text-[#f3f4f6]"><Icon name="Hammer" className="text-[#fca5a5]"/> {t('forge')}</h2>
                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-1 bg-yellow-900/30 px-3 py-1.5 rounded-full border border-yellow-700/50">
                                <Icon name="Coin" size={14} className="text-[#fbbf24]"/><span className="font-bold text-[#fde047] font-mono text-sm">{gold.toLocaleString()}</span>
                            </div>
                            <div className="flex items-center gap-1 bg-purple-900/30 px-3 py-1.5 rounded-full border border-purple-700/50 tooltip-container">
                                <Icon name="Gem" size={14} className="text-[#c084fc]"/><span className="font-bold text-[#e9d5ff] font-mono text-sm">{stones.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 pb-36 custom-scrollbar smooth-scroll flex flex-col md:flex-row gap-4 relative z-10">
                        <div className="absolute inset-0 bg-magma opacity-30 pointer-events-none"></div>
                        <div className="absolute inset-0 forge-grid pointer-events-none"></div>
                        
                        <div className="w-full md:w-1/2 bg-[#1f2937]/90 backdrop-blur-sm rounded-2xl shadow-lg border-2 border-[#374151] p-3 flex flex-col relative z-10 max-h-[30vh] md:max-h-full">
                            <h3 className="text-xs font-bold text-[#9ca3af] uppercase mb-3 px-1 border-b border-[#374151] pb-2">{t('equipment')}</h3>
                            <div className="flex-1 overflow-y-auto pr-1 space-y-2 no-scrollbar">
                                {inventory.length === 0 && <div className="text-center py-10 opacity-50 text-xs text-[#9ca3af]">{t('empty_bag')}</div>}
                                {inventory.map(item => {
                                    const isSelected = selectedItem?.uniqueId ? selectedItem.uniqueId === item.uniqueId : selectedItem?.id === item.id;
                                    const eLvl = item.enhanceLevel || 0;
                                    return (
                                        <button key={item.uniqueId || item.id} onClick={() => setSelectedItem(item)} className={`w-full p-2.5 rounded-xl flex items-center gap-3 border-2 transition-all ${isSelected ? 'border-[#f87171] bg-[#7f1d1d]/30' : 'border-transparent hover:bg-[#374151]/50 bg-[#111827]/50'}`}>
                                            <div className="w-12 h-12 bg-[#1f2937] rounded-lg flex items-center justify-center border border-[#374151] shadow-inner">
                                                {renderVisual(item, false)}
                                            </div>
                                            <div className="text-left flex-1 min-w-0">
                                                <div className="font-bold text-[13px] text-[#f3f4f6] truncate flex items-center gap-1">
                                                    {item.name} {eLvl > 0 && <span className="text-[#fca5a5] text-[10px] bg-[#7f1d1d] px-1.5 py-0.5 rounded shadow-sm">+{eLvl}</span>}
                                                </div>
                                                <div className={`text-[10px] uppercase rarity-text-${item.rarity}`}>{item.rarity}</div>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="w-full md:w-1/2 bg-[#1f2937]/90 backdrop-blur-sm rounded-2xl shadow-lg border-2 border-[#374151] p-6 flex flex-col items-center justify-center relative overflow-hidden min-h-[350px] z-10">
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-orange-600/10 blur-[50px] rounded-full pointer-events-none"></div>

                            {!selectedItem ? (
                                <div className="text-center opacity-50 relative z-10"><Icon name="Hammer" size={56} className="mx-auto mb-3 text-[#9ca3af]"/><span className="text-sm font-bold text-[#9ca3af] tracking-widest">{t('forge')}</span></div>
                            ) : (
                                <div className="w-full h-full flex flex-col items-center justify-between relative z-10">
                                    <div className="text-center w-full">
                                        <div className="text-lg font-bold text-[#f3f4f6] mb-1 font-pixel drop-shadow-md">{selectedItem.name} {selectedItem.enhanceLevel ? <span className="text-[#fca5a5]">+{selectedItem.enhanceLevel}</span> : ''}</div>
                                        
                                        <div className="flex items-center justify-center gap-6 my-6 relative">
                                            <div className={`w-24 h-24 rounded-2xl bg-[#111827] flex items-center justify-center border-4 rarity-${selectedItem.rarity} shadow-[0_0_15px_rgba(0,0,0,0.5)] relative ${isEnhancing ? 'animate-shake' : ''}`}>
                                                {renderVisual(selectedItem, true)}
                                                {isEnhancing && <div className="absolute inset-0 bg-orange-500/20 animate-pulse mix-blend-overlay"></div>}
                                            </div>
                                            <Icon name="ArrowRight" className="text-[#6b7280] drop-shadow-sm" size={28}/>
                                            <div className="w-24 h-24 rounded-2xl bg-[#111827] flex items-center justify-center border-4 border-[#f87171] shadow-[0_0_20px_rgba(248,113,113,0.3)] relative group">
                                                <div className="drop-shadow-[0_0_8px_rgba(248,113,113,0.5)]">{renderVisual(selectedItem, true)}</div>
                                                <div className="absolute -top-3 -right-3 bg-[#b91c1c] text-white text-xs font-bold font-mono px-2 py-0.5 rounded-full border-2 border-[#fca5a5] shadow-lg">+{(selectedItem.enhanceLevel || 0) + 1}</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="w-full bg-[#111827] rounded-xl p-4 border border-[#374151] mb-4 shadow-inner">
                                        <div className="flex justify-between items-center mb-3">
                                            <h4 className="text-[10px] font-bold text-[#9ca3af] uppercase">{t('change_stats')}</h4>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${getSuccessRate(selectedItem) >= 80 ? 'bg-green-900/50 text-green-400' : getSuccessRate(selectedItem) >= 50 ? 'bg-yellow-900/50 text-yellow-400' : 'bg-red-900/50 text-red-400'}`}>
                                                {t('success_rate')}: {getSuccessRate(selectedItem)}%
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-[11px] font-mono font-bold">
                                            {Object.entries(selectedItem.stats || {}).map(([s, val]) => {
                                                const currentVal = Math.floor(val * Math.pow(1.1, selectedItem.enhanceLevel || 0));
                                                const nextVal = Math.floor(val * Math.pow(1.1, (selectedItem.enhanceLevel || 0) + 1));
                                                return (
                                                    <div key={s} className="flex justify-between items-center bg-[#1f2937] p-2 rounded shadow-sm border border-[#374151]">
                                                        <span className="text-[#9ca3af]">{s.toUpperCase()}</span>
                                                        <div className="flex items-center gap-1">
                                                            <span className="text-[#d1d5db]">{currentVal}</span>
                                                            <Icon name="ArrowRight" className="text-[#fca5a5]" size={10}/>
                                                            <span className="text-[#fca5a5]">{nextVal}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {selectedItem.enhanceLevel >= 15 ? (
                                        <div className="w-full py-4 text-center text-[#fca5a5] font-bold bg-[#7f1d1d]/30 rounded-2xl border-2 border-[#b91c1c]">{t('max_level')}</div>
                                    ) : (
                                        <button 
                                            onClick={handleEnhance} 
                                            disabled={isEnhancing || gold < getEnhanceCost(selectedItem).gold || stones < getEnhanceCost(selectedItem).stone} 
                                            className={`w-full py-3 rounded-2xl font-bold text-sm shadow-xl flex flex-col items-center justify-center transition-all border-b-4 ${(gold >= getEnhanceCost(selectedItem).gold && stones >= getEnhanceCost(selectedItem).stone) && !isEnhancing ? 'bg-gradient-to-r from-[#b91c1c] to-[#991b1b] text-white border-[#7f1d1d] hover:brightness-110 active:border-b-0 active:translate-y-1' : 'bg-[#374151] text-[#9ca3af] border-[#1f2937] cursor-not-allowed'}`}
                                        >
                                            <span className="mb-1 font-pixel tracking-wider">{isEnhancing ? '...' : t('enhance')}</span>
                                            {!isEnhancing && (
                                                <div className="flex items-center gap-3 text-[10px] font-mono bg-black/30 px-3 py-1 rounded-full border border-white/10">
                                                    <span className={`flex items-center gap-1 ${gold < getEnhanceCost(selectedItem).gold ? 'text-red-400' : 'text-[#fde047]'}`}><Icon name="Coin" size={10}/> {getEnhanceCost(selectedItem).gold}</span>
                                                    <span className={`flex items-center gap-1 ${stones < getEnhanceCost(selectedItem).stone ? 'text-red-400' : 'text-[#e9d5ff]'}`}><Icon name="Gem" size={10}/> {getEnhanceCost(selectedItem).stone}</span>
                                                </div>
                                            )}
                                        </button>
                                    )}
                                </div>
                            )}

                            {isEnhancing && (
                                <div className="absolute inset-0 bg-black/60 z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                                    <Icon name="Hammer" size={80} className="text-[#fca5a5] animate-forge-strike drop-shadow-[0_0_20px_rgba(248,113,113,0.8)]"/>
                                    <div className="mt-4 text-[#fca5a5] font-bold font-pixel animate-pulse tracking-widest">...</div>
                                    <div className="absolute w-2 h-2 bg-orange-400 rounded-full animate-sparkle" style={{top:'40%', left:'45%'}}></div>
                                    <div className="absolute w-3 h-3 bg-yellow-300 rounded-full animate-sparkle" style={{top:'35%', left:'55%', animationDelay:'0.2s'}}></div>
                                    <div className="absolute w-2 h-2 bg-red-400 rounded-full animate-sparkle" style={{top:'45%', left:'52%', animationDelay:'0.4s'}}></div>
                                </div>
                            )}

                            {enhanceResult && (
                                <div className={`absolute inset-0 z-30 flex items-center justify-center backdrop-blur-md animate-[fadeOut_2.5s_ease-in-out_forwards] ${enhanceResult === 'success' ? 'bg-[#166534]/40' : 'bg-[#7f1d1d]/40'}`}>
                                    <div className={`p-6 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.8)] border-4 flex flex-col items-center gap-3 animate-pop-in ${enhanceResult === 'success' ? 'bg-[#14532d] border-[#4ade80] text-[#86efac]' : 'bg-[#450a0a] border-[#f87171] text-[#fca5a5]'}`}>
                                        <div className="text-5xl">{enhanceResult === 'success' ? '✨' : '💥'}</div>
                                        <div className="text-xl font-bold font-pixel tracking-widest">{enhanceResult === 'success' ? t('forge_success') : t('forge_fail')}</div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const TalentView = ({ user, onUpgradeTalent, onResetTalent, lang, translations }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const [selectedTalent, setSelectedTalent] = useState(null);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            
            const totalTP = Math.max(0, user.level - 1);
            const userTalents = user.talents || {};
            const usedTP = Object.entries(userTalents).reduce((sum, [id, lvl]) => {
                const def = TALENT_TREE[id];
                return sum + (lvl * (def ? def.cost : 1));
            }, 0);
            const availableTP = totalTP - usedTP;

            const checkCanUpgrade = (def) => {
                if (user.level < def.reqLevel) return false;
                if (def.reqTalent && (userTalents[def.reqTalent] || 0) < def.reqTalentLevel) return false;
                const currentLvl = userTalents[def.id] || 0;
                if (currentLvl >= def.maxLevel) return false;
                if (availableTP < def.cost) return false;
                return true;
            };

            const handleResetConfirm = () => {
                const resetCost = user.hasResetTalent ? 10000 : 0;
                if (user.hasResetTalent && user.gold < resetCost) return alert(t('not_enough_gold'));
                onResetTalent(resetCost);
                setShowResetConfirm(false);
                setSelectedTalent(null);
            };

            const renderTier = (tierNum, talentIds) => (
                <div className="flex justify-center gap-4 sm:gap-10 w-full relative z-10" key={`tier-${tierNum}`}>
                    {talentIds.map(id => {
                        const def = TALENT_TREE[id]; const lvl = userTalents[id] || 0; const canUp = checkCanUpgrade(def);
                        const isMax = lvl >= def.maxLevel;
                        return (
                            <div key={id} onClick={() => setSelectedTalent(def)} className={`relative flex flex-col items-center cursor-pointer transition-all duration-300 ${selectedTalent?.id === id ? 'scale-110 z-20' : 'hover:scale-105'}`}>
                                <div className={`w-14 h-14 sm:w-16 sm:h-16 rounded-full border-4 flex items-center justify-center shadow-lg relative z-10 transition-colors ${isMax ? 'bg-gradient-to-br from-yellow-400 to-amber-600 border-yellow-200 text-white shadow-[0_0_15px_rgba(251,191,36,0.6)]' : lvl > 0 ? 'bg-theme-accent border-theme-accent text-white' : canUp ? 'bg-theme-card border-theme-accent text-theme-accent animate-pulse' : 'bg-theme-bg border-theme-sub/50 text-theme-sub/50 grayscale'}`}>
                                    <Icon name={def.icon} size={24} className={isMax ? 'drop-shadow-md' : ''}/>
                                    <div className="absolute -bottom-2 bg-theme-card text-theme-text text-[9px] sm:text-[10px] font-bold px-2 py-0.5 rounded-full border border-theme-border shadow-sm">{lvl}/{def.maxLevel}</div>
                                </div>
                                <span className={`text-[9px] sm:text-[10px] font-bold mt-3 px-2 py-0.5 rounded-full border shadow-sm max-w-[70px] text-center leading-tight ${isMax ? 'bg-yellow-100 text-yellow-700 border-yellow-300' : lvl > 0 ? 'bg-theme-accent/10 text-theme-accent border-theme-accent/30' : 'bg-theme-bg text-theme-sub border-theme-border'}`}>{def.name}</span>
                            </div>
                        );
                    })}
                </div>
            );

            return (
                <div className="animate-[fadeIn_0.5s] w-full h-full flex flex-col relative overflow-hidden bg-[#0f172a]">
                    <div className="p-4 bg-[#1e293b]/90 backdrop-blur-md border-b border-[#334155] z-30 shrink-0 shadow-xl flex justify-between items-center">
                        <h2 className="text-xl font-bold font-pixel flex items-center gap-2 text-[#f8fafc]"><Icon name="Sun" className="text-[#38bdf8]"/> {t('talent_tree')}</h2>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setShowResetConfirm(true)} className="p-2 bg-[#334155] rounded-full text-[#94a3b8] hover:text-[#f8fafc] hover:bg-[#475569] transition-colors" title={t('reset_talent')}><Icon name="RotateCcw" size={16}/></button>
                            <div className="bg-[#38bdf8]/20 text-[#7dd3fc] border border-[#38bdf8]/50 px-3 py-1.5 rounded-full text-xs font-bold shadow-[0_0_10px_rgba(56,189,248,0.3)]">TP: {availableTP}</div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 pb-24 smooth-scroll relative custom-scrollbar">
                        <div className="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] pointer-events-none"></div>
                        <div className="flex flex-col items-center gap-12 relative z-10 pt-6 pb-20">
                            {renderTier(1, ['str_up', 'vit_up', 'agi_up', 'int_up'])}
                            {renderTier(2, ['hp_regen', 'crit_rate_up', 'mana_pool'])}

        const CharacterView = ({ equipped, onEquipSlot, gender, onToggleGender, appearance, onUpdateAppearance, level, lang, translations, totalStats, derivedStats, cp, currentClass, onOpenClassSelector }) => {

                const eLvl = item.enhanceLevel || 0;

            };
            const ProgressBar = ({ val, max, color }) => (<div className="h-1.5 w-full bg-black/10 rounded-full overflow-hidden mt-1"><div className={`h-full ${color}`} style={{ width: `${Math.min((val / max) * 100, 100)}%` }}></div></div>);

            return (

                        <div className="absolute right-2 top-1/2 -translate-y-1/2 flex flex-col gap-6 z-30">

                    <div className="shrink-0 bg-theme-card p-4 rounded-3xl border border-theme-border shadow-sm relative z-40">

                        <div className="space-y-3">

                            <div className="grid grid-cols-4 gap-2 pt-2 sm:pt-3 border-t border-dashed border-theme-border">

                                <div className="text-center border-l border-theme-border"><div className="text-[9px] sm:text-[10px] text-theme-sub uppercase font-bold mb-0.5">法攻</div><div className="text-sm sm:text-xl font-mono font-bold text-theme-text">{Math.floor(derivedStats.matk).toLocaleString()}</div></div>
                                <div className="text-center border-l border-theme-border"><div className="text-[9px] sm:text-[10px] text-theme-sub uppercase font-bold mb-0.5">防禦</div><div className="text-sm sm:text-xl font-mono font-bold text-theme-text">{Math.floor(derivedStats.def).toLocaleString()}</div></div>
                                <div className="text-center border-l border-theme-border"><div className="text-[9px] sm:text-[10px] text-theme-sub uppercase font-bold mb-0.5">暴擊</div><div className="text-sm sm:text-xl font-mono font-bold text-theme-text">{Math.floor(derivedStats.cri)}%</div></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
const BossView = ({ cp, totalStats, derivedStats, user, equipped, gender, appearance, currentClass, onBattleEnd, lang, translations }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const [selectedBoss, setSelectedBoss] = useState(null);
            
            // 戰鬥狀態
            const [isBattling, setIsBattling] = useState(false);
            const [battleState, setBattleState] = useState(null); // { bossHp, bossMaxHp, playerHp, playerMaxHp, playerMp, playerMaxMp }
            const [combatLog, setCombatLog] = useState([]);
            const [playerTurn, setPlayerTurn] = useState(true);
            const [battleResult, setBattleResult] = useState(null); 
            const [rewardModal, setRewardModal] = useState(null); 
            const [actionEffect, setActionEffect] = useState(null); // 'playerHit', 'bossHit', 'heal'
            
            const safeUser = user || {};
            const bossAttempts = safeUser.bossAttempts || { date: '', count: 0 };
            const todayStr = new Date().toDateString();
            const attempts = bossAttempts.date === todayStr ? (bossAttempts.count || 0) : 0;
            const remaining = Math.max(0, 5 - attempts);
            const currentCp = cp || 0;
            const classDef = CLASS_DEFINITIONS[currentClass || 'novice'] || CLASS_DEFINITIONS['novice'];

            const addCombatLog = (msg, type = 'normal') => {
                setCombatLog(prev => [...prev, { id: Date.now() + Math.random(), msg, type }]);
            };

            const handleFightClick = (boss) => {
                if (remaining <= 0) return;
                setSelectedBoss(boss);
                
                // 初始化戰鬥數值
                const maxHp = Math.max(100, Math.floor(derivedStats.hp));
                const maxMp = Math.max(50, Math.floor(derivedStats.mp));
                
                setBattleState({
                    bossHp: boss.hp,
                    bossMaxHp: boss.hp,
                    playerHp: maxHp,
                    playerMaxHp: maxHp,
                    playerMp: maxMp,
                    playerMaxMp: maxMp
                });
                
                setCombatLog([{ id: Date.now(), msg: `遭遇 ${boss.name}！戰鬥開始！`, type: 'system' }]);
                setPlayerTurn(true);
                setIsBattling(true);
                setBattleResult(null);
                setRewardModal(null);
            };

            const endBattle = (isWin) => {
                setTimeout(() => {
                    setIsBattling(false);
                    setBattleResult(isWin ? 'win' : 'lose');
                    
                    let droppedItem = null;
                    const luckTalent = safeUser.talents?.luck_up || 0;
                    const finalDropRate = selectedBoss.dropRate * (1 + luckTalent * 0.02);

                    if (isWin && selectedBoss.dropItem && Math.random() < finalDropRate) {
                        droppedItem = SHOP_ITEMS.find(i => i.id === selectedBoss.dropItem);
                    }
                    
                    setTimeout(() => {
                        if (isWin) { 
                            setRewardModal({ 
                                exp: selectedBoss.exp, 
                                gold: Math.floor(selectedBoss.gold * (1 + (safeUser.talents?.gold_bonus || 0) * 0.05)), 
                                stones: selectedBoss.stoneDrop || 0,
                                item: droppedItem 
                            }); 
                        }
                        onBattleEnd({ isWin, boss: selectedBoss, droppedItem });
                    }, 1000);
                }, 1500);
            };

            const executePlayerAction = (actionType) => {
                if (!playerTurn || !battleState || battleState.playerHp <= 0 || battleState.bossHp <= 0) return;

                let dmg = 0;
                let heal = 0;
                let mpCost = 0;
                let logMsg = '';
                let logType = 'player';
                let isCrit = false;

                const baseAtk = Math.max(derivedStats.atk, derivedStats.matk);
                const critChance = derivedStats.cri || 5;

                if (actionType === 'attack') {
                    isCrit = (Math.random() * 100) < critChance;
                    dmg = Math.floor(baseAtk * (isCrit ? 1.5 : 1) * (0.8 + Math.random() * 0.4));
                    dmg = Math.max(1, dmg - (selectedBoss.def || 0) * 0.5); // 扣除王的一半防禦
                    logMsg = `你發動攻擊！${isCrit ? '【會心一擊！】' : ''} 造成 ${Math.floor(dmg)} 點傷害。`;
                } else if (actionType === 'heal') {
                    mpCost = 20;
                    if (battleState.playerMp < mpCost) {
                        addCombatLog('靈氣不足，無法吐納！', 'error');
                        return;
                    }
                    heal = Math.floor(battleState.playerMaxHp * 0.3 + totalStats.int * 2);
                    logMsg = `你運轉周天吐納，消耗 ${mpCost} 靈氣，恢復了 ${heal} 點生命。`;
                    logType = 'heal';
                    setActionEffect('heal');
                } else if (actionType === 'ultimate') {
                    mpCost = 50;
                    if (battleState.playerMp < mpCost) {
                        addCombatLog('靈氣不足，無法施展絕技！', 'error');
                        return;
                    }
                    dmg = Math.floor(baseAtk * 3.5 * (0.9 + Math.random() * 0.2)); // 無視防禦高傷
                    logMsg = `【終極奧義！】你燃燒 ${mpCost} 靈氣施展絕技，爆發出 ${Math.floor(dmg)} 點真實傷害！`;
                    logType = 'crit';
                }

                // 更新玩家數值與王血量
                const newBossHp = Math.max(0, battleState.bossHp - dmg);
                const newPlayerHp = Math.min(battleState.playerMaxHp, battleState.playerHp + heal);
                const newPlayerMp = battleState.playerMp - mpCost;

                setBattleState(prev => ({ ...prev, bossHp: newBossHp, playerHp: newPlayerHp, playerMp: newPlayerMp }));
                addCombatLog(logMsg, logType);

                if (dmg > 0) {
                    setActionEffect('bossHit');
                    setTimeout(() => setActionEffect(null), 300);
                } else if (heal > 0) {
                    setTimeout(() => setActionEffect(null), 300);
                }

                setPlayerTurn(false);

                // 檢查王是否死亡
                if (newBossHp <= 0) {
                    addCombatLog(`${selectedBoss.name} 被擊敗了！`, 'system');
                    endBattle(true);
                    return;
                }

                // 觸發 Boss 回合
                setTimeout(() => executeBossTurn(newBossHp, newPlayerHp, newPlayerMp), 1000);
            };

            const executeBossTurn = (currentBossHp, currentPlayerHp, currentPlayerMp) => {
                if (currentBossHp <= 0) return;

                const isHeavy = Math.random() < 0.3; // 30% 機率重擊
                const bossBaseAtk = selectedBoss.atk || 50;
                
                let dmg = Math.floor(bossBaseAtk * (isHeavy ? 2 : 1) * (0.8 + Math.random() * 0.4));
                dmg = Math.max(1, dmg - (derivedStats.def || 0)); // 扣除玩家防禦

                const logMsg = `${selectedBoss.name} 發動了${isHeavy ? '【致命猛擊】' : '攻擊'}！對你造成 ${Math.floor(dmg)} 點傷害。`;
                
                const newPlayerHp = Math.max(0, currentPlayerHp - dmg);
                
                setBattleState(prev => ({ ...prev, playerHp: newPlayerHp }));
                addCombatLog(logMsg, 'boss');
                setActionEffect('playerHit');
                setTimeout(() => setActionEffect(null), 300);

                if (newPlayerHp <= 0) {
                    addCombatLog('你重傷倒地，無力再戰...', 'error');
                    endBattle(false);
                } else {
                    // 回復少量 MP (每回合自然恢復)
                    const mpRegen = Math.floor(battleState.playerMaxMp * 0.05);
                    setBattleState(prev => ({ ...prev, playerMp: Math.min(prev.playerMaxMp, prev.playerMp + mpRegen) }));
                    setTimeout(() => setPlayerTurn(true), 500);
                }
            };

            // 戰鬥畫面 UI
            if (isBattling && selectedBoss && battleState) {
                const bossHpPercent = (battleState.bossHp / battleState.bossMaxHp) * 100;
                const playerHpPercent = (battleState.playerHp / battleState.playerMaxHp) * 100;
                const playerMpPercent = (battleState.playerMp / battleState.playerMaxMp) * 100;

                return (
                    <div className="fixed inset-0 z-[100] flex flex-col bg-gray-900 text-white font-pixel animate-[fadeIn_0.3s]">
                        {/* Top: Boss Area */}
                        <div className={`relative flex-1 flex flex-col items-center justify-center p-6 transition-all ${actionEffect === 'bossHit' ? 'bg-red-900/40 animate-shake' : 'bg-gradient-to-b from-gray-900 to-gray-800'}`}>
                            <div className="absolute top-8 w-full max-w-md px-6">
                                <div className="flex justify-between items-end mb-1">
                                    <span className="font-bold text-red-400 drop-shadow">{selectedBoss.name}</span>
                                    <span className="text-xs font-mono">{Math.floor(battleState.bossHp)} / {battleState.bossMaxHp}</span>
                                </div>
                                <div className="w-full h-4 bg-gray-800 rounded-full overflow-hidden border-2 border-gray-700 shadow-inner">
                                    <div className="h-full bg-red-600 transition-all duration-300" style={{width: `${bossHpPercent}%`}}></div>
                                </div>
                            </div>
                            <div className="w-40 h-40 rounded-full flex items-center justify-center border-4 relative" style={{borderColor: selectedBoss.color, backgroundColor: `${selectedBoss.color}20`}}>
                                <Icon name={selectedBoss.icon} size={80} color={selectedBoss.color} className={`drop-shadow-[0_0_15px_${selectedBoss.color}] animate-float ${actionEffect === 'bossHit' ? 'animate-hit-flash' : ''}`}/>
                            </div>
                        </div>

                        {/* Middle: Combat Log */}
                        <div className="h-40 bg-gray-950 border-y-4 border-gray-800 p-3 overflow-y-auto flex flex-col-reverse custom-scrollbar shadow-inner text-sm">
