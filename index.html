            useEffect(() => { if (theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); localStorage.setItem('gw_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('gw_lang', lang); }, [lang]);

            // ... Logic (Load/Save/Auth same as V17) ...
            const addLog = (type, msg) => { const newLog = { id: Date.now(), date: new Date().toISOString(), type, msg }; return [newLog, ...(data.logs || [])].slice(0, 50); };
            const checkDailyReset = (currentData) => { /* Same as V17 logic */ setData(currentData); }; // Simplified for brevity in this response, keep full logic
            const loadLocalData = () => { const localData = JSON.parse(localStorage.getItem('gw_v19_data')); if (localData) setData(localData); else setData({ user: null, accounts: [{ id: 1, name: 'Wallet', currency: 'HKD', balance: 0, type: 'cash' }], transactions: [], quests: [], achievements: [], logs: [] }); setLoading(false); };
            const saveData = (newData) => { setData(newData); const fb = window.firebase; if (fb && fb.auth && fb.auth.currentUser) fb.setDoc(fb.doc(fb.db, "users", fb.auth.currentUser.uid), newData).catch(console.error); else localStorage.setItem('gw_v19_data', JSON.stringify(newData)); };

            useEffect(() => { const t = setTimeout(() => { if (loading) loadLocalData(); }, 4000); const fb = window.firebase; if (!fb || !fb.auth) { loadLocalData(); return; } const unsub = fb.onAuthStateChanged(fb.auth, (u) => { clearTimeout(t); if (u) { fb.onSnapshot(fb.doc(fb.db, "users", u.uid), (d) => { if (d.exists()) setData(d.data()); else { const init = { user: { uid: u.uid, name: u.displayName || 'Hero', level: 1, exp: 0, title: 'Novice' }, accounts: [{ id: Date.now(), name: 'Wallet', currency: 'HKD', balance: 0, type: 'cash' }], transactions: [], quests: [], achievements: [], logs: [] }; fb.setDoc(fb.doc(fb.db, "users", u.uid), init); setData(init); } setLoading(false); }, () => loadLocalData()); } else loadLocalData(); }); return () => { unsub(); clearTimeout(t); } }, []);
            
            useEffect(() => { if (view === 'exchange' || assetModalOpen) fetch('https://open.er-api.com/v6/latest/HKD').then(r=>r.json()).then(d=>setRates(d.rates)).catch(console.error); }, [view, assetModalOpen]);

            const handleAuth = async () => { const fb = window.firebase; if (!fb) return; const email = loginAccount.trim() + "@sakurarpg.com"; try { if (isRegistering) { if (!/^[a-zA-Z0-9]+$/.test(loginAccount)) return alert(t('acc_alert')); const cred = await fb.createUserWithEmailAndPassword(fb.auth, email, loginPass); await fb.updateProfile(cred.user, { displayName: regName }); window.location.reload(); } else await fb.signInWithEmailAndPassword(fb.auth, email, loginPass); } catch (e) { alert(e.message); } };
            const logout = () => { const fb = window.firebase; if(fb) fb.signOut(fb.auth); window.location.reload(); };
            
            const handleAvatarUpload = async (e) => { const file = e.target.files[0]; if(file){ const b64 = await resizeImage(file); saveData({...data, user: {...data.user, photo: b64}}); } };

            // --- Keypad Handlers ---
            const openKeypad = (target, initVal) => {
                setKeypadTarget(target);
                setTempValue(initVal ? initVal.toString() : '');
                setKeypadOpen(true);
            };

            const confirmKeypad = () => {
                const val = tempValue || '0';
                if (keypadTarget === 'tx') setTxForm(prev => ({ ...prev, amount: val }));
                else if (keypadTarget === 'asset') setAssetForm(prev => ({ ...prev, balance: val }));
                else if (keypadTarget === 'exchange') setBaseAmount(val);
                setKeypadOpen(false);
            };

            const addTransaction = () => {
                if(!txForm.amount || !txForm.accountId) return alert(t('missing_info'));
                const amt = parseFloat(txForm.amount);
                const acc = data.accounts.find(a => a.id == txForm.accountId);
                const newTx = { id: Date.now(), date: new Date().toISOString(), ...txForm, amount: amt, accountName: acc.name, currency: acc.currency };
                const newAccs = data.accounts.map(a => a.id == acc.id ? { ...a, balance: txForm.type === 'expense' ? a.balance - amt : a.balance + amt } : a);
                let newExp = data.user.exp + 5; let newLv = data.user.level; if (newExp >= newLv * 100) { newLv++; newExp -= (newLv-1)*100; }
                const newLogs = addLog(txForm.type==='expense'?'finance_out':'finance_in', `${txForm.type==='expense'?'Out':'In'} ${amt} (${CATEGORIES[txForm.category].label})`);
                saveData({ ...data, user: {...data.user, exp: newExp, level: newLv}, accounts: newAccs, transactions: [newTx, ...data.transactions], logs: newLogs });
                setModalOpen(false);
            };

            const saveAsset = () => {
                if (!assetForm.name || assetForm.balance === '') return alert(t('missing_info'));
                let newAccs = [...data.accounts];
                if (assetForm.id) newAccs = newAccs.map(a => a.id === assetForm.id ? { ...assetForm, balance: parseFloat(assetForm.balance) } : a);
                else newAccs.push({ ...assetForm, id: Date.now(), balance: parseFloat(assetForm.balance) });
                saveData({ ...data, accounts: newAccs });
                setAssetModalOpen(false);
            };

            const guardian = useMemo(() => { if (!data.user) return GUARDIAN_STAGES[0]; return GUARDIAN_STAGES.findLast(s => data.user.level >= s.level) || GUARDIAN_STAGES[0]; }, [data.user]);

            useEffect(() => { if (!loading) document.getElementById('loading-screen').style.display = 'none'; document.getElementById('root').classList.remove('hidden'); }, [loading]);
            if (loading) return null;

            if (!data.user) return ( <div className="h-full flex flex-col items-center justify-center p-6 animate-[fadeIn_0.5s]"><div className="text-6xl mb-6 animate-float">🛡️</div><h1 className="text-2xl font-bold text-ink mb-8 font-pixel tracking-widest text-center">{t('login_title')}</h1><div className="w-full max-w-sm glass p-8 rounded-[2.5rem] shadow-2xl flex flex-col gap-5 dark:text-gray-200 border-4 border-sakura-base/30"><div className="flex bg-white/50 dark:bg-black/20 rounded-full p-1"><button onClick={()=>setIsRegistering(false)} className={`flex-1 py-2 rounded-full text-xs font-bold transition-all ${!isRegistering ? 'bg-sakura-dark text-white shadow' : 'text-gray-500'}`}>{t('login_btn')}</button><button onClick={()=>setIsRegistering(true)} className={`flex-1 py-2 rounded-full text-xs font-bold transition-all ${isRegistering ? 'bg-sakura-dark text-white shadow' : 'text-gray-500'}`}>{t('register_btn')}</button></div>{isRegistering && <input type="text" placeholder="Nickname" value={regName} onChange={e=>setRegName(e.target.value)} className="w-full bg-gray-50 dark:bg-black/30 p-4 rounded-2xl outline-none font-bold mt-1 shadow-inner"/>}<input type="text" placeholder="ID (A-Z, 0-9)" value={loginAccount} onChange={e=>setLoginAccount(e.target.value)} className="w-full bg-gray-50 dark:bg-black/30 p-4 rounded-2xl outline-none font-bold mt-1 shadow-inner"/><div className="relative mt-1"><input type={showPass ? "text" : "password"} value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full bg-gray-50 dark:bg-black/30 p-4 rounded-2xl outline-none font-bold shadow-inner" placeholder="Password"/><button onClick={()=>setShowPass(!showPass)} className="absolute right-4 top-4 opacity-50"><Icon name={showPass?'EyeOff':'Eye'} size={20}/></button></div><button onClick={handleAuth} className="w-full py-4 bg-sakura-dark text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-transform text-lg mt-2">{isRegistering ? t('register_title') : t('login_btn')}</button><div className="text-center mt-2"><p className="text-xs text-gray-400 cursor-pointer hover:text-sakura-dark" onClick={()=>setIsRegistering(!isRegistering)}>{isRegistering ? t('have_acc') : t('new_user')}</p>{isRegistering && <p className="text-[10px] text-red-300 mt-1">*{t('name_alert')}</p>}</div></div><button onClick={() => saveData({...data, user: {name:'Guest', level:1, exp:0, title:'Novice'}})} className="mt-8 text-xs text-gray-400 underline">{t('guest')}</button></div> );

            return (
                <div className="flex flex-col h-full relative z-10 text-ink">
                    <header className="px-4 pt-12 pb-2 flex justify-between items-center bg-white/60 dark:bg-black/40 sticky top-0 z-20 backdrop-blur-md border-b border-white/50 dark:border-white/10">
                        <div className="flex items-center gap-3">
                            <label className="relative cursor-pointer avatar-glow"><div className="w-11 h-11 rounded-full bg-white dark:bg-gray-700 border-2 border-sakura-base overflow-hidden shadow-md flex items-center justify-center text-xl">{data.user.photo ? <img src={data.user.photo} className="w-full h-full object-cover"/> : "👤"}</div><input type="file" accept="image/*" onChange={handleAvatarUpload} className="hidden"/></label>
                            <div><div className="flex items-center gap-2"><h1 className="font-bold text-sm">{data.user.name}</h1><span className="text-[9px] bg-sakura-dark text-white px-1.5 rounded-full">Lv.{data.user.level}</span></div><div className="text-[10px] text-sakura-accent font-bold opacity-80">{data.user.title}</div></div>
                        </div>
                        <div className="flex gap-2"><button onClick={()=>setLang(l=>l==='zh'?'en':l==='en'?'ja':'zh')} className="w-9 h-9 bg-white/50 dark:bg-black/30 rounded-full flex items-center justify-center shadow-sm border border-white/50 text-[10px] font-bold active:scale-95 transition-transform">{lang.toUpperCase()}</button><button onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} className="w-9 h-9 bg-white/50 dark:bg-black/30 rounded-full flex items-center justify-center shadow-sm border border-white/50 active:scale-95 transition-transform"><Icon name={theme==='dark'?'Sun':'Moon'} size={16}/></button><button onClick={logout} className="w-9 h-9 bg-red-100/80 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center shadow-sm border border-white/50 active:scale-95 transition-transform"><Icon name="LogOut" size={16}/></button></div>
                    </header>

                    <main className="flex-1 overflow-y-auto no-scrollbar pb-24 p-4 space-y-5">
                        {view === 'adventure' && (
                            <div className="animate-[fadeIn_0.5s] space-y-5">
                                <div className="glass p-4 rounded-3xl flex items-center justify-between">
                                    <div className="w-full"><div className="flex justify-between text-xs font-bold opacity-60 mb-1"><span>NEXT LEVEL</span><span>{data.user.exp} / {data.user.level * 100}</span></div><div className="w-full h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-sakura-base to-sakura-accent transition-all duration-700" style={{width: `${(data.user.exp / (data.user.level*100))*100}%`}}></div></div></div>
                                </div>
                                <div><h3 className="font-bold opacity-60 text-sm mb-2 flex items-center gap-1"><Icon name="Star" size={14}/> {t('upgrade')}</h3><div className="grid grid-cols-3 gap-2">{TALENTS.map((t,i) => (<div key={i} className="glass p-2 rounded-2xl flex flex-col items-center justify-center h-20 bg-white/30 dark:bg-black/30 active:scale-95 transition-transform"><div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1 ${t.color}`}><Icon name={t.icon} size={16}/></div><span className="text-[10px] font-bold opacity-80">{t.name}</span></div>))}</div></div>
                                <div className="glass p-6 rounded-[2.5rem] relative text-center border-sakura-base/50">
                                    <div className="text-8xl animate-float filter drop-shadow-xl mb-4 font-pixel">{guardian.emoji}</div>
                                    <div className="bg-white/50 dark:bg-black/40 rounded-xl p-3 border border-white/50 text-left mb-3"><div className="flex justify-between items-center mb-1"><h2 className="text-sm font-bold font-pixel">{guardian.name}</h2><span className="text-[9px] bg-sakura-dark text-white px-1 rounded font-pixel">Lv.{data.user.level}</span></div><p className="text-[10px] opacity-70 font-pixel leading-tight">{guardian.desc}</p></div>
                                    <div className="flex items-center gap-2"><span className="text-[8px] font-bold text-purple-500">EXP</span><div className="flex-1 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden"><div className="h-full bg-purple-400 transition-all" style={{width: `${(data.user.exp % 100)}%`}}></div></div><span className="text-[8px] opacity-50">{data.user.exp % 100}%</span></div>
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-2"><h3 className="font-bold opacity-60 text-sm flex items-center gap-1"><Icon name="Wallet" size={14}/> {t('assets')}</h3><button onClick={()=>{setAssetForm({id:null, name:'', currency:'HKD', balance:'', type:'cash'}); setAssetModalOpen(true)}} className="text-[10px] bg-sakura-dark text-white px-2 py-1 rounded-full flex items-center gap-1 shadow-sm active:scale-95 transition-transform"><Icon name="Plus" size={10}/> {t('forge')}</button></div>
                                    <div className="space-y-2">{data.accounts.map(acc => (<div key={acc.id} onClick={()=>{setAssetForm(acc); setAssetModalOpen(true)}} className="glass p-3 rounded-xl flex justify-between items-center active:scale-95 transition-transform cursor-pointer"><div className="flex items-center gap-3"><div className={`w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm ${acc.type==='card'?'bg-purple-400':acc.type==='bank'?'bg-blue-400':'bg-yellow-400'}`}><Icon name={acc.type==='card'?'CreditCard':acc.type==='bank'?'Landmark':'Wallet'} size={20}/></div><div><div className="font-bold text-sm">{acc.name}</div><div className="text-[10px] opacity-60 uppercase">{acc.type}</div></div></div><div className="text-right"><div className="font-mono font-bold">{acc.balance.toLocaleString()}</div><div className="text-[10px] opacity-60 font-bold bg-black/5 dark:bg-white/10 px-1 rounded inline-block">{acc.currency}</div></div></div>))}</div>
                                </div>
                            </div>
                        )}

                        {view === 'exchange' && (
                            <div className="animate-[fadeIn_0.5s] space-y-4">
                                <div className="glass p-5 rounded-3xl guild-board">
                                    <div className="text-center font-bold mb-4 font-pixel tracking-widest border-b border-wood/30 pb-2 text-xl">公會佈告欄</div>
                                    <div className="flex items-center gap-2 mb-4 bg-white/50 dark:bg-black/20 p-2 rounded-xl">
                                        <span className="font-bold text-sm ml-2">HKD</span>
                                        <div onClick={()=>openKeypad('exchange', baseAmount)} className="flex-1 text-right font-mono font-bold text-xl mr-2">{baseAmount}</div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 pb-20">
                                        {CURRENCIES.filter(c=>c!=='HKD').map(c => (
                                            <div key={c} className="flex justify-between items-center text-sm border-b border-dashed border-black/10 dark:border-white/10 pb-1">
                                                <span className="font-bold opacity-70">{c}</span>
                                                <span className="font-mono">{(baseAmount * (rates[c]||0)).toLocaleString(undefined,{maximumFractionDigits:2})}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Other Views Same as V18 logic */}
                        {view === 'upgrade' && (
                            <div className="animate-[fadeIn_0.5s] space-y-4">
                                <h2 className="text-xl font-bold flex items-center gap-2 mb-4"><Icon name="Sword" size={20}/> 天賦強化</h2>
                                <div className="grid gap-3">{TALENTS.map((t,i) => (<div key={i} className="glass p-4 rounded-3xl flex items-center justify-between active:scale-95 transition-transform"><div className="flex items-center gap-4"><div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${t.color}`}><Icon name={t.icon} size={24}/></div><div><h3 className="font-bold">{t.name}</h3><p className="text-xs opacity-60">{t.desc}</p></div></div><div className="font-bold text-sakura-dark">Lv.{t.lv}</div></div>))}</div>
                            </div>
                        )}
                        {view === 'quests' && (
                            <div className="animate-[fadeIn_0.5s] space-y-4">
                                <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">{['main','daily','challenge'].map(t => (<button key={t} onClick={()=>setSubView(t)} className={`px-5 py-2 rounded-full text-xs font-bold transition-colors active:scale-95 ${subView===t ? 'bg-sakura-dark text-white' : 'bg-white dark:bg-white/10 text-gray-500'}`}>{t==='main'?TRANSLATIONS[lang].main:t==='daily'?TRANSLATIONS[lang].daily:TRANSLATIONS[lang].challenge}</button>))}</div>
                                {data.quests.filter(q => q.type === subView).map(q => (<div key={q.id} className="glass p-5 rounded-3xl relative active:scale-95 transition-transform"><div className="flex justify-between"><h4 className="font-bold text-ink">{q.title}</h4><span className="text-xs text-sakura-accent font-bold">EXP +{q.exp}</span></div><p className="text-xs opacity-60 mt-1 mb-3">{q.desc}</p><div className="flex items-center gap-2"><div className="flex-1 h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden"><div className="h-full bg-blue-400 transition-all" style={{width: `${Math.min(100, (q.progress/q.target)*100)}%`}}></div></div><span className="text-[10px] font-bold text-gray-400">{Math.min(q.progress,q.target)}/{q.target}</span></div></div>))}
                            </div>
                        )}
                        {view === 'achievements' && (
                            <div className="grid grid-cols-2 gap-3 animate-[fadeIn_0.5s]">{data.achievements.map(a => (<div key={a.id} className={`glass p-4 rounded-3xl flex flex-col items-center text-center border-2 transition-all active:scale-95 ${a.unlocked ? 'border-yellow-400 bg-yellow-50/50 dark:bg-yellow-900/20' : 'border-gray-200 dark:border-gray-700 grayscale opacity-60'}`}><div className="w-14 h-14 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center mb-2 shadow-sm text-yellow-500"><Icon name={a.unlocked ? a.icon : 'Key'} size={28}/></div><div className="font-bold text-sm">{a.title}</div><div className="text-[10px] opacity-60 mt-1">{a.desc}</div></div>))}</div>
                        )}
                        {view === 'journal' && (
                            <div className="animate-[fadeIn_0.5s] space-y-4">
                                <div className="flex gap-2 mb-4"><button onClick={()=>setSubView('sys')} className={`flex-1 py-2 rounded-lg text-xs font-bold active:scale-95 transition-transform ${subView==='sys'?'bg-sakura-dark text-white':'bg-white dark:bg-white/10'}`}>系統事件</button><button onClick={()=>setSubView('fin')} className={`flex-1 py-2 rounded-lg text-xs font-bold active:scale-95 transition-transform ${subView==='fin'?'bg-sakura-dark text-white':'bg-white dark:bg-white/10'}`}>財務變動</button></div>
                                <div className="space-y-3">{data.logs.filter(l => subView==='sys' ? l.type==='system' : (l.type==='finance_out' || l.type==='finance_in')).map(l => (<div key={l.id} className="glass p-4 rounded-3xl flex gap-3 items-center active:scale-95 transition-transform"><div className={`w-2 h-10 rounded-full ${l.type==='system'?'bg-blue-400':l.type.includes('in')?'bg-green-400':'bg-red-400'}`}></div><div className="flex-1"><div className="text-[10px] opacity-60">{new Date(l.date).toLocaleString()}</div><div className="text-sm font-bold">{l.msg}</div></div></div>))}</div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full glass border-t border-white/50 dark:border-white/10 pb-safe pt-2 px-2 flex justify-between items-center z-30 h-16 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                        {[
                            {id:'adventure', icon:'Home', l:t('adventure')}, {id:'quests', icon:'Scroll', l:t('quests')},
                            {id:'achievements', icon:'Trophy', l:t('achievements')}, {id:'upgrade', icon:'Sword', l:t('upgrade')},
                            {id:'exchange', icon:'Globe', l:t('exchange')}, {id:'journal', icon:'Book', l:t('journal')}
                        ].map(b => (
                            <button key={b.id} onClick={()=>setView(b.id)} className={`flex flex-col items-center gap-1 w-full transition-all active:scale-95 ${view===b.id ? 'text-sakura-dark -translate-y-2' : 'opacity-40'}`}>
                                <Icon name={b.icon} size={22} strokeWidth={view===b.id?2.5:2}/><span className="text-[9px] font-bold">{b.l}</span>
                            </button>
                        ))}
                    </nav>

                    {keypadOpen && (
                        <Keypad 
                            value={tempValue} 
                            onChange={setTempValue} 
                            onConfirm={confirmKeypad} 
                            onClose={()=>setKeypadOpen(false)} 
                            label={t('calculator')} 
                        />
                    )}

                    {assetModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-center px-6 animate-[fadeIn_0.2s]">
                            <div className="bg-white dark:bg-dark-card rounded-3xl p-6 shadow-2xl animate-[slideUp_0.2s]">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-lg">{assetForm.id ? 'Edit' : t('forge')}</h3><button onClick={()=>setAssetModalOpen(false)}><Icon name="X"/></button></div>
                                <div className="space-y-4">
                                    <input type="text" value={assetForm.name} onChange={e=>setAssetForm({...assetForm, name:e.target.value})} className="w-full bg-gray-100 dark:bg-black/30 p-4 rounded-2xl outline-none font-bold" placeholder="Name"/>
                                    <div className="flex gap-2">
                                        <select value={assetForm.currency} onChange={e=>setAssetForm({...assetForm, currency:e.target.value})} className="bg-gray-100 dark:bg-black/30 p-4 rounded-2xl font-bold w-1/3">{CURRENCIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
                                        <div onClick={()=>openKeypad('asset', assetForm.balance)} className="bg-gray-100 dark:bg-black/30 p-4 rounded-2xl font-bold w-2/3 flex items-center">{assetForm.balance || 'Balance'}</div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['cash','bank','card'].map(type => (
                                            <button key={type} onClick={()=>setAssetForm({...assetForm, type})} className={`p-3 rounded-2xl border-2 flex flex-col items-center active:scale-95 transition-transform ${assetForm.type===type ? 'border-sakura-base bg-sakura-light/50 text-sakura-dark' : 'border-transparent bg-gray-100 dark:bg-black/30'}`}>
                                                <Icon name={type==='card'?'CreditCard':type==='bank'?'Landmark':'Wallet'} size={20}/><span className="text-[10px] uppercase mt-1">{type}</span>
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={saveAsset} className="w-full py-4 bg-sakura-dark text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">{t('save')}</button>
                                    {assetForm.id && <button onClick={deleteAsset} className="w-full py-3 text-red-400 font-bold active:scale-95 transition-transform">{t('delete')}</button>}
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'adventure' && (
                        <button onClick={()=>setModalOpen(true)} className="fixed bottom-24 right-4 w-16 h-16 bg-sakura-dark text-white rounded-full shadow-2xl flex items-center justify-center z-40 active:scale-95 transition-transform border-4 border-white dark:border-gray-800"><Icon name="Plus" size={32}/></button>
                    )}

                    {modalOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col justify-end">
                            <div className="bg-white dark:bg-dark-card rounded-t-[2.5rem] p-6 animate-[slideUp_0.3s]">
                                <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-lg">紀錄行動</h3><button onClick={()=>setModalOpen(false)}><Icon name="X" size={20}/></button></div>
                                <div className="flex bg-gray-100 dark:bg-black/30 rounded-2xl p-1.5 mb-6">
                                    <button onClick={()=>setTxForm({...txForm, type:'expense'})} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all active:scale-95 ${txForm.type==='expense'?'bg-white dark:bg-gray-700 shadow':''}`}>支出</button>
                                    <button onClick={()=>setTxForm({...txForm, type:'income'})} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all active:scale-95 ${txForm.type==='income'?'bg-white dark:bg-gray-700 shadow':''}`}>收入</button>
                                </div>
                                <div onClick={()=>openKeypad('tx', txForm.amount)} className="w-full text-5xl font-mono font-bold text-center border-b py-4 mb-6">{txForm.amount || '0'}</div>
                                <div className="grid grid-cols-5 gap-2 mb-6">
                                    {Object.entries(CATEGORIES).map(([k,c]) => (
                                        <button key={k} onClick={()=>setTxForm({...txForm, category: k})} className={`flex flex-col items-center p-2 rounded-xl transition-all ${txForm.category === k ? 'bg-sakura-light dark:bg-white/20 scale-105' : 'opacity-50'}`}>
                                            <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{backgroundColor: c.color}}><Icon name={c.icon} size={14} color="white"/></div><span className="text-[9px] mt-1 font-bold">{c.label}</span>
                                        </button>
                                    ))}
                                </div>
                                <select onChange={e=>setTxForm({...txForm, accountId: e.target.value})} className="w-full bg-gray-50 dark:bg-black/30 p-4 rounded-2xl mb-6 outline-none font-bold">
                                    <option value="">選擇帳戶</option>{data.accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                                </select>
                                <button onClick={addTransaction} className="w-full py-4 bg-sakura-dark text-white rounded-2xl font-bold shadow-lg text-lg">確認</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
