onfirm')}</button></div></div></div>

            useEffect(() => {

            useEffect(() => {

                        setCloudSyncing(true);
                        try {
                            const doc = await db.collection('users').doc(authUser.uid).get();
                            let latestFriends = safeData.friends;
                            if (doc.exists) {
                                const cloudData = doc.data();
                                const mergedMap = new Map();
                                safeData.friends.forEach(f => mergedMap.set(f.uid, f));
                                (cloudData.friends || []).forEach(f => mergedMap.set(f.uid, f));
                                latestFriends = Array.from(mergedMap.values());
                                if (latestFriends.length > safeData.friends.length) { setData(prev => ({ ...prev, friends: latestFriends })); }
                            }
                            const dataToSave = { ...data, friends: latestFriends };
                            await db.collection('users').doc(authUser.uid).set(dataToSave);

                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [data, authUser, authLoading, safeData.friends]);
            
            useEffect(() => { document.body.setAttribute('data-theme', theme); localStorage.setItem('gw_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('gw_lang', lang); }, [lang]);

            const addLog = (type, msg, currentLogs) => { const newLog = { id: Date.now(), date: new Date().toISOString(), type, msg }; return [newLog, ...currentLogs].slice(0, 50); };
            
            const currentStats = useMemo(() => {
                const rate = EXCHANGE_RATES[mainCurrency] || 1;
                const convertedExpense = safeData.transactions.filter(t => t.type === 'expense').reduce((a,c) => {
                    const acc = safeData.accounts.find(ac => ac.id == c.accountId);
                    const txRate = acc ? (EXCHANGE_RATES[acc.currency] || 1) : 1;
                    return a + (c.amount / txRate) * rate;
                }, 0);
                const convertedBalance = safeData.accounts.reduce((a,c) => {
                    const accRate = EXCHANGE_RATES[c.currency] || 1;
                    return a + (c.balance / accRate) * rate;
                }, 0);

                return { 
                    txCount: safeData.transactions.length, 
                    expenseTotal: convertedExpense, 
                    balance: convertedBalance, 
                    questCount: safeData.claimedQuests.length, 
                    level: safeData.user.level, 
                    itemCount: safeData.inventory.length, 
                    friendCount: safeData.friends.length 
                };
            }, [safeData, mainCurrency]);

            const checkUnlockables = (currentData) => {
                const rate = EXCHANGE_RATES[mainCurrency] || 1;
                const convertedExpense = (currentData.transactions||[]).filter(t => t.type === 'expense').reduce((a,c) => {
                    const acc = (currentData.accounts||[]).find(ac => ac.id == c.accountId);
                    const txRate = acc ? (EXCHANGE_RATES[acc.currency] || 1) : 1;
                    return a + (c.amount / txRate) * rate;
                }, 0);
                const convertedBalance = (currentData.accounts||[]).reduce((a,c) => {
                    const accRate = EXCHANGE_RATES[c.currency] || 1;
                    return a + (c.balance / accRate) * rate;
                }, 0);

                const stats = { 
                    txCount: (currentData.transactions||[]).length, 
                    expenseTotal: convertedExpense, 
                    balance: convertedBalance, 
                    questCount: (currentData.claimedQuests||[]).length, 
                    level: currentData.user.level, 
                    itemCount: (currentData.inventory||[]).length, 
                    friendCount: (currentData.friends||[]).length 
                };
                
                let newUser = { ...currentData.user, unlockedTitles: currentData.user.unlockedTitles || ['Novice'], unlockedAchievements: currentData.user.unlockedAchievements || [] }; 
                let logs = [...(currentData.logs||[])]; let updated = false;
                
                TITLES_LIST.forEach(tTitle => { if (!newUser.unlockedTitles.includes(tTitle.id) && tTitle.check(stats, 1)) { newUser.unlockedTitles.push(tTitle.id); logs = addLog('system', `${t('log_sys_title')}: ${tTitle.name}`, logs); updated = true; } });
                ACHIEVEMENTS_LIST.forEach(ach => {
                    if (!newUser.unlockedAchievements.includes(ach.id)) {
                        let achieved = false;
                        if (ach.type === 'txCount' && stats.txCount >= ach.target) achieved = true;
                        if (ach.type === 'expenseTotal' && stats.expenseTotal >= ach.target) achieved = true;
                        if (ach.type === 'balance' && stats.balance >= ach.target) achieved = true;
                        if (ach.type === 'questCount' && stats.questCount >= ach.target) achieved = true;
                        if (ach.type === 'level' && stats.level >= ach.target) achieved = true;
                        if (ach.type === 'friendCount' && stats.friendCount >= ach.target) achieved = true;
                        if (achieved) { newUser.unlockedAchievements.push(ach.id); logs = addLog('system', `Achievement Unlocked: ${ach.title}`, logs); updated = true; }
                    }
                });
                if (updated) { setData({ ...currentData, user: newUser, logs }); }
            };

            const handleAvatarUpload = (e) => { const file = e.target.files?.[0]; if (file && safeData.user) { const reader = new FileReader(); reader.onloadend = () => { setData(prev => ({ ...prev, user: { ...prev.user, avatarImage: reader.result } })); setShowProfileOptions(false); }; reader.readAsDataURL(file); } };
            const handleSelectPet = (petId) => { if (!safeData.user) return; const newPet = { id: petId, name: PET_DEFINITIONS[petId].name, exp: 0, level: 1, bond: 0 }; setData(prev => ({ ...prev, user: { ...prev.user, pet: newPet } })); setShowPetSelector(false); };
            const handleRenamePet = (newName) => { if (!safeData.user.pet) return; setData(prev => ({ ...prev, user: { ...prev.user, pet: { ...prev.user.pet, name: newName } } })); };
            const handleSetTitle = (titleId) => { setData(prev => ({ ...prev, user: { ...prev.user, title: titleId } })); };
            
            const handleBuyItem = (item) => {
                const newGold = safeData.user.gold - item.cost; const newInventory = [...safeData.inventory, item]; const newLogs = addLog('system', `Bought: ${item.name}`, safeData.logs);
                const newPurchase = { id: Date.now().toString(), itemId: item.id, itemName: item.name, cost: item.cost, date: new Date().toISOString() };
                setData(prev => ({ ...prev, user: { ...prev.user, gold: newGold }, inventory: newInventory, logs: newLogs, purchaseHistory: [newPurchase, ...safeData.purchaseHistory] }));
            };
            
            // 🌟 裝備切換邏輯 (支援背飾多選)
            const handleEquipItem = (slot, item) => { 
                const newEquipped = { ...data.equipped }; 
                if (item) { 
                    if (slot === 'back') {
                        // 確保當前是陣列
                        const currentBack = Array.isArray(newEquipped.back) ? newEquipped.back : (newEquipped.back ? [newEquipped.back] : []);
                        // Toggle邏輯：如果有就拿掉，沒有就加上
                        if (currentBack.some(i => i.id === item.id)) {
                            newEquipped.back = currentBack.filter(i => i.id !== item.id);
                        } else {
                            newEquipped.back = [...currentBack, item];
                        }
                    } else {
                        newEquipped[slot] = item; 
                    }
                } else { 
                    delete newEquipped[slot]; 
                } 
                setData(prev => ({ ...prev, equipped: newEquipped })); 
                // 若不是背飾，裝備後自動關閉彈窗；若是背飾，保留彈窗讓玩家繼續選
                if (slot !== 'back' || !item) {
                    setEquipModalOpen(false); 
                }
            };
            
            const handleSaveTransaction = (tData) => {
                let newData = { ...safeData }; let newAccounts = [...safeData.accounts]; let newLogs = [...safeData.logs];
                if (editingTx) {
                    const oldAccIdx = newAccounts.findIndex(a => a.id == editingTx.accountId); if (oldAccIdx > -1) { newAccounts[oldAccIdx] = { ...newAccounts[oldAccIdx] }; newAccounts[oldAccIdx].balance += (editingTx.type === 'expense' ? editingTx.amount : -editingTx.amount); }
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const txIndex = newData.transactions.findIndex(t => t.id === editingTx.id); if (txIndex > -1) { newData.transactions[txIndex] = { ...editingTx, ...tData }; }
                    newLogs = addLog('system', `Edit Record: ${safeData.categories[tData.category]?.label || 'Other'}`, newLogs); newData.accounts = newAccounts; newData.logs = newLogs; setData(newData); checkUnlockables(newData);
                } else {
                    const newTx = { id: Date.now().toString(), ...tData, date: tData.date || new Date().toISOString().split('T')[0], timestamp: Date.now() };
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const earnedExp = 100; const earnedGold = tData.type === 'income' ? Math.floor(tData.amount * 0.1) + 50 : 50;
                    let newUser = { ...safeData.user }; newUser.gold += earnedGold; newUser.exp += earnedExp;
                    
                    if (newUser.pet) { 
                        newUser.pet.exp = (newUser.pet.exp || 0) + earnedExp;
                        let petExpReq = (newUser.pet.level || 1) * 100;
                        while (newUser.pet.exp >= petExpReq) {
                            newUser.pet.level = (newUser.pet.level || 1) + 1; newUser.pet.exp -= petExpReq;
                            const petDef = PET_DEFINITIONS[newUser.pet.id]; 
                            if (petDef && petDef.nextEvolution && petDef.nextEvolution[newUser.pet.level.toString()]) { 
                                const nextId = petDef.nextEvolution[newUser.pet.level.toString()]; 
                                newUser.pet = { ...newUser.pet, id: nextId, name: PET_DEFINITIONS[nextId].name }; 
                                newLogs = addLog('system', `Pet Evolution: ${PET_DEFINITIONS[nextId].name}!`, newLogs); 
                            }
                            petExpReq = (newUser.pet.level || 1) * 100;
                        }
                    }

                    let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; }
                    newLogs = addLog(tData.type === 'income' ? 'finance_in' : 'finance_out', `${tData.type === 'income' ? t('log_income') : t('log_expense')} ${tData.amount} (${safeData.categories[tData.category]?.label || 'Other'})`, newLogs);
                    newData = { ...newData, user: newUser, transactions: [newTx, ...newData.transactions], accounts: newAccounts, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level });
                }
                setEditingTx(null); setShowAddModal(false);
            };

            const handleDeleteTransaction = (tx) => {
                if(!window.confirm(t('confirmDelete'))) return;
                let newData = { ...safeData }; let newAccounts = [...safeData.accounts]; const accIdx = newAccounts.findIndex(a => a.id == tx.accountId);
                if (accIdx > -1) { newAccounts[accIdx] = { ...newAccounts[accIdx] }; newAccounts[accIdx].balance += (tx.type === 'expense' ? tx.amount : -tx.amount); }
                newData.transactions = newData.transactions.filter(t => t.id !== tx.id); newData.accounts = newAccounts; newData.logs = addLog('system', `Delete Record: ${safeData.categories[tx.category]?.label || 'Other'}`, newData.logs); setData(newData); checkUnlockables(newData);
            };

            const handleClaimQuest = (quest) => { let newUser = { ...safeData.user }; newUser.gold += quest.coins; newUser.exp += quest.exp; let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; } const newClaimed = [...safeData.claimedQuests, quest.uniqueId || quest.id]; const newLogs = addLog('system', `Quest Claimed: ${quest.title}`, safeData.logs); const newData = { ...safeData, user: newUser, claimedQuests: newClaimed, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level }); };
            
            const handleSaveAccount = () => {

                let newAccounts = [...safeData.accounts]; 
                if (editingAccount) { newAccounts = newAccounts.map(a => a.id === editingAccount.id ? { ...a, name: tempAccountName, balance: finalAmount, currency: tempAccountCurrency, type: tempAccountType } : a); } 
                else { newAccounts.push({ id: Date.now(), name: tempAccountName, balance: finalAmount, currency: tempAccountCurrency, type: tempAccountType }); }

            const handleAssetPadClick = (val) => {

            };

            const handleAddFriend = async (id) => {

                    const snap = await db.collection('users').where('user.uid', '==', id).get(); if (snap.empty) { alert(t('user_not_found')); return; }
                    const targetDoc = snap.docs[0]; const targetData = targetDoc.data();

                    const myProfile = { uid: safeData.user.uid, name: safeData.user.name, level: safeData.user.level, title: safeData.user.title, gender: safeData.user.gender, appearance: safeData.user.appearance, equipped: safeData.equipped || {}, lastLogin: 'Online', likes: 0 };
                    let targetFriends = Array.isArray(targetData.friends) ? targetData.friends : []; targetFriends = targetFriends.filter(f => f.uid !== myProfile.uid); targetFriends.push(myProfile);

                } catch (error) { console.error("Add friend error: ", error); alert('新增好友時發生錯誤。'); }
            };
            
            const handleRemoveFriend = (id) => { setData(prev => ({ ...prev, friends: prev.friends.filter(f => f.uid !== id) })); };

            const handleUpdateId = async (newId) => {
                let cost = 0; if (safeData.user.isIdChanged) { cost = ID_CHANGE_COST; if (safeData.user.gold < cost) return; }
                const newGold = safeData.user.gold - cost; const newLogs = addLog('system', `Change ID: ${newId} (Cost: ${cost})`, safeData.logs);
                const newData = { ...safeData, user: { ...safeData.user, uid: newId, gold: newGold, isIdChanged: true }, logs: newLogs }; setData(newData);
                if (authUser) { try { await db.collection('users').doc(authUser.uid).set(newData); } catch(e) { console.error("ID Update error:", e); } }
                localStorage.setItem(`gw_v28_data_${authUser?.uid || 'guest'}`, JSON.stringify(newData));
            };

            const handleAuthSubmit = async (e) => {
                e.preventDefault(); setAuthError(''); const virtualEmail = `${accountInput}@sakura.rpg`;
                try {
                    if (isRegistering) { if (!nicknameInput.trim()) { setAuthError('請輸入暱稱'); return; } const userCredential = await auth.createUserWithEmailAndPassword(virtualEmail, passwordInput); await userCredential.user.updateProfile({ displayName: nicknameInput }); } else { await auth.signInWithEmailAndPassword(virtualEmail, passwordInput); }
                } catch (err) {
                    if (err.code === 'auth/invalid-email') setAuthError('帳號格式錯誤（請輸入英數字）'); else if (err.code === 'auth/email-already-in-use') setAuthError('此帳號已被註冊'); else if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') setAuthError('帳號或密碼錯誤'); else setAuthError(err.message);
                }
            };

            // 🌟 多層次任務清單生成 (大量任務擴充)
            const activeQuests = useMemo(() => {
                const todayStr = new Date().toDateString(); 
                const totalTxCount = safeData.transactions.length; 
                const dailyTxCount = safeData.transactions.filter(t => new Date(t.date).toDateString() === todayStr).length; 
                
                const rate = EXCHANGE_RATES[mainCurrency] || 1; 
                
                const totalExpenseVal = safeData.transactions.filter(t => t.type === 'expense').reduce((a,c) => {
                    const acc = safeData.accounts.find(ac => ac.id == c.accountId);
                    const txRate = acc ? (EXCHANGE_RATES[acc.currency] || 1) : 1;
                    return a + (c.amount / txRate) * rate;
                }, 0); 
                
                const totalAssetVal = safeData.accounts.reduce((a,c) => {
                    const accRate = EXCHANGE_RATES[c.currency] || 1;
                    return a + (c.balance / accRate) * rate;
                }, 0); 
                
                const targetM1 = Math.floor(500 * rate); 
                const targetM2 = Math.floor(5000 * rate);
                const targetM3 = Math.floor(20000 * rate);
                const targetC1 = Math.floor(10000 * rate); 
                const targetC2 = Math.floor(50000 * rate);
                const targetC3 = Math.floor(200000 * rate);
                
                const rawQuests = [
                    // Daily
                    { id: `d0_${todayStr}`, type: 'daily', title: '公會簽到', desc: '每日登入領取補給', exp: 150, coins: 50, progress: 1, target: 1 }, 
                    { id: `d1_${todayStr}`, type: 'daily', title: '勤奮冒險者', desc: '今日記帳 1 次', exp: 100, coins: 50, progress: dailyTxCount, target: 1 }, 
                    { id: `d3_${todayStr}`, type: 'daily', title: '記帳達人', desc: '今日記帳 3 次', exp: 200, coins: 100, progress: dailyTxCount, target: 3 },
                    { id: `d5_${todayStr}`, type: 'daily', title: '財務總管', desc: '今日記帳 5 次', exp: 400, coins: 200, progress: dailyTxCount, target: 5 },
                    // Main
                    { id: 'm1_tx', type: 'main', title: '初次記帳', desc: '記錄第 1 筆消費', exp: 200, coins: 100, progress: totalTxCount > 0 ? 1 : 0, target: 1 }, 
                    { id: 'm10_tx', type: 'main', title: '見習理財家', desc: '記錄 10 筆消費', exp: 400, coins: 200, progress: totalTxCount, target: 10 }, 
                    { id: 'm50_tx', type: 'main', title: '專業會計', desc: '記錄 50 筆消費', exp: 800, coins: 500, progress: totalTxCount, target: 50 }, 
                    { id: 'm_exp1', type: 'main', title: '財務起步', desc: `累積消費 ${targetM1.toLocaleString()} ${mainCurrency}`, exp: 300, coins: 150, progress: totalExpenseVal, target: targetM1 }, 
                    { id: 'm_exp2', type: 'main', title: '消費習慣', desc: `累積消費 ${targetM2.toLocaleString()} ${mainCurrency}`, exp: 600, coins: 300, progress: totalExpenseVal, target: targetM2 }, 
                    { id: 'm_exp3', type: 'main', title: '花錢如流水', desc: `累積消費 ${targetM3.toLocaleString()} ${mainCurrency}`, exp: 1000, coins: 800, progress: totalExpenseVal, target: targetM3 }, 
                    { id: 'm_fr1', type: 'main', title: '交友廣闊', desc: '新增 1 位好友', exp: 200, coins: 100, progress: safeData.friends.length, target: 1 }, 
                    { id: 'm_fr5', type: 'main', title: '萬人迷', desc: '新增 5 位好友', exp: 800, coins: 500, progress: safeData.friends.length, target: 5 }, 
                    { id: 'm_lv10', type: 'main', title: '嶄露頭角', desc: '角色等級達到 10', exp: 500, coins: 500, progress: safeData.user.level, target: 10 }, 
                    // Challenge
                    { id: 'c1', type: 'challenge', title: '儲蓄大師', desc: `總資產 ${targetC1.toLocaleString()} ${mainCurrency}`, exp: 500, coins: 300, progress: totalAssetVal, target: targetC1 }, 
                    { id: 'c2', type: 'challenge', title: '財務自由', desc: `總資產 ${targetC2.toLocaleString()} ${mainCurrency}`, exp: 1000, coins: 500, progress: totalAssetVal, target: targetC2 },
                    { id: 'c3', type: 'challenge', title: '百萬富翁', desc: `總資產 ${targetC3.toLocaleString()} ${mainCurrency}`, exp: 3000, coins: 1500, progress: totalAssetVal, target: targetC3 },
                    { id: 'c_it10', type: 'challenge', title: '裝備大師', desc: '收集 10 件裝備(含魂環)', exp: 1000, coins: 1000, progress: safeData.inventory.length, target: 10 }
                ];
                return rawQuests.map(q => ({ ...q, uniqueId: q.id, isClaimed: safeData.claimedQuests.includes(q.id), isCompleted: q.progress >= q.target })).sort((a, b) => { if (a.isClaimed && !b.isClaimed) return 1; if (!a.isClaimed && b.isClaimed) return -1; if (a.isCompleted && !b.isCompleted) return -1; return 0; });
            }, [safeData.transactions, safeData.accounts, safeData.claimedQuests, mainCurrency, safeData.friends, safeData.inventory, safeData.user.level]);
            
            const pendingQuestCount = activeQuests.filter(q => q.isCompleted && !q.isClaimed).length;

            if (authLoading) return <div className="h-[100dvh] w-full flex items-center justify-center bg-[#f8f9fa] text-xl font-bold font-pixel text-theme-text" data-theme={theme}>Loading...</div>;

            if (!authUser) {
                return (
                    <div className="h-[100dvh] w-full flex flex-col items-center justify-center bg-theme-bg text-theme-text font-pixel relative overflow-hidden" data-theme={theme}>
                        <BackgroundIllustrations theme={theme} />
                        <div className="absolute top-4 right-4 z-20"><button onClick={() => setShowThemeSelect(true)} className="w-12 h-12 bg-theme-card text-theme-accent rounded-full flex items-center justify-center shadow-lg border-2 border-theme-border active:scale-95 transition-transform hover:shadow-xl hover:-translate-y-1"><Icon name="Paint" size={24}/></button></div>
                        <div className="z-10 flex flex-col items-center p-8 bg-theme-glass backdrop-blur-xl rounded-[2.5rem] shadow-2xl border-2 border-theme-border max-w-sm w-11/12">
                            <Icon name="Cloud" size={64} className="text-theme-accent mb-4 animate-float drop-shadow-md" />
                            <h1 className="text-2xl font-bold mb-2 text-theme-text text-center tracking-widest">公會雲端同步系統</h1>
                            <p className="text-theme-sub mb-8 text-xs">{isRegistering ? '建立新的冒險者通行證' : '驗證您的冒險者身分'}</p>
                            <form onSubmit={handleAuthSubmit} className="w-full space-y-4">
                                {isRegistering && (<div className="animate-pop-in"><input type="text" value={nicknameInput} onChange={e=>setNicknameInput(e.target.value)} placeholder="暱稱 (Nickname)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required={isRegistering} /></div>)}
                                <div><input type="text" value={accountInput} onChange={e=>setAccountInput(e.target.value)} placeholder="帳號 (Account)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required /></div>
                                <div><input type="password" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} placeholder="密碼 (Password)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required minLength="6"/></div>
                                {authError && <div className="text-red-500 text-[10px] font-bold text-center bg-red-100 p-2 rounded-lg break-all">{authError}</div>}
                                <button type="submit" className="w-full bg-theme-accent text-white py-4 mt-2 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform hover:brightness-110"><Icon name={isRegistering ? "UserPlus" : "Key"} size={18}/> {isRegistering ? '註冊並開啟金庫' : '登入金庫'}</button>
                            </form>
                            <button onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }} className="mt-6 text-xs text-theme-sub hover:text-theme-text transition-colors font-bold underline decoration-theme-sub/30 underline-offset-4">{isRegistering ? '已有通行證？返回登入' : '第一次來？註冊成為勇者'}</button>
                        </div>
                        {showThemeSelect && <SelectorSheet title={t('theme')} options={THEMES.map(th => ({ value: th.id, label: th.name, color: th.color }))} current={theme} onSelect={setTheme} onClose={() => setShowThemeSelect(false)} getLabel={(opt) => TRANSLATIONS[lang]?.[`theme_${opt.label}`] || opt.label} />}
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-[100dvh] relative z-10 text-theme-text overflow-hidden bg-theme-bg select-none" data-theme={theme}>
                    <BackgroundIllustrations theme={theme} />
                    <header className="px-4 pt-12 pb-2 flex flex-col gap-2 bg-theme-glass sticky top-0 z-20 backdrop-blur-md border-b border-theme-border shrink-0">
                         <div className="flex justify-between items-center w-full">
                              <div className="flex items-center gap-3">
                                  <div className="w-11 h-11 rounded-full bg-theme-card border-2 border-theme-accent overflow-hidden shadow-md flex items-center justify-center cursor-pointer active:scale-95" onClick={() => setShowProfileOptions(true)}>{safeData.user.avatarImage ? <img src={safeData.user.avatarImage} alt="avatar" className="w-full h-full object-cover" style={{imageRendering: 'pixelated'}} /> : <Icon name="UserPlus" size={20} className="text-theme-sub"/>}</div>
                                  <div className="flex flex-col items-start"><div className="flex items-center gap-2"><h1 className="font-bold text-sm text-theme-text">{safeData.user.name}</h1><button onClick={() => { setNewNameInput(safeData.user.name); setShowRenameModal(true); }} className="text-[10px] text-theme-sub hover:text-theme-accent transition-colors p-1"><Icon name="Edit" size={12}/></button></div><button onClick={() => setShowTitleSelect(true)} className="text-[9px] font-bold text-theme-sub mt-0.5 bg-theme-bg px-2 py-0.5 rounded border border-theme-border hover:bg-theme-accent hover:text-white transition-colors">{TITLES_LIST.find(ti => ti.id === safeData.user.title)?.name || safeData.user.title} <Icon name="Edit" size={8} className="inline ml-1"/></button></div>
                              </div>
                              <div className="flex gap-2 items-center">
                                   <div className="flex items-center gap-1 bg-yellow-100/80 px-2 py-1 rounded-full border border-yellow-300 shadow-sm mr-1"><Icon name="Coin" size={14} className="text-yellow-600"/><span className="text-[10px] font-bold text-yellow-800">{safeData.user.gold}</span></div>
                                   <button onClick={() => setShowCurrencySelect(true)} className="w-9 h-9 bg-theme-bg text-theme-text rounded-full flex items-center justify-center shadow-sm border border-theme-border text-[9px] font-bold active:scale-95 transition-transform">{mainCurrency}</button>
                                   <button onClick={() => setLang(l => l === 'zh' ? 'en' : l === 'en' ? 'ja' : 'zh')} className="w-9 h-9 bg-theme-bg text-theme-text rounded-full flex items-center justify-center shadow-sm border border-theme-border text-[9px] font-bold active:scale-95 transition-transform">{lang.toUpperCase()}</button>
                                   <button onClick={() => setShowThemeSelect(true)} className="w-9 h-9 bg-theme-bg text-theme-accent rounded-full flex items-center justify-center shadow-sm border border-theme-border active:scale-95"><Icon name="Paint" size={16}/></button>
                                   <button onClick={() => auth.signOut()} className="w-9 h-9 bg-theme-bg text-red-500 rounded-full flex items-center justify-center shadow-sm border border-red-200 active:scale-95 transition-transform hover:bg-red-50"><Icon name="LogOut" size={16}/></button>
                              </div>
                         </div>
                         <div className="w-full mt-1 relative flex items-center gap-2">
                              <div className="flex-1"><div className="flex justify-between text-[10px] font-bold opacity-60 mb-1 text-theme-sub"><span>NEXT LEVEL</span><span>{safeData.user.exp} / {safeData.user.level * 100}</span></div><div className="w-full h-1.5 bg-theme-bg rounded-full overflow-hidden shadow-inner border border-theme-border"><div className="h-full bg-theme-accent transition-all duration-700" style={{width: `${(safeData.user.exp / (safeData.user.level*100))*100}%`}}></div></div></div>
                              {cloudSyncing && <Icon name="Cloud" size={12} className="text-theme-accent animate-pulse" />}
                         </div>
                    </header>
                    <main className="flex-1 overflow-hidden relative z-10">
                        {view === 'home' && <HomeView user={safeData.user} equipped={safeData.equipped} accounts={safeData.accounts} onOpenAdd={() => setShowAddModal(true)} onOpenAsset={(acc) => { setEditingAccount(acc || null); setTempAccountName(acc?.name || ''); setTempAccountBalance(acc?.balance?.toString() || ''); setTempAccountCurrency(acc?.currency || mainCurrency); setTempAccountType(acc?.type || 'cash'); setAssetModalOpen(true); }} lang={lang} translations={TRANSLATIONS} onRenamePet={handleRenamePet} />}
                        {view === 'shop' && <ShopView gold={safeData.user.gold} inventory={safeData.inventory} equipped={safeData.equipped} user={safeData.user} onBuy={handleBuyItem} lang={lang} translations={TRANSLATIONS} purchaseHistory={safeData.purchaseHistory} />}
                        {view === 'character' && <CharacterView level={safeData.user.level} equipped={safeData.equipped} gender={safeData.user.gender} appearance={safeData.user.appearance} onToggleGender={() => setData(prev => ({ ...prev, user: { ...prev.user, gender: prev.user.gender === 'male' ? 'female' : 'male' } }))} onUpdateAppearance={(newApp) => setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } }))} onEquipSlot={(slot) => { setSelectedSlot(slot); setEquipModalOpen(true); }} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'journal' && <JournalView logs={safeData.logs} transactions={safeData.transactions} categories={safeData.categories} accounts={safeData.accounts} lang={lang} translations={TRANSLATIONS} onEditTx={(tx) => { setEditingTx(tx); setShowAddModal(true); }} onDeleteTx={handleDeleteTransaction} />}
                        {view === 'quests' && <QuestView activeQuests={activeQuests} onClaim={handleClaimQuest} lang={lang} translations={TRANSLATIONS} mainCurrency={mainCurrency} />}
                        {view === 'achievements' && <AchievementView achievements={ACHIEVEMENTS_LIST} unlockedIds={safeData.user.unlockedAchievements} currentStats={currentStats} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'social' && <SocialView user={safeData.user} equipped={safeData.equipped} friends={safeData.friends} onAddFriend={handleAddFriend} onRemoveFriend={handleRemoveFriend} onLikeFriend={handleLikeFriend} onUpdateId={handleUpdateId} lang={lang} translations={TRANSLATIONS} />}
                    </main>
                    <nav className="fixed bottom-0 w-full glass border-t border-theme-border px-1 flex justify-between items-center z-30 h-20 rounded-t-3xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] shrink-0 pb-1 overflow-x-auto no-scrollbar">
                        {[{ id: 'home', icon: 'Home', label: t('adventure') },{ id: 'quests', icon: 'Scroll', label: t('quests'), badge: pendingQuestCount },{ id: 'shop', icon: 'Shop', label: t('shop') },{ id: 'character', icon: 'Sword', label: t('character') },{ id: 'social', icon: 'Users', label: t('social') },{ id: 'achievements', icon: 'Trophy', label: t('achievements') },{ id: 'journal', icon: 'Book', label: t('journal') }].map(nav => (
                            <button key={nav.id} onClick={() => setView(nav.id)} className={`flex flex-col items-center justify-center gap-0.5 min-w-[50px] flex-1 h-12 rounded-2xl transition-all duration-300 relative ${view === nav.id ? 'text-theme-accent -translate-y-4 bg-theme-card shadow-lg border border-theme-border scale-110 z-10' : 'text-theme-sub hover:text-theme-text opacity-70'}`}><Icon name={nav.icon} size={20} strokeWidth={view === nav.id ? 2.5 : 2} /><span className={`text-[9px] font-bold transition-all duration-300 ${view === nav.id ? 'text-theme-accent scale-105' : 'text-theme-sub opacity-80'}`}>{nav.label}</span>{nav.badge ? <span className="absolute top-0 right-3 w-3 h-3 bg-red-500 rounded-full border border-white animate-bounce"></span> : null}</button>
                        ))}
                    </nav>

                    {/* 全局模態框區 */}
                    {showCategoryManager && <CategoryManagerModal categories={safeData.categories} onClose={() => setShowCategoryManager(false)} onSave={(newCats) => { setData(prev => ({...prev, categories: newCats})); setShowCategoryManager(false); }} />}
                    
                    {showRenameModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center animate-[fadeIn_0.2s]">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowRenameModal(false)}></div>
                            <div className="bg-theme-card p-6 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 animate-pop-in">
                                <h3 className="font-bold text-lg text-theme-text mb-4 text-center">更改暱稱</h3>
                                <div className="mb-6"><input type="text" value={newNameInput} onChange={e => setNewNameInput(e.target.value)} className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-3 font-bold text-theme-text outline-none focus:border-theme-accent" autoFocus placeholder="輸入新暱稱..." /></div>
                                <div className="flex gap-3"><button onClick={() => setShowRenameModal(false)} className="flex-1 py-3 rounded-xl font-bold bg-theme-bg border border-theme-border text-theme-sub active:scale-95">{t('cancel')}</button><button onClick={() => { if (!newNameInput.trim()) return; const newLogs = addLog('system', `Change Name: ${newNameInput}`, safeData.logs); setData(prev => ({ ...prev, user: { ...prev.user, name: newNameInput }, logs: newLogs })); if (authUser) { authUser.updateProfile({ displayName: newNameInput }).catch(e => console.error(e)); } setShowRenameModal(false); }} className="flex-1 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 bg-theme-accent"><Icon name="Check" size={16}/> {t('confirm')}</button></div>
                            </div>
                        </div>
                    )}

                    {showAddModal && <AddTransactionModal initialData={editingTx} accounts={safeData.accounts} categories={safeData.categories} onClose={() => { setShowAddModal(false); setEditingTx(null); }} onAdd={handleSaveTransaction} onManageCategories={() => setShowCategoryManager(true)} />}
                    {showPetSelector && <PetSelectorModal onSelect={handleSelectPet} />}
                    
                    {showProfileOptions && (
                        <SelectorSheet title="頭像與外觀設定" options={[{ value: 'edit', label: '編輯角色外觀', desc: '進入更衣室' }, { value: 'upload', label: '上傳圖片', desc: '從裝置選擇' }, { value: 'remove', label: '移除圖片', desc: '使用像素角色' } ]} current="" onSelect={(val) => { if (val === 'edit') setShowAvatarEdit(true); if (val === 'upload') document.getElementById('hidden-file-input')?.click(); if (val === 'remove') setData(prev => ({...prev, user: {...prev.user, avatarImage: ''}})); setShowProfileOptions(false); }} onClose={() => setShowProfileOptions(false)} />
                    )}
                    <input type="file" id="hidden-file-input" className="hidden" accept="image/*" onChange={handleAvatarUpload}/>
                    
                    {showTitleSelect && <SelectorSheet title="更換稱號" options={TITLES_LIST.map(title => {
                        let conditionText = title.condition;
                        if (!safeData.user.unlockedTitles.includes(title.id) && title.getProgress) { conditionText += ` (進度: ${title.getProgress(currentStats, EXCHANGE_RATES[mainCurrency] || 1)})`; }
                        return { value: title.id, label: title.name, desc: title.desc, locked: !safeData.user.unlockedTitles.includes(title.id), condition: conditionText };
                    })} current={safeData.user.title} onSelect={handleSetTitle} onClose={() => setShowTitleSelect(false)} />}
                    
                    {showThemeSelect && <SelectorSheet title={t('theme')} options={THEMES.map(th => ({ value: th.id, label: th.name, color: th.color }))} current={theme} onSelect={setTheme} onClose={() => setShowThemeSelect(false)} getLabel={(opt) => TRANSLATIONS[lang]?.[`theme_${opt.label}`] || opt.label} />}
                    {showCurrencySelect && <SelectorSheet title={t('exchange')} options={MAIN_CURRENCIES.map(c => ({ value: c, label: c }))} current={mainCurrency} onSelect={setMainCurrency} onClose={() => setShowCurrencySelect(false)} />}
                    {showLevelUp.show && <LevelUpOverlay level={showLevelUp.level} onClose={() => setShowLevelUp({ ...showLevelUp, show: false })} />}
                    {showAvatarEdit && safeData.user && <AvatarEditor appearanceData={safeData.user.appearance} onSave={(newApp) => { setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } })); setShowAvatarEdit(false); }} onClose={() => setShowAvatarEdit(false)} />}
                    {equipModalOpen && <InventoryModal slot={selectedSlot} inventory={safeData.inventory} equipped={safeData.equipped} onClose={() => setEquipModalOpen(false)} onEquip={handleEquipItem} />}
                    
                    {assetModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-center px-6 animate-[fadeIn_0.2s]">
                            <div className="bg-theme-card rounded-3xl p-6 shadow-2xl animate-[slideUp_0.2s]">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-lg text-theme-text">{editingAccount ? t('edit_account') : t('new_account')}</h3><button onClick={()=>setAssetModalOpen(false)} className="text-theme-text"><Icon name="X"/></button></div>
                                <div className="space-y-4">
                                    <input type="text" value={tempAccountName} onChange={e=>setTempAccountName(e.target.value)} className="w-full bg-theme-bg p-4 rounded-2xl outline-none font-bold text-theme-text border border-theme-border" placeholder={t('relic_name')}/>
                                    
                                    <div onClick={() => setShowAssetCalc(true)} className="relative w-full bg-theme-bg p-4 rounded-2xl border border-theme-border flex items-center justify-between cursor-pointer group">
                                        <span className={`font-bold ${tempAccountBalance ? 'text-theme-text' : 'text-theme-sub/50'}`}>{tempAccountBalance || t('mana_reserve')}</span>
                                        <div className="p-2 rounded-xl bg-theme-accent/10 text-theme-accent group-hover:scale-110 transition-transform"><Icon name="Calculator" size={20}/></div>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('currency_type')}</label><select value={tempAccountCurrency} onChange={e=>setTempAccountCurrency(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border">{MAIN_CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('container_type')}</label><select value={tempAccountType} onChange={e=>setTempAccountType(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border"><option value="cash">{t('cash')}</option><option value="bank">{t('bank')}</option><option value="card">{t('card')}</option></select></div>
                                    </div>

                                    <button onClick={handleSaveAccount} className="w-full py-4 bg-theme-accent text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">{t('save')}</button>
                                    {editingAccount && <button onClick={() => { const newAccs = safeData.accounts.filter(a => a.id !== editingAccount.id); setData(prev => ({ ...prev, accounts: newAccs })); setAssetModalOpen(false); }} className="w-full py-3 text-red-400 font-bold active:scale-95 transition-transform">{t('delete')}</button>}
                                </div>
                            </div>
                            {showAssetCalc && <MagicAbacus value={tempAccountBalance} onPadClick={handleAssetPadClick} onClose={() => setShowAssetCalc(false)} />}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
