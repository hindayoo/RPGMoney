        const ShopView = ({ gold, inventory, equipped, user, onBuy, lang, translations, purchaseHistory }) => {

                        <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent z-40 animate-[slideUp_0.2s]">

                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/leather.png')] opacity-50"></div>
                                <div className="flex-1 relative z-10"><div className="text-xs text-[#a1887f] font-bold uppercase mb-0.5">{t('buy')}</div><div className="text-lg font-bold text-[#efebe9] font-pixel">{previewItem.name}</div><div className="text-[10px] text-[#8d6e63] italic truncate">{previewItem.desc}</div></div>
                                <button onClick={handleBuyClick} disabled={gold < previewItem.cost} className={`relative z-10 px-6 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all flex flex-col items-center min-w-[100px] ${gold >= previewItem.cost ? 'bg-[#ffca28] text-[#3e2723] hover:brightness-110 border-b-4 border-[#ff6f00]' : 'bg-[#4e342e] text-[#8d6e63] border-b-4 border-[#3e2723] cursor-not-allowed'}`}><span>{gold >= previewItem.cost ? t('buy') : t('not_enough_gold')}</span><span className="text-[10px] opacity-80 font-mono">{previewItem.cost} G</span></button>
                            </div>
                        </div>
                    )}
                    {showConfirmModal && previewItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm animate-[fadeIn_0.2s]">
                            <div className="bg-[#2d1b1e] p-6 rounded-3xl shadow-2xl w-full max-w-xs border-2 border-[#5d4037] text-center relative animate-pop-in">
                                <div className="w-16 h-16 bg-[#ffca28]/10 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-[#ffca28]"><Icon name="Coin" size={32} className="text-[#ffca28]"/></div>
                                <h3 className="font-bold text-lg mb-2 text-[#efebe9]">{t('confirm_buy_title')}</h3>
                                <p className="text-sm text-[#a1887f] mb-6 px-2">Spend <span className="text-[#ffca28] font-bold">{previewItem.cost} G</span> to buy <br/><span className="font-bold text-white">{previewItem.name}</span>?</p>
                                <div className="flex gap-3"><button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3 rounded-xl font-bold text-[#a1887f] bg-[#3e2723] border border-[#5d4037] active:scale-95">{t('cancel')}</button><button onClick={confirmBuy} className="flex-1 py-3 rounded-xl font-bold text-[#3e2723] bg-[#ffca28] shadow-lg active:scale-95 border-b-4 border-[#ff6f00]">{t('confirm')}</button></div>
                            </div>
                        </div>
                    )}
                    {buySuccessId && <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none"><div className="bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-xl animate-bounce flex items-center gap-2"><Icon name="Check" /> {t('buy_success')}</div></div>}
                </div>
            );
        };

        const CharacterView = ({ equipped, onEquipSlot, gender, onToggleGender, appearance, onUpdateAppearance, level, lang, translations }) => {
            const t = (key) => translations[lang]?.[key] || key;
            const [isEditing, setIsEditing] = useState(false);
            const currentGenderColors = appearance[gender];
            const baseStats = { str: 5 + level * 2, int: 5 + level * 2, vit: 10 + level * 5, agi: 5 + level * 2 };
            const totalStats = { ...baseStats };
            Object.values(equipped).forEach(item => { if(item.stats) { if(item.stats.str) totalStats.str = (totalStats.str || 0) + item.stats.str; if(item.stats.int) totalStats.int = (totalStats.int || 0) + item.stats.int; if(item.stats.vit) totalStats.vit = (totalStats.vit || 0) + item.stats.vit; if(item.stats.agi) totalStats.agi = (totalStats.agi || 0) + item.stats.agi; } });
            const derivedStats = { hp: totalStats.vit * 20, mp: totalStats.int * 10, atk: totalStats.str * 5, def: totalStats.vit * 2, spd: totalStats.agi * 2, cri: Math.floor(totalStats.agi * 0.2) };
            const cp = derivedStats.hp + derivedStats.atk + derivedStats.def + derivedStats.spd;
            const renderSlot = (slotData) => {
                const item = equipped[slotData.slot]; 
                if (!item) {
                    return ( <div className="w-12 h-12 rounded-xl border-2 border-dashed border-theme-sub/40 bg-black/5 flex flex-col items-center justify-center relative transition-all cursor-pointer hover:bg-black/10 active:scale-95" onClick={() => onEquipSlot(slotData.slot)}><div className="absolute text-xl text-theme-sub/30 font-mono top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">+</div><div className="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[9px] font-bold text-theme-sub whitespace-nowrap bg-theme-bg/90 px-1 rounded-sm shadow-sm">{t(slotData.name)}</div></div> );
                }
                return ( <div className={`w-12 h-12 rounded-xl border-2 bg-theme-card flex flex-col items-center justify-center shadow-md relative transition-all cursor-pointer hover:scale-105 active:scale-95 rarity-${item.rarity}`} onClick={() => onEquipSlot(slotData.slot)}><Icon name={item.icon} size={20} className="text-theme-text pixel-icon"/><div className="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[9px] font-bold text-theme-sub whitespace-nowrap bg-theme-bg/90 px-1 rounded-sm shadow-sm">{item.name.substring(0,4)}</div></div> );
            };
            const ProgressBar = ({ val, max, color }) => (<div className="h-1.5 w-full bg-black/10 rounded-full overflow-hidden mt-1"><div className={`h-full ${color}`} style={{ width: `${Math.min((val / max) * 100, 100)}%` }}></div></div>);

            return (
                <div className="animate-[fadeIn_0.5s] space-y-6 p-4 pb-24 h-full overflow-y-auto">
                    <div className="flex justify-between items-center bg-theme-card p-2 rounded-2xl shadow-sm border border-theme-border">
                         <div className="flex items-center gap-2"><div className="text-xs font-bold text-yellow-600 bg-yellow-100 px-3 py-1 rounded-full border border-yellow-300 shadow-sm animate-pulse-slow">CP: <span className="text-sm font-black">{cp}</span></div></div>
                         <div className="flex gap-2"><button onClick={onToggleGender} className="w-8 h-8 flex items-center justify-center rounded-full bg-theme-bg border border-theme-border active:scale-95 font-bold text-theme-text">{gender === 'female' ? '♀' : '♂'}</button><button onClick={() => setIsEditing(true)} className="text-xs bg-theme-accent text-white px-3 py-1 rounded-full font-bold flex items-center gap-1 active:scale-95 shadow-md"><Icon name="Paint" size={12} /> {t('dressing_room')}</button></div>
                    </div>
                    <div className="relative w-full h-[320px] flex items-center justify-center">
                        <div className="absolute bottom-10 width-[140px] height-[30px] rounded-full bg-theme-accent/30 animate-pulse blur-xl"></div>
                        <div className="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col gap-8 z-30">{renderSlot({slot: 'head', name:'head'})}{renderSlot({slot: 'body', name:'body'})}{renderSlot({slot: 'mainHand', name:'mainHand'})}</div>
                        <div className="relative z-20 transform translate-y-6"><PixelAvatar gender={gender} colors={currentGenderColors} equipped={equipped} className="w-60 h-60 object-contain drop-shadow-2xl filter contrast-110"/></div>
                        <div className="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-8 z-30">{renderSlot({slot: 'back', name:'back'})}{renderSlot({slot: 'offHand', name:'offHand'})}{renderSlot({slot: 'feet', name:'feet'})}</div>
                    </div>
                    <div className="bg-theme-card p-5 rounded-3xl border border-theme-border shadow-sm relative z-40">
                        <h3 className="font-bold opacity-60 text-sm flex items-center gap-1 text-theme-text mb-4"><Icon name="Sword" size={14}/> {t('character_stats')}</h3>
                        <div className="grid grid-cols-4 gap-2 mb-6">
                            {[{ label: 'STR', val: totalStats.str, icon: 'Sword', color: 'text-red-500', bg: 'bg-red-100' },{ label: 'INT', val: totalStats.int, icon: 'Gem', color: 'text-blue-500', bg: 'bg-blue-100' },{ label: 'VIT', val: totalStats.vit, icon: 'Heart', color: 'text-green-500', bg: 'bg-green-100' },{ label: 'AGI', val: totalStats.agi, icon: 'Zap', color: 'text-yellow-500', bg: 'bg-yellow-100' }].map(stat => (
                                <div key={stat.label} className="flex flex-col items-center p-2 rounded-xl bg-theme-bg border border-theme-border shadow-sm"><div className={`p-1.5 rounded-full mb-1 ${stat.bg}`}><Icon name={stat.icon} size={12} className={stat.color}/></div><span className="text-[9px] font-bold text-theme-sub opacity-70">{stat.label}</span><span className="font-mono font-bold text-lg leading-none text-theme-text">{stat.val}</span></div>
                            ))}
                        </div>
                        <div className="space-y-4">
                            <div className="flex gap-4"><div className="flex-1"><div className="flex justify-between text-xs font-bold mb-1"><span className="text-green-600 flex items-center gap-1"><Icon name="Heart" size={10}/> HP</span><span>{derivedStats.hp}</span></div><ProgressBar val={derivedStats.hp} max={2000} color="bg-green-500" /></div><div className="flex-1"><div className="flex justify-between text-xs font-bold mb-1"><span className="text-blue-600 flex items-center gap-1"><Icon name="Zap" size={10}/> MP</span><span>{derivedStats.mp}</span></div><ProgressBar val={derivedStats.mp} max={1000} color="bg-blue-500" /></div></div>
                            <div className="grid grid-cols-3 gap-3 pt-4 border-t border-dashed border-theme-border mt-2"><div className="text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1">Attack</div><div className="text-xl font-mono font-bold text-theme-text">{derivedStats.atk}</div></div><div className="text-center border-l border-r border-theme-border"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1">Defense</div><div className="text-xl font-mono font-bold text-theme-text">{derivedStats.def}</div></div><div className="text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1">Crit Rate</div><div className="text-xl font-mono font-bold text-theme-text">{derivedStats.cri}%</div></div></div>
                        </div>
                    </div>
                    {isEditing && <AvatarEditor appearanceData={appearance} onSave={(newAppearanceData) => { onUpdateAppearance(newAppearanceData); setIsEditing(false); }} onClose={() => setIsEditing(false)} />}
                </div>
            );
        };

        const JournalView = ({ logs, transactions, categories, lang, translations, onEditTx }) => {
            const [subView, setSubView] = useState('fin');
            const [timeFilter, setTimeFilter] = useState('month');
            const [calDate, setCalDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(null);
            
            const [showMonthPicker, setShowMonthPicker] = useState(false);
            const [pickerYear, setPickerYear] = useState(calDate.getFullYear());

            const t = (key) => translations[lang]?.[key] || key;
            const financialStats = useMemo(() => {
                const now = new Date(); const todayStr = now.toDateString(); const currentMonth = now.getMonth(); const currentYear = now.getFullYear();
                let filteredTxs = transactions;
                if (timeFilter === 'today') { filteredTxs = transactions.filter(t => new Date(t.date).toDateString() === todayStr); } 
                else if (timeFilter === 'month') { filteredTxs = transactions.filter(t => { const d = new Date(t.date); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }); }
                return { in: filteredTxs.filter(t => t.type === 'income').reduce((a,c) => a + c.amount, 0), out: filteredTxs.filter(t => t.type === 'expense').reduce((a,c) => a + c.amount, 0), net: filteredTxs.reduce((a,c) => c.type === 'income' ? a + c.amount : a - c.amount, 0), txs: filteredTxs };
            }, [transactions, timeFilter]);
            
            const formatLogMsg = (log) => {
                if (log.msg.includes('收入') || log.msg.includes('支出')) return log.msg;
                if (log.msg.includes('Quest Claimed')) return `${t('log_sys_quest')}: ${log.msg.split(': ')[1]}`;
                if (log.msg.includes('Title Unlocked')) return `${t('log_sys_title')}: ${log.msg.split(': ')[1]}`;
                if (log.msg.includes('Achievement Unlocked')) return `🏆 成就解鎖: ${log.msg.split(': ')[1]}`;
                if (log.msg.includes('Bought')) return `🛒 購買: ${log.msg.split(': ')[1]}`;
                return log.msg;
            };
            
            const filteredLogs = useMemo(() => logs.filter(l => l.type === 'system'), [logs]);

            const renderCalendar = () => {
                const year = calDate.getFullYear(); const month = calDate.getMonth(); const daysInMonth = new Date(year, month + 1, 0).getDate(); const firstDay = new Date(year, month, 1).getDay();
                const daysArray = Array.from({length: firstDay}, () => null).concat(Array.from({length: daysInMonth}, (_, i) => i + 1));
                const getDailyStats = (day) => { if (!day) return null; const dateStr = new Date(year, month, day).toDateString(); const dailyTxs = transactions.filter(tx => new Date(tx.date).toDateString() === dateStr); return { inc: dailyTxs.filter(t => t.type === 'income').reduce((a,c) => a + c.amount, 0), exp: dailyTxs.filter(t => t.type === 'expense').reduce((a,c) => a + c.amount, 0), txs: dailyTxs }; };
                const selectedDateStr = selectedDate ? new Date(year, month, selectedDate).toDateString() : null;
                const selectedTxs = selectedDate ? transactions.filter(tx => new Date(tx.date).toDateString() === selectedDateStr) : [];

                return (
                    <div className="flex flex-col gap-4 animate-[fadeIn_0.3s]">
                        <div className="flex justify-center items-center bg-theme-card p-3 rounded-2xl shadow-sm border border-theme-border">
                            <button onClick={() => {setPickerYear(year); setShowMonthPicker(true);}} className="flex-1 py-1.5 bg-theme-bg hover:bg-theme-accent/20 rounded-lg active:scale-95 text-theme-text transition-colors shadow-sm border border-theme-border/50 flex items-center justify-center gap-2"><span className="font-bold font-pixel tracking-widest">{year} 年 {month + 1} 月</span><Icon name="ArrowDown" size={14} /></button>
                        </div>

                        <div className="bg-theme-card rounded-2xl p-4 border border-theme-border shadow-sm">
                            <div className="grid grid-cols-7 gap-1 text-center mb-2">{['日','一','二','三','四','五','六'].map((d, i) => <div key={d} className={`text-[10px] font-bold ${i===0 || i===6 ? 'text-red-400' : 'text-theme-sub'}`}>{d}</div>)}</div>
                            <div className="grid grid-cols-7 gap-1">
                                {daysArray.map((day, idx) => {
                                    const stats = getDailyStats(day); const isSelected = day === selectedDate; const isToday = day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
                                    return (
                                        <div key={idx} onClick={() => day && setSelectedDate(isSelected ? null : day)} className={`relative flex flex-col items-center justify-start pt-1 pb-1.5 h-[52px] rounded-xl border-2 transition-all ${day ? 'cursor-pointer active:scale-95' : 'border-transparent'} ${isSelected ? 'border-theme-accent bg-theme-accent/10 shadow-sm z-10 scale-105' : day ? 'border-transparent hover:bg-theme-bg' : ''} ${isToday && !isSelected ? 'bg-yellow-500/10 border-yellow-400/50' : ''}`}>
                                            {day && (<><span className={`text-xs font-bold leading-none mb-1 ${isToday ? 'text-theme-accent' : 'text-theme-text'}`}>{day}</span><div className="flex flex-col gap-0.5 items-center w-full">{stats.inc > 0 && <span className="text-[8px] font-mono text-green-500 leading-none bg-green-50 px-1 rounded truncate max-w-[90%]">+{stats.inc}</span>}{stats.exp > 0 && <span className="text-[8px] font-mono text-red-500 leading-none bg-red-50 px-1 rounded truncate max-w-[90%]">-{stats.exp}</span>}</div></>)}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        {selectedDate && (
                            <div className="bg-theme-card p-4 rounded-2xl border border-theme-border shadow-sm animate-[slideUp_0.2s]">
                                <h4 className="text-xs font-bold text-theme-sub mb-3 uppercase flex items-center gap-2"><Icon name="Scroll" size={14} className="text-theme-accent"/> {month+1}月{selectedDate}日 行動紀錄</h4>
                                <div className="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                                    {selectedTxs.length > 0 ? selectedTxs.map(tx => (
                                        <div key={tx.id} className="flex justify-between items-center py-2 px-3 bg-theme-bg rounded-xl border border-theme-border/50 shadow-sm">
                                            <div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center text-white shadow-inner ${tx.type === 'income' ? 'bg-green-400' : 'bg-red-400'}`}><Icon name={categories[tx.category]?.icon || 'ShoppingBag'} size={14}/></div><div><div className="text-sm font-bold text-theme-text">{categories[tx.category]?.label || '其他'}</div>{tx.note && <div className="text-[10px] text-theme-sub truncate max-w-[120px]">{tx.note}</div>}</div></div>
                                            <div className="flex items-center gap-2"><div className={`font-mono font-bold text-lg ${tx.type === 'income' ? 'text-green-500' : 'text-red-500'}`}>{tx.type === 'income' ? '+' : '-'}{tx.amount}</div><button onClick={() => onEditTx(tx)} className="p-1.5 bg-theme-card rounded-lg text-theme-sub hover:text-theme-accent active:scale-95 shadow-sm border border-theme-border"><Icon name="Edit" size={14}/></button></div>
                                        </div>
                                    )) : <div className="text-[10px] text-theme-sub text-center py-6 bg-theme-bg rounded-xl border border-theme-border border-dashed">本日無紀錄</div>}
                                </div>
                            </div>
                        )}
                        
                        {showMonthPicker && (
                            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-[fadeIn_0.2s]">
                                <div className="bg-theme-card p-6 rounded-3xl shadow-2xl border-2 border-theme-border w-11/12 max-w-sm relative z-10 animate-[popIn_0.2s]">
                                    <div className="flex justify-between items-center mb-6"><button onClick={()=>setPickerYear(y=>y-1)} className="p-2 bg-theme-bg rounded-lg active:scale-95 text-theme-sub"><Icon name="ArrowUp" className="-rotate-90"/></button><span className="font-bold text-xl font-pixel text-theme-text">{pickerYear} 年</span><button onClick={()=>setPickerYear(y=>y+1)} className="p-2 bg-theme-bg rounded-lg active:scale-95 text-theme-sub"><Icon name="ArrowUp" className="rotate-90"/></button></div>
                                    <div className="grid grid-cols-4 gap-3 mb-6">
                                        {Array.from({length: 12}, (_, i) => (<button key={i} onClick={() => { setCalDate(new Date(pickerYear, i, 1)); setSelectedDate(null); setShowMonthPicker(false); }} className={`py-3 rounded-xl font-bold text-sm transition-all border active:scale-95 ${calDate.getFullYear() === pickerYear && calDate.getMonth() === i ? 'bg-theme-accent text-white border-theme-accent shadow-md scale-105' : 'bg-theme-bg text-theme-text border-theme-border hover:border-theme-accent/50'}`}>{i+1}月</button>))}
                                    </div>
                                    <button onClick={()=>setShowMonthPicker(false)} className="w-full py-3 bg-theme-bg text-theme-sub font-bold rounded-xl active:scale-95 border border-theme-border">取消</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="animate-[fadeIn_0.5s] space-y-4 p-4 pb-24 h-full overflow-y-auto bg-theme-bg">
                    <div className="flex bg-theme-card p-1 rounded-xl border border-theme-border shadow-sm">
                        <button onClick={() => setSubView('fin')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${subView === 'fin' ? 'bg-theme-accent text-white shadow' : 'text-theme-sub hover:bg-theme-bg'}`}>財務變動</button>
                        <button onClick={() => setSubView('cal')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${subView === 'cal' ? 'bg-theme-accent text-white shadow' : 'text-theme-sub hover:bg-theme-bg'}`}>行事曆</button>
                        <button onClick={() => setSubView('sys')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${subView === 'sys' ? 'bg-theme-accent text-white shadow' : 'text-theme-sub hover:bg-theme-bg'}`}>系統事件</button>
                    </div>

                    {subView === 'cal' && renderCalendar()}

                    {subView === 'fin' && (
                        <div className="glass p-5 rounded-3xl border border-theme-border relative overflow-hidden animate-[fadeIn_0.3s]">
                            <div className="absolute top-0 right-0 w-24 h-24 bg-theme-accent/5 rounded-full blur-2xl -translate-y-10 translate-x-10"></div>
                            <div className="flex justify-between items-center mb-4 relative z-10"><h3 className="font-bold text-sm text-theme-text flex items-center gap-2"><Icon name="Chart" size={16} className="text-theme-accent"/> {timeFilter === 'all' ? '總覽' : timeFilter === 'month' ? '本月' : '今日'}魔力總量</h3><div className={`font-mono text-xl font-bold ${financialStats.net >= 0 ? 'text-green-500' : 'text-red-500'}`}>{financialStats.net >= 0 ? '+' : ''}{financialStats.net}</div></div>
                            <div className="flex gap-3 relative z-10 mb-5"><div className="flex-1 bg-theme-bg/50 p-3 rounded-2xl border border-theme-border/50 flex flex-col items-center shadow-sm"><span className="text-[10px] text-green-600 font-bold mb-1 uppercase">Income</span><span className="text-lg font-mono font-bold text-green-500">+{financialStats.in}</span></div><div className="flex-1 bg-theme-bg/50 p-3 rounded-2xl border border-theme-border/50 flex flex-col items-center shadow-sm"><span className="text-[10px] text-red-600 font-bold mb-1 uppercase">Expense</span><span className="text-lg font-mono font-bold text-red-500">-{financialStats.out}</span></div></div>
                            <div className="flex justify-start gap-2 relative z-10 border-t border-theme-border/50 pt-4">{['all', 'month', 'today'].map((tf) => (<button key={tf} onClick={() => setTimeFilter(tf)} className={`px-4 py-1.5 rounded-full text-[10px] font-bold border transition-all active:scale-95 shadow-sm ${timeFilter === tf ? 'bg-theme-accent text-white border-theme-accent' : 'bg-theme-bg text-theme-sub border-theme-border hover:brightness-95'}`}>{tf === 'all' ? '全部' : tf === 'month' ? '本月' : '今日'}</button>))}</div>
                        </div>
                    )}

                    {subView === 'fin' && (
                        <div className="space-y-3 pb-20 min-h-[200px] animate-[fadeIn_0.3s]">
                            {financialStats.txs.length > 0 ? financialStats.txs.map(tx => (
                                <div key={tx.id} className="bg-theme-card p-4 rounded-2xl flex gap-3 items-center active:scale-[0.99] transition-transform border border-theme-border shadow-sm">
                                    <div className={`w-1.5 h-12 rounded-full shrink-0 ${tx.type === 'income' ? 'bg-green-400' : 'bg-red-400'}`}></div>
                                    <div className="flex-1 min-w-0">
                                        <div className="flex justify-between items-center mb-1"><span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-theme-bg border border-theme-border/50 text-theme-sub">{new Date(tx.date).toLocaleDateString()}</span><span className="text-[10px] opacity-40 font-mono">{new Date(tx.timestamp || tx.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
                                        <div className="flex justify-between items-center"><div className="text-sm font-bold text-theme-text truncate">{categories[tx.category]?.label || '其他'} <span className="text-[10px] font-normal text-theme-sub ml-1">{tx.note ? `(${tx.note})` : ''}</span></div><div className="flex items-center gap-3"><div className={`font-mono font-bold ${tx.type === 'income' ? 'text-green-500' : 'text-red-500'}`}>{tx.type === 'income' ? '+' : '-'}{tx.amount}</div><button onClick={() => onEditTx(tx)} className="p-1.5 bg-theme-bg rounded-lg text-theme-sub hover:text-theme-accent active:scale-95 border border-theme-border/50"><Icon name="Edit" size={14}/></button></div></div>
                                    </div>
                                </div>
                            )) : <div className="flex flex-col items-center justify-center py-10 opacity-50"><Icon name="Ghost" size={48} className="text-theme-sub mb-2"/><span className="text-xs text-theme-sub font-bold">尚無相關紀錄</span></div>}

                            const doc = await db.collection('users').doc(user.uid).get();
                            if (doc.exists) {
                                const cloudData = doc.data();
                                setData({ ...data, ...cloudData, user: { ...data.user, ...cloudData.user, uid: cloudData.user?.uid || user.uid, name: cloudData.user?.name || user.displayName || 'Hero' } });
                            } else {
                                let newInitialData = { ...data };
                                newInitialData.user = { ...newInitialData.user, uid: user.uid, name: user.displayName || 'Hero' };
                                newInitialData.friends = [{ uid: 'mock_1', name: 'Sakura Guide', gender: 'female', level: 10, title: 'Novice', appearance: { hair: '#f472b6', skin: '#ffccbc', armor: '#fff', cape: '#ec4899' }, equipped: { head: SHOP_ITEMS[1], mainHand: SHOP_ITEMS[3] }, lastLogin: 'Online', likes: 999 }];
                                setData(newInitialData);
                                await db.collection('users').doc(user.uid).set(newInitialData);
                            }
                        } catch (e) {
                            const fallbackData = localStorage.getItem(`gw_v28_data_${user.uid}`);
                            if (fallbackData) setData({ ...data, ...JSON.parse(fallbackData) });
                        }
                    } else {
                        setAuthUser(null);
                    }
                    setAuthLoading(false);
                });

                const savedTheme = localStorage.getItem('gw_theme'); if (savedTheme) setTheme(savedTheme);
                const savedLang = localStorage.getItem('gw_lang'); if (savedLang) setLang(savedLang);
                const savedCurr = localStorage.getItem('gw_curr'); if (savedCurr) setMainCurrency(savedCurr);
                return () => unsubscribe();
            }, []);

            useEffect(() => { if (!authLoading && authUser && data.user && !data.user.pet && !showPetSelector) { setShowPetSelector(true); } }, [data.user?.pet, authUser, authLoading]);
            
            useEffect(() => { 
                if (authUser && data && !authLoading) {
                    const timer = setTimeout(() => {
                        setCloudSyncing(true);
                        db.collection('users').doc(authUser.uid).set(data).then(() => setCloudSyncing(false)).catch(e => { console.error("Sync error", e); setCloudSyncing(false); });
                        localStorage.setItem(`gw_v28_data_${authUser.uid}`, JSON.stringify(data)); 
                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [data, authUser, authLoading]);
            
            useEffect(() => { document.body.setAttribute('data-theme', theme); localStorage.setItem('gw_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('gw_lang', lang); }, [lang]);
            useEffect(() => { localStorage.setItem('gw_curr', mainCurrency); }, [mainCurrency]);

            const t = (key) => TRANSLATIONS[lang]?.[key] || key;
            const addLog = (type, msg, currentLogs) => { const newLog = { id: Date.now(), date: new Date().toISOString(), type, msg }; return [newLog, ...currentLogs].slice(0, 50); };
            const checkUnlockables = (currentData) => {
                const stats = { txCount: currentData.transactions.length, expenseTotal: currentData.transactions.filter(t => t.type === 'expense').reduce((a,c) => a + c.amount, 0), balance: currentData.accounts.reduce((a,c) => a + c.balance, 0), questCount: currentData.claimedQuests.length, level: currentData.user ? currentData.user.level : 1, itemCount: currentData.inventory.length, friendCount: currentData.friends.length };
                let newUser = { ...currentData.user }; let logs = [...currentData.logs]; let updated = false;
                TITLES_LIST.forEach(t => { if (!newUser.unlockedTitles.includes(t.id) && t.check(stats, 1)) { newUser.unlockedTitles.push(t.id); logs = addLog('system', `獲得稱號: ${t.name}`, logs); updated = true; } });
                ACHIEVEMENTS_LIST.forEach(ach => {
                    if (!newUser.unlockedAchievements.includes(ach.id)) {
                        let achieved = false;
                        if (ach.type === 'txCount' && stats.txCount >= ach.target) achieved = true;
                        if (ach.type === 'expenseTotal' && stats.expenseTotal >= ach.target) achieved = true;
                        if (ach.type === 'balance' && stats.balance >= ach.target) achieved = true;
                        if (ach.type === 'questCount' && stats.questCount >= ach.target) achieved = true;
                        if (ach.type === 'level' && stats.level >= ach.target) achieved = true;
                        if (achieved) { newUser.unlockedAchievements.push(ach.id); logs = addLog('system', `成就解鎖: ${ach.title}`, logs); updated = true; }
                    }
                });
                if (updated) { setData({ ...currentData, user: newUser, logs }); }
            };

            const handleAvatarUpload = (e) => { const file = e.target.files?.[0]; if (file && data.user) { const reader = new FileReader(); reader.onloadend = () => { setData(prev => ({ ...prev, user: { ...prev.user, avatarImage: reader.result } })); setShowProfileOptions(false); }; reader.readAsDataURL(file); } };
            const handleSelectPet = (petId) => { if (!data.user) return; const newPet = { id: petId, name: PET_DEFINITIONS[petId].name, exp: 0, level: 1, bond: 0 }; setData(prev => ({ ...prev, user: { ...prev.user, pet: newPet } })); setShowPetSelector(false); };
            const handleRenamePet = (newName) => { if (!data.user || !data.user.pet) return; setData(prev => ({ ...prev, user: { ...prev.user, pet: { ...prev.user.pet, name: newName } } })); };
            const handleSetTitle = (titleId) => { if (!data.user) return; setData(prev => ({ ...prev, user: { ...prev.user, title: titleId } })); };
            const handleBuyItem = (item) => {
                if (!data.user) return; const newGold = data.user.gold - item.cost; const newInventory = [...data.inventory, item]; const newLogs = addLog('system', `購買: ${item.name}`, data.logs);
                const newPurchase = { id: Date.now().toString(), itemId: item.id, itemName: item.name, cost: item.cost, date: new Date().toISOString() };
                setData(prev => ({ ...prev, user: { ...prev.user, gold: newGold }, inventory: newInventory, logs: newLogs, purchaseHistory: [newPurchase, ...(data.purchaseHistory || [])] }));
            };
            const handleEquipItem = (slot, item) => { const newEquipped = { ...data.equipped }; if (item) { newEquipped[slot] = item; } else { delete newEquipped[slot]; } setData(prev => ({ ...prev, equipped: newEquipped })); setEquipModalOpen(false); };
            
            const handleSaveTransaction = (tData) => {
                if (!data.user) return; let newData = { ...data }; let newAccounts = [...data.accounts]; let newLogs = [...data.logs];
                if (editingTx) {
                    const oldAccIdx = newAccounts.findIndex(a => a.id == editingTx.accountId); if (oldAccIdx > -1) { newAccounts[oldAccIdx] = { ...newAccounts[oldAccIdx] }; newAccounts[oldAccIdx].balance += (editingTx.type === 'expense' ? editingTx.amount : -editingTx.amount); }
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const txIndex = newData.transactions.findIndex(t => t.id === editingTx.id); if (txIndex > -1) { newData.transactions[txIndex] = { ...editingTx, ...tData }; }
                    newLogs = addLog('system', `編輯紀錄: ${data.categories[tData.category]?.label || '其他'}`, newLogs); newData.accounts = newAccounts; newData.logs = newLogs; setData(newData); checkUnlockables(newData);
                } else {
                    const newTx = { id: Date.now().toString(), ...tData, date: new Date().toISOString().split('T')[0], timestamp: Date.now() };
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const earnedExp = 100; const earnedGold = tData.type === 'income' ? Math.floor(tData.amount * 0.1) + 50 : 50;
                    let newUser = { ...data.user }; newUser.gold += earnedGold; newUser.exp += earnedExp;
                    if (newUser.pet) { const petDef = PET_DEFINITIONS[newUser.pet.id]; if (petDef && petDef.nextEvolution && petDef.nextEvolution[newUser.level.toString()]) { const nextId = petDef.nextEvolution[newUser.level.toString()]; newUser.pet = { ...newUser.pet, id: nextId, name: PET_DEFINITIONS[nextId].name }; newLogs = addLog('system', `寵物進化: ${PET_DEFINITIONS[nextId].name}!`, newLogs); } }
                    let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; }
                    newLogs = addLog(tData.type === 'income' ? 'finance_in' : 'finance_out', `${tData.type === 'income' ? '收入' : '支出'} ${tData.amount} (${data.categories[tData.category]?.label || '其他'})`, newLogs);
                    newData = { ...newData, user: newUser, transactions: [newTx, ...newData.transactions], accounts: newAccounts, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level });
                }
                setEditingTx(null); setShowAddModal(false);
            };

            const handleClaimQuest = (quest) => { if (!data.user) return; let newUser = { ...data.user }; newUser.gold += quest.coins; newUser.exp += quest.exp; let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; } const newClaimed = [...data.claimedQuests, quest.uniqueId || quest.id]; const newLogs = addLog('system', `任務完成: ${quest.title}`, data.logs); const newData = { ...data, user: newUser, claimedQuests: newClaimed, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level }); };
            
            const handleSaveAccount = () => { 
                if (!tempAccountName || tempAccountBalance === '') return; 
                const balance = parseFloat(tempAccountBalance); 
                let newAccounts = [...data.accounts]; 
                if (editingAccount) { 
                    newAccounts = newAccounts.map(a => a.id === editingAccount.id ? { ...a, name: tempAccountName, balance: balance, currency: tempAccountCurrency, type: tempAccountType } : a); 
                } else { 
                    newAccounts.push({ id: Date.now(), name: tempAccountName, balance: balance, currency: tempAccountCurrency, type: tempAccountType }); 
                } 
                setData(prev => ({ ...prev, accounts: newAccounts })); setAssetModalOpen(false); 
            };
            
            const handleAddFriend = (id) => { if (!id || !id.trim() || data.friends.some(f => f.uid === id)) return; const newFriend = { uid: id, name: `冒險者 ${id.substring(0,4)}`, level: Math.floor(Math.random() * 50) + 1, title: 'Novice', gender: Math.random() > 0.5 ? 'male' : 'female', appearance: DEFAULT_APPEARANCE, equipped: { mainHand: SHOP_ITEMS[0], body: Math.random() > 0.5 ? SHOP_ITEMS[4] : undefined }, lastLogin: 'Online', likes: 0 }; const newLogs = addLog('system', `新增好友: ${newFriend.name}`, data.logs); setData(prev => ({ ...prev, friends: [...(prev.friends || []), newFriend], logs: newLogs })); };
            const handleRemoveFriend = (id) => { setData(prev => ({ ...prev, friends: prev.friends.filter(f => f.uid !== id) })); };
            const handleLikeFriend = (id) => { setData(prev => ({ ...prev, friends: prev.friends.map(f => { if (f.uid === id) { return { ...f, likes: (f.likes || 0) + 1, lastInteract: new Date().toISOString() }; } return f; }) })); };
            
            const handleUpdateId = async (newId) => {
                if (!data.user) return;
                let cost = 0; if (data.user.isIdChanged) { cost = ID_CHANGE_COST; if (data.user.gold < cost) return; }
                const newGold = data.user.gold - cost;
                const newLogs = addLog('system', `更名為: ${newId} (費用: ${cost})`, data.logs);
                const newData = { ...data, user: { ...data.user, uid: newId, gold: newGold, isIdChanged: true }, logs: newLogs };
                setData(newData);
                if (authUser) { try { await db.collection('users').doc(authUser.uid).set(newData); } catch(e) { console.error("更新ID失敗", e); } }
                localStorage.setItem(`gw_v28_data_${authUser?.uid || 'guest'}`, JSON.stringify(newData));
            };

            const handleAuthSubmit = async (e) => {
                e.preventDefault(); setAuthError(''); const virtualEmail = `${accountInput}@sakura.rpg`;
                try {
                    if (isRegistering) {
                        if (!nicknameInput.trim()) { setAuthError('請輸入暱稱'); return; }
                        const userCredential = await auth.createUserWithEmailAndPassword(virtualEmail, passwordInput);
                        await userCredential.user.updateProfile({ displayName: nicknameInput });
                    } else { await auth.signInWithEmailAndPassword(virtualEmail, passwordInput); }
                } catch (err) {
                    if (err.code === 'auth/invalid-email') setAuthError('帳號格式錯誤（請輸入英數字）');
                    else if (err.code === 'auth/email-already-in-use') setAuthError('此帳號已被註冊');
                    else if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') setAuthError('帳號或密碼錯誤');
                    else setAuthError(err.message);
                }
            };

            const activeQuests = useMemo(() => {
                if (!data.user) return [];
                const todayStr = new Date().toDateString(); const totalTxCount = data.transactions.length; const dailyTxCount = data.transactions.filter(t => new Date(t.date).toDateString() === todayStr).length;
                const rate = EXCHANGE_RATES[mainCurrency] || 1; const totalExpenseVal = data.transactions.filter(t => t.type === 'expense').reduce((a,c)=>a+c.amount, 0); const totalAssetVal = data.accounts.reduce((a,c)=>a+c.balance, 0);
                const targetM2 = Math.floor(500 * rate); const targetC1 = Math.floor(10000 * rate); const targetC2 = Math.floor(50000 * rate);
                const rawQuests = [
                    { id: `d0_${todayStr}`, type: 'daily', title: '公會簽到', desc: '每日登入領取補給', exp: 150, coins: 50, progress: 1, target: 1 },
                    { id: `d1_${todayStr}`, type: 'daily', title: '勤奮冒險者', desc: '今日記帳 1 次', exp: 100, coins: 50, progress: dailyTxCount, target: 1 },
                    { id: `d3_${todayStr}`, type: 'daily', title: '記帳達人', desc: '今日記帳 3 次', exp: 200, coins: 100, progress: dailyTxCount, target: 3 },
                    { id: 'm1', type: 'main', title: '初次記帳', desc: '記錄第一筆消費', exp: 200, coins: 100, progress: totalTxCount > 0 ? 1 : 0, target: 1 },
                    { id: 'm3', type: 'main', title: '見習理財家', desc: '記錄 10 筆消費', exp: 400, coins: 200, progress: totalTxCount, target: 10 },
                    { id: 'm2', type: 'main', title: '財務起步', desc: `累積消費 ${targetM2.toLocaleString()} ${mainCurrency}`, exp: 300, coins: 150, progress: totalExpenseVal, target: targetM2 },
                    { id: 'm4', type: 'main', title: '交友廣闊', desc: '新增 1 位好友', exp: 200, coins: 100, progress: data.friends.length, target: 1 },
                    { id: 'c1', type: 'challenge', title: '儲蓄大師', desc: `總資產 ${targetC1.toLocaleString()} ${mainCurrency}`, exp: 500, coins: 300, progress: totalAssetVal, target: targetC1 },
                    { id: 'c2', type: 'challenge', title: '百萬富翁', desc: `總資產 ${targetC2.toLocaleString()} ${mainCurrency}`, exp: 1000, coins: 500, progress: totalAssetVal, target: targetC2 },
                ];
                return rawQuests.map(q => ({ ...q, uniqueId: q.id, isClaimed: data.claimedQuests.includes(q.id), isCompleted: q.progress >= q.target })).sort((a, b) => { if (a.isClaimed && !b.isClaimed) return 1; if (!a.isClaimed && b.isClaimed) return -1; if (a.isCompleted && !b.isCompleted) return -1; return 0; });
            }, [data.transactions, data.accounts, data.claimedQuests, mainCurrency, data.friends]);
            const pendingQuestCount = activeQuests.filter(q => q.isCompleted && !q.isClaimed).length;

            if (authLoading) return <div className="h-[100dvh] w-full flex items-center justify-center bg-[#f8f9fa] text-xl font-bold font-pixel text-theme-text" data-theme={theme}>Loading...</div>;

            if (!authUser) {
                return (
                    <div className="h-[100dvh] w-full flex flex-col items-center justify-center bg-theme-bg text-theme-text font-pixel relative overflow-hidden" data-theme={theme}>
                        <BackgroundIllustrations theme={theme} />
                        <div className="absolute top-4 right-4 z-20"><button onClick={() => setShowThemeSelect(true)} className="w-12 h-12 bg-theme-card text-theme-accent rounded-full flex items-center justify-center shadow-lg border-2 border-theme-border active:scale-95 transition-transform hover:shadow-xl hover:-translate-y-1"><Icon name="Paint" size={24}/></button></div>
                        <div className="z-10 flex flex-col items-center p-8 bg-theme-glass backdrop-blur-xl rounded-[2.5rem] shadow-2xl border-2 border-theme-border max-w-sm w-11/12">
                            <Icon name="Cloud" size={64} className="text-theme-accent mb-4 animate-float drop-shadow-md" />
                            <h1 className="text-2xl font-bold mb-2 text-theme-text text-center tracking-widest">公會雲端同步系統</h1>
                            <p className="text-theme-sub mb-8 text-xs">{isRegistering ? '建立新的冒險者通行證' : '驗證您的冒險者身分'}</p>
                            <form onSubmit={handleAuthSubmit} className="w-full space-y-4">
                                {isRegistering && (<div className="animate-pop-in"><input type="text" value={nicknameInput} onChange={e=>setNicknameInput(e.target.value)} placeholder="暱稱 (Nickname)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required={isRegistering} /></div>)}
                                <div><input type="text" value={accountInput} onChange={e=>setAccountInput(e.target.value)} placeholder="帳號 (Account)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required /></div>
                                <div><input type="password" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} placeholder="密碼 (Password)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required minLength="6"/></div>
                                {authError && <div className="text-red-500 text-[10px] font-bold text-center bg-red-100 p-2 rounded-lg break-all">{authError}</div>}
                                <button type="submit" className="w-full bg-theme-accent text-white py-4 mt-2 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform hover:brightness-110"><Icon name={isRegistering ? "UserPlus" : "Key"} size={18}/> {isRegistering ? '註冊並開啟金庫' : '登入金庫'}</button>
                            </form>
                            <button onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }} className="mt-6 text-xs text-theme-sub hover:text-theme-text transition-colors font-bold underline decoration-theme-sub/30 underline-offset-4">{isRegistering ? '已有通行證？返回登入' : '第一次來？註冊成為勇者'}</button>
                        </div>
                        {showThemeSelect && <SelectorSheet title={t('theme')} options={THEMES.map(t => ({ value: t.id, label: t.name, color: t.color }))} current={theme} onSelect={setTheme} onClose={() => setShowThemeSelect(false)} getLabel={(opt) => TRANSLATIONS[lang]?.[`theme_${opt.label}`] || opt.label} />}
                    </div>
                );
            }

            if (!data.user) return <div>Loading Profile...</div>;

            return (
                <div className="flex flex-col h-[100dvh] relative z-10 text-theme-text overflow-hidden bg-theme-bg select-none" data-theme={theme}>
                    <BackgroundIllustrations theme={theme} />
                    <header className="px-4 pt-12 pb-2 flex flex-col gap-2 bg-theme-glass sticky top-0 z-20 backdrop-blur-md border-b border-theme-border shrink-0">
                         <div className="flex justify-between items-center w-full">
                              <div className="flex items-center gap-3">
                                  <div className="w-11 h-11 rounded-full bg-theme-card border-2 border-theme-accent overflow-hidden shadow-md flex items-center justify-center cursor-pointer active:scale-95" onClick={() => setShowProfileOptions(true)}>{data.user.avatarImage ? <img src={data.user.avatarImage} alt="avatar" className="w-full h-full object-cover" style={{imageRendering: 'pixelated'}} /> : <Icon name="UserPlus" size={20} className="text-theme-sub"/>}</div>
                                  <div className="flex flex-col items-start"><div className="flex items-center gap-2"><h1 className="font-bold text-sm text-theme-text">{data.user.name}</h1><button onClick={() => { setNewNameInput(data.user.name); setShowRenameModal(true); }} className="text-[10px] text-theme-sub hover:text-theme-accent transition-colors p-1"><Icon name="Edit" size={12}/></button></div><button onClick={() => setShowTitleSelect(true)} className="text-[9px] font-bold text-theme-sub mt-0.5 bg-theme-bg px-2 py-0.5 rounded border border-theme-border hover:bg-theme-accent hover:text-white transition-colors">{TITLES_LIST.find(t => t.id === data.user?.title)?.name || data.user.title} <Icon name="Edit" size={8} className="inline ml-1"/></button></div>
                              </div>
                              <div className="flex gap-2 items-center">
                                   <div className="flex items-center gap-1 bg-yellow-100/80 px-2 py-1 rounded-full border border-yellow-300 shadow-sm mr-1"><Icon name="Coin" size={14} className="text-yellow-600"/><span className="text-[10px] font-bold text-yellow-800">{data.user.gold || 0}</span></div>
                                   <button onClick={() => setShowCurrencySelect(true)} className="w-9 h-9 bg-theme-bg text-theme-text rounded-full flex items-center justify-center shadow-sm border border-theme-border text-[9px] font-bold active:scale-95 transition-transform">{mainCurrency}</button>
                                   <button onClick={() => setLang(l => l === 'zh' ? 'en' : l === 'en' ? 'ja' : 'zh')} className="w-9 h-9 bg-theme-bg text-theme-text rounded-full flex items-center justify-center shadow-sm border border-theme-border text-[9px] font-bold active:scale-95 transition-transform">{lang.toUpperCase()}</button>
                                   <button onClick={() => setShowThemeSelect(true)} className="w-9 h-9 bg-theme-bg text-theme-accent rounded-full flex items-center justify-center shadow-sm border border-theme-border active:scale-95"><Icon name="Paint" size={16}/></button>
                                   <button onClick={() => auth.signOut()} className="w-9 h-9 bg-theme-bg text-red-500 rounded-full flex items-center justify-center shadow-sm border border-red-200 active:scale-95 transition-transform hover:bg-red-50"><Icon name="LogOut" size={16}/></button>
                              </div>
                         </div>
                         <div className="w-full mt-1 relative flex items-center gap-2">
                              <div className="flex-1"><div className="flex justify-between text-[10px] font-bold opacity-60 mb-1 text-theme-sub"><span>NEXT LEVEL</span><span>{data.user.exp} / {data.user.level * 100}</span></div><div className="w-full h-1.5 bg-theme-bg rounded-full overflow-hidden shadow-inner border border-theme-border"><div className="h-full bg-theme-accent transition-all duration-700" style={{width: `${(data.user.exp / (data.user.level*100))*100}%`}}></div></div></div>
                              {cloudSyncing && <Icon name="Cloud" size={12} className="text-theme-accent animate-pulse" />}
                         </div>
                    </header>
                    <main className="flex-1 overflow-hidden relative z-10">
                        {view === 'home' && <HomeView user={data.user} equipped={data.equipped} accounts={data.accounts} onOpenAdd={() => setShowAddModal(true)} onOpenAsset={(acc) => { setEditingAccount(acc || null); setTempAccountName(acc?.name || ''); setTempAccountBalance(acc?.balance?.toString() || ''); setTempAccountCurrency(acc?.currency || mainCurrency); setTempAccountType(acc?.type || 'cash'); setAssetModalOpen(true); }} lang={lang} translations={TRANSLATIONS} onRenamePet={handleRenamePet} />}
                        {view === 'shop' && <ShopView gold={data.user.gold} inventory={data.inventory} equipped={data.equipped} user={data.user} onBuy={handleBuyItem} lang={lang} translations={TRANSLATIONS} purchaseHistory={data.purchaseHistory} />}
                        {view === 'character' && <CharacterView level={data.user.level} equipped={data.equipped} gender={data.user.gender} appearance={data.user.appearance} onToggleGender={() => setData(prev => ({ ...prev, user: { ...prev.user, gender: prev.user.gender === 'male' ? 'female' : 'male' } }))} onUpdateAppearance={(newApp) => setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } }))} onEquipSlot={(slot) => { setSelectedSlot(slot); setEquipModalOpen(true); }} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'journal' && <JournalView logs={data.logs} transactions={data.transactions} categories={data.categories} lang={lang} translations={TRANSLATIONS} onEditTx={(tx) => { setEditingTx(tx); setShowAddModal(true); }} />}
                        {view === 'quests' && <QuestView activeQuests={activeQuests} onClaim={handleClaimQuest} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'achievements' && <AchievementView achievements={ACHIEVEMENTS_LIST} unlockedIds={data.user.unlockedAchievements} currentStats={{ txCount: data.transactions.length, expenseTotal: data.transactions.filter(t => t.type === 'expense').reduce((a,c) => a + c.amount, 0), balance: data.accounts.reduce((a,c) => a + c.balance, 0), questCount: data.claimedQuests.length, level: data.user.level, itemCount: data.inventory.length, friendCount: data.friends.length }} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'social' && <SocialView user={data.user} friends={data.friends || []} onAddFriend={handleAddFriend} onRemoveFriend={handleRemoveFriend} onLikeFriend={handleLikeFriend} onUpdateId={handleUpdateId} lang={lang} translations={TRANSLATIONS} />}
                    </main>
                    <nav className="fixed bottom-0 w-full glass border-t border-theme-border px-1 flex justify-between items-center z-30 h-20 rounded-t-3xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] shrink-0 pb-1 overflow-x-auto no-scrollbar">
                        {[{ id: 'home', icon: 'Home', label: t('adventure') },{ id: 'quests', icon: 'Scroll', label: t('quests'), badge: pendingQuestCount },{ id: 'shop', icon: 'Shop', label: t('shop') },{ id: 'character', icon: 'Sword', label: t('character') },{ id: 'social', icon: 'Users', label: t('social') },{ id: 'achievements', icon: 'Trophy', label: t('achievements') },{ id: 'journal', icon: 'Book', label: t('journal') }].map(nav => (
                            <button key={nav.id} onClick={() => setView(nav.id)} className={`flex flex-col items-center justify-center gap-0.5 min-w-[50px] flex-1 h-12 rounded-2xl transition-all duration-300 relative ${view === nav.id ? 'text-theme-accent -translate-y-4 bg-theme-card shadow-lg border border-theme-border scale-110 z-10' : 'text-theme-sub hover:text-theme-text opacity-70'}`}><Icon name={nav.icon} size={20} strokeWidth={view === nav.id ? 2.5 : 2} /><span className={`text-[9px] font-bold transition-all duration-300 ${view === nav.id ? 'text-theme-accent scale-105' : 'text-theme-sub opacity-80'}`}>{nav.label}</span>{nav.badge ? <span className="absolute top-0 right-3 w-3 h-3 bg-red-500 rounded-full border border-white animate-bounce"></span> : null}</button>
                        ))}
                    </nav>
                    
                    {showRenameModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center animate-[fadeIn_0.2s]">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowRenameModal(false)}></div>
                            <div className="bg-theme-card p-6 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 animate-pop-in">
                                <h3 className="font-bold text-lg text-theme-text mb-4 text-center">更改暱稱</h3>
                                <div className="mb-6"><input type="text" value={newNameInput} onChange={e => setNewNameInput(e.target.value)} className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-3 font-bold text-theme-text outline-none focus:border-theme-accent" autoFocus placeholder="輸入新暱稱..." /></div>
                                <div className="flex gap-3"><button onClick={() => setShowRenameModal(false)} className="flex-1 py-3 rounded-xl font-bold bg-theme-bg border border-theme-border text-theme-sub active:scale-95">{t('cancel')}</button><button onClick={() => { if (!newNameInput.trim()) return; const newLogs = addLog('system', `更改暱稱為: ${newNameInput}`, data.logs); setData(prev => ({ ...prev, user: { ...prev.user, name: newNameInput }, logs: newLogs })); if (authUser) { authUser.updateProfile({ displayName: newNameInput }).catch(e => console.error(e)); } setShowRenameModal(false); }} className="flex-1 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 bg-theme-accent"><Icon name="Check" size={16}/> {t('confirm')}</button></div>
                            </div>
                        </div>
                    )}

                    {showAddModal && <AddTransactionModal initialData={editingTx} accounts={data.accounts} categories={data.categories} onClose={() => { setShowAddModal(false); setEditingTx(null); }} onAdd={handleSaveTransaction} />}
                    {showPetSelector && <PetSelectorModal onSelect={handleSelectPet} />}
                    
                    {showProfileOptions && (
                        <SelectorSheet title="頭像與外觀設定" options={[{ value: 'edit', label: '編輯角色外觀', desc: '進入更衣室' }, { value: 'upload', label: '上傳圖片', desc: '從裝置選擇' }, { value: 'remove', label: '移除圖片', desc: '使用像素角色' } ]} current="" onSelect={(val) => { if (val === 'edit') setShowAvatarEdit(true); if (val === 'upload') document.getElementById('hidden-file-input')?.click(); if (val === 'remove') setData(prev => ({...prev, user: {...prev.user, avatarImage: ''}})); setShowProfileOptions(false); }} onClose={() => setShowProfileOptions(false)} />
                    )}
                    <input type="file" id="hidden-file-input" className="hidden" accept="image/*" onChange={handleAvatarUpload}/>
                    {showTitleSelect && <SelectorSheet title="更換稱號" options={TITLES_LIST.map(title => ({ value: title.id, label: title.name, desc: title.desc, locked: !data.user.unlockedTitles.includes(title.id), condition: title.condition }))} current={data.user.title} onSelect={handleSetTitle} onClose={() => setShowTitleSelect(false)} />}
                    {showThemeSelect && <SelectorSheet title={t('theme')} options={THEMES.map(t => ({ value: t.id, label: t.name, color: t.color }))} current={theme} onSelect={setTheme} onClose={() => setShowThemeSelect(false)} getLabel={(opt) => TRANSLATIONS[lang]?.[`theme_${opt.label}`] || opt.label} />}
                    {showCurrencySelect && <SelectorSheet title={t('exchange')} options={MAIN_CURRENCIES.map(c => ({ value: c, label: c }))} current={mainCurrency} onSelect={setMainCurrency} onClose={() => setShowCurrencySelect(false)} />}
                    {showLevelUp.show && <LevelUpOverlay level={showLevelUp.level} onClose={() => setShowLevelUp({ ...showLevelUp, show: false })} />}
                    {showAvatarEdit && data.user && <AvatarEditor appearanceData={data.user.appearance} onSave={(newApp) => { setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } })); setShowAvatarEdit(false); }} onClose={() => setShowAvatarEdit(false)} />}
                    {equipModalOpen && <InventoryModal slot={selectedSlot} inventory={data.inventory} onClose={() => setEquipModalOpen(false)} onEquip={handleEquipItem} />}
                    
                    {assetModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-center px-6 animate-[fadeIn_0.2s]">
                            <div className="bg-theme-card rounded-3xl p-6 shadow-2xl animate-[slideUp_0.2s]">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-lg text-theme-text">{editingAccount ? t('edit_account') : t('new_account')}</h3><button onClick={()=>setAssetModalOpen(false)} className="text-theme-text"><Icon name="X"/></button></div>
                                <div className="space-y-4">
                                    <input type="text" value={tempAccountName} onChange={e=>setTempAccountName(e.target.value)} className="w-full bg-theme-bg p-4 rounded-2xl outline-none font-bold text-theme-text border border-theme-border" placeholder={t('relic_name')}/>
                                    <input type="number" inputMode="numeric" pattern="[0-9]*" onKeyDown={(e) => {if(['e','E','+','-'].includes(e.key)) e.preventDefault();}} value={tempAccountBalance} onChange={e=>setTempAccountBalance(e.target.value)} className="w-full bg-theme-bg p-4 rounded-2xl outline-none font-bold text-theme-text border border-theme-border" placeholder={t('mana_reserve')}/>
                                    <div className="flex gap-2">
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('currency_type')}</label><select value={tempAccountCurrency} onChange={e=>setTempAccountCurrency(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border">{MAIN_CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('container_type')}</label><select value={tempAccountType} onChange={e=>setTempAccountType(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border"><option value="cash">{t('cash')}</option><option value="bank">{t('bank')}</option><option value="card">{t('card')}</option></select></div>
                                    </div>
                                    <button onClick={handleSaveAccount} className="w-full py-4 bg-theme-accent text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">{t('save')}</button>
                                    {editingAccount && <button onClick={() => { const newAccs = data.accounts.filter(a => a.id !== editingAccount.id); setData(prev => ({ ...prev, accounts: newAccs })); setAssetModalOpen(false); }} className="w-full py-3 text-red-400 font-bold active:scale-95 transition-transform">{t('delete')}</button>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
