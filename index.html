                                        <div className="bg-theme-bg p-3 rounded-xl border border-theme-border text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1 opacity-60">{t('mainHand')}</div><div className="font-bold text-sm text-theme-text truncate">{selectedFriend.equipped?.mainHand?.name || '-'}</div></div>
                                        <div className="bg-theme-bg p-3 rounded-xl border border-theme-border text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1 opacity-60">{t('body')}</div><div className="font-bold text-sm text-theme-text truncate">{selectedFriend.equipped?.body?.name || '-'}</div></div>
                                        <div className="bg-theme-bg p-3 rounded-xl border border-theme-border text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1 opacity-60">{t('eye')}</div><div className="font-bold text-sm text-theme-text truncate">{selectedFriend.equipped?.eye?.name || '-'}</div></div>
                                        <div className="bg-theme-bg p-3 rounded-xl border border-theme-border text-center"><div className="text-[10px] text-theme-sub uppercase font-bold mb-1 opacity-60">{t('spiritRing')}</div><div className="font-bold text-sm text-theme-text truncate">{Array.isArray(selectedFriend.equipped?.spiritRing) ? (selectedFriend.equipped.spiritRing.length > 0 ? `Multi (${selectedFriend.equipped.spiritRing.length})` : '-') : (selectedFriend.equipped?.spiritRing?.name || '-')}</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [authUser, setAuthUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            const addLog = (type, msg, currentLogs) => { 
                const newLog = { id: Date.now(), date: new Date().toISOString(), type, msg }; 
                return [newLog, ...currentLogs].slice(0, 50); 
            };

            const [data, setData] = useState({
                user: { uid: 'guest', name: '修真者', gender: 'male', level: 1, exp: 0, gold: 500, stones: 0, title: 'Novice', currentClass: 'novice', unlockedTitles: ['Novice'], unlockedAchievements: [], appearance: { male: {...DEFAULT_APPEARANCE}, female: {...DEFAULT_APPEARANCE} }, photo: '', isIdChanged: false, bossAttempts: { date: '', count: 0 }, talents: {}, hasResetTalent: false },
                inventory: [], equipped: {}, transactions: [], accounts: [{ id: 1, name: '納戒/儲物袋', currency: 'TWD', balance: 0, type: 'cash' }], logs: [], categories: DEFAULT_CATEGORIES, claimedQuests: [], purchaseHistory: [], friends: [], fixedExpenses: []
            });
            
            const [view, setView] = useState('home');
            const [theme, setTheme] = useState('ink');
            const [lang, setLang] = useState('zh');
            const [mainCurrency, setMainCurrency] = useState('TWD');
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showThemeSelect, setShowThemeSelect] = useState(false);
            const [showCurrencySelect, setShowCurrencySelect] = useState(false);
            const [showLevelUp, setShowLevelUp] = useState({ show: false, level: 1 });
            const [showAvatarEdit, setShowAvatarEdit] = useState(false);
            const [showClassSelector, setShowClassSelector] = useState(false);
            const [assetModalOpen, setAssetModalOpen] = useState(false);
            const [editingAccount, setEditingAccount] = useState(null);
            const [tempAccountName, setTempAccountName] = useState('');
            const [tempAccountBalance, setTempAccountBalance] = useState('');
            const [tempAccountCurrency, setTempAccountCurrency] = useState('TWD');
            const [tempAccountType, setTempAccountType] = useState('cash');
            const [showAssetCalc, setShowAssetCalc] = useState(false);
            const [showCategoryManager, setShowCategoryManager] = useState(false);
            const [equipModalOpen, setEquipModalOpen] = useState(false);
            const [selectedSlot, setSelectedSlot] = useState(null);
            const [showPetSelector, setShowPetSelector] = useState(false);
            const [showProfileOptions, setShowProfileOptions] = useState(false);
            const [showTitleSelect, setShowTitleSelect] = useState(false);
            const [showRenameModal, setShowRenameModal] = useState(false);
            const [newNameInput, setNewNameInput] = useState('');
            const [editingTx, setEditingTx] = useState(null);
            const [showFixedExpenseModal, setShowFixedExpenseModal] = useState(false);

            const [isRegistering, setIsRegistering] = useState(false);
            const [accountInput, setAccountInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [nicknameInput, setNicknameInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [cloudSyncing, setCloudSyncing] = useState(false);

            const safeData = useMemo(() => {
                const defaultUser = { uid: 'guest', name: '修真者', gender: 'male', level: 1, exp: 0, gold: 500, stones: 0, title: 'Novice', currentClass: 'novice', unlockedTitles: ['Novice'], unlockedAchievements: [], appearance: { male: {...DEFAULT_APPEARANCE}, female: {...DEFAULT_APPEARANCE} }, isIdChanged: false, bossAttempts: { date: '', count: 0 }, talents: {}, hasResetTalent: false };
                const currentUser = data.user || defaultUser;
                return {
                    ...data,
                    user: {
                        ...currentUser,
                        unlockedAchievements: Array.isArray(currentUser.unlockedAchievements) ? currentUser.unlockedAchievements : [],
                        unlockedTitles: Array.isArray(currentUser.unlockedTitles) ? currentUser.unlockedTitles : ['Novice'],
                        appearance: currentUser.appearance || { male: {...DEFAULT_APPEARANCE}, female: {...DEFAULT_APPEARANCE} },
                        level: currentUser.level || 1,
                        exp: currentUser.exp || 0,
                        gold: currentUser.gold || 0,
                        stones: currentUser.stones || 0,
                        currentClass: currentUser.currentClass || 'novice',
                        bossAttempts: currentUser.bossAttempts || { date: '', count: 0 },
                        talents: currentUser.talents || {},
                        hasResetTalent: currentUser.hasResetTalent || false
                    },
                    friends: Array.isArray(data.friends) ? data.friends : [],
                    categories: data.categories || DEFAULT_CATEGORIES,
                    transactions: Array.isArray(data.transactions) ? data.transactions : [],
                    logs: Array.isArray(data.logs) ? data.logs : [],
                    accounts: Array.isArray(data.accounts) ? data.accounts : [],
                    inventory: Array.isArray(data.inventory) ? data.inventory : [],
                    claimedQuests: Array.isArray(data.claimedQuests) ? data.claimedQuests : [],
                    purchaseHistory: Array.isArray(data.purchaseHistory) ? data.purchaseHistory : [],
                    fixedExpenses: Array.isArray(data.fixedExpenses) ? data.fixedExpenses : []
                };
            }, [data]);

            // === 核心算力與能力值倍率更新 ===
            const calculatedStats = useMemo(() => {
                const level = safeData.user.level || 1;
                const talents = safeData.user.talents || {};
                const currentClass = safeData.user.currentClass || 'novice';
                const classBonuses = CLASS_DEFINITIONS[currentClass]?.bonuses || { str: 0, int: 0, vit: 0, agi: 0, critBonus: 0, atkMulti: 1, magMulti: 1, hpMulti: 1 };
                
                const baseStr = 5 + level * 2;
                const baseInt = 5 + level * 2;
                const baseVit = 10 + level * 5;
                const baseAgi = 5 + level * 2;
                
                let totalStats = { str: baseStr, int: baseInt, vit: baseVit, agi: baseAgi };
                
                const calculateItemStats = (item) => {
                    if(item && item.stats) { 
                        const multi = Math.pow(1.1, item.enhanceLevel || 0);
                        if(item.stats.all) {
                            totalStats.str += item.stats.all * multi;
                            totalStats.int += item.stats.all * multi;
                            totalStats.vit += item.stats.all * multi;
                            totalStats.agi += item.stats.all * multi;
                        }
                        if(item.stats.str) totalStats.str += item.stats.str * multi; 
                        if(item.stats.int) totalStats.int += item.stats.int * multi; 
                        if(item.stats.vit) totalStats.vit += item.stats.vit * multi; 
                        if(item.stats.agi) totalStats.agi += item.stats.agi * multi; 
                        if(item.stats.atk) totalStats.str += Math.floor((item.stats.atk * multi) / 5); 
                        if(item.stats.cri) totalStats.agi += (item.stats.cri * multi) * 5; 
                    }
                };
                Object.values(safeData.equipped || {}).forEach(val => { 
                    if (Array.isArray(val)) { val.forEach(calculateItemStats); } else { calculateItemStats(val); }
                });

                const limitBreak = 1 + (talents['limit_breaker'] || 0) * 0.50;
                const godhoodMulti = 1 + (talents['godhood'] || 0) * 1.00;
                const divinePower = (talents['divine_power'] || 0) * 0.15;
                
                const strMulti = (1 + classBonuses.str + (talents['str_up'] || 0) * 0.05 + divinePower + (talents['god_of_war'] || 0) * 0.15) * limitBreak * godhoodMulti;
                const vitMulti = (1 + classBonuses.vit + (talents['vit_up'] || 0) * 0.05 + divinePower) * limitBreak * godhoodMulti;
                const agiMulti = (1 + classBonuses.agi + (talents['agi_up'] || 0) * 0.05 + divinePower) * limitBreak * godhoodMulti;
                const intMulti = (1 + classBonuses.int + (talents['int_up'] || 0) * 0.05 + divinePower + (talents['archmage'] || 0) * 0.15) * limitBreak * godhoodMulti;
                
                totalStats.str *= strMulti;
                totalStats.vit *= vitMulti;
                totalStats.agi *= agiMulti;
                totalStats.int *= intMulti;

                const combatMasterMulti = 1 + (talents['combat_master'] || 0) * 0.10;
                const immortalBodyMulti = 1 + (talents['immortal_body'] || 0) * 0.10 + (talents['hp_regen'] || 0) * 0.02;
                const manaPoolMulti = 1 + (talents['mana_pool'] || 0) * 0.05;
                const dodgeMasterMulti = 1 + (talents['dodge_master'] || 0) * 0.05;
                const critRateBonus = (talents['crit_rate_up'] || 0) * 3;

                const derivedStats = { 
                    hp: (totalStats.vit * 20) * immortalBodyMulti * (classBonuses.hpMulti || 1), 
                    mp: (totalStats.int * 10) * manaPoolMulti, 
                    atk: (totalStats.str * 5) * combatMasterMulti * (classBonuses.atkMulti || 1), 
                    matk: (totalStats.int * 5) * (classBonuses.magMulti || 1),
                    def: totalStats.vit * 2, 
                    spd: (totalStats.agi * 2) * dodgeMasterMulti, 
                    cri: Math.min(100, Math.floor(totalStats.agi * 0.2) + critRateBonus + (classBonuses.critBonus || 0)) 
                };
                
                const cp = derivedStats.hp + Math.max(derivedStats.atk, derivedStats.matk) + derivedStats.def + derivedStats.spd;
                
                return { totalStats, derivedStats, cp };
            }, [safeData.user.level, safeData.user.talents, safeData.user.currentClass, safeData.equipped]);

            useEffect(() => {
                if (!authLoading && authUser && safeData.fixedExpenses?.length > 0) {
                    const now = Date.now();
                    const today = new Date();
                    const currentMonthStr = `${today.getFullYear()}-${today.getMonth()}`;
                    const currentDay = today.getDate();
                    let updated = false;
                    let newData = { ...safeData };

                    safeData.fixedExpenses.forEach(exp => {
                        let shouldDeduct = false;
                        
                        if (exp.deductType === 'interval30') {
                            const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
                            if (!exp.lastDeductedTime) {
                                exp.lastDeductedTime = now;
                                updated = true;
                            } else if (now - exp.lastDeductedTime >= THIRTY_DAYS_MS) {
                                shouldDeduct = true;
                                exp.lastDeductedTime = now;
                            }
                        } else {
                            if (currentDay >= exp.dayOfMonth && exp.lastDeductedMonth !== currentMonthStr) {
                                shouldDeduct = true;
                                exp.lastDeductedMonth = currentMonthStr;
                            }
                        }

                        if (shouldDeduct) {
                            const txId = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                            const newTx = {
                                id: txId,
                                type: 'expense',
                                amount: exp.amount,
                                category: exp.category,
                                accountId: exp.accountId,
                                note: `[Auto] ${exp.name}`,
                                date: new Date().toISOString().split('T')[0],
                                timestamp: Date.now()
                            };

                            newData.transactions = [newTx, ...newData.transactions];

                            const accIdx = newData.accounts.findIndex(a => a.id == exp.accountId);
                            if (accIdx > -1) {
                                newData.accounts[accIdx].balance -= exp.amount;
                            }

                            newData.logs = addLog('finance_out', `Auto Deduct: ${exp.name} (-${exp.amount})`, newData.logs);
                            updated = true;
                        }
                    });

                    if (updated) {
                        setData(newData);
                        checkUnlockables(newData);
                    }
                }
            }, [safeData.fixedExpenses, authLoading, authUser]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setAuthUser(user);
                        try {
                            const doc = await db.collection('users').doc(user.uid).get();
                            if (doc.exists) {
                                const cloudData = doc.data();
                                const realUid = cloudData.user?.isIdChanged ? cloudData.user.uid : (cloudData.user?.uid || user.uid);
                                setData({ ...data, ...cloudData, user: { ...data.user, ...cloudData.user, uid: realUid, name: cloudData.user?.name || user.displayName || 'Hero' } });
                            } else {
                                let newInitialData = { ...data };
                                newInitialData.user = { ...newInitialData.user, uid: user.uid, name: user.displayName || 'Hero' };
                                newInitialData.friends = [{ uid: 'mock_1', name: '小醫仙 (Guide)', gender: 'female', level: 10, title: 'Novice', currentClass: 'archmage', appearance: { hair: '#f472b6', skin: '#ffccbc', armor: '#fff', cape: '#ec4899' }, equipped: { head: SHOP_ITEMS.find(i=>i.id==='h_mage_hat'), mainHand: SHOP_ITEMS.find(i=>i.id==='w_apprentice_wand') }, lastLogin: 'Online', likes: 999 }];
                                setData(newInitialData);
                                await db.collection('users').doc(user.uid).set(newInitialData);
                            }
                        } catch (e) {
                            console.warn("Cloud load failed, using local storage", e);
                            const fallbackData = localStorage.getItem(`gw_v28_data_${user.uid}`);
                            if (fallbackData) setData({ ...data, ...JSON.parse(fallbackData) });
                        }
                    } else { setAuthUser(null); }
                    setAuthLoading(false);
                });

                const savedTheme = localStorage.getItem('gw_theme'); if (savedTheme) setTheme(savedTheme);
                const savedLang = localStorage.getItem('gw_lang'); if (savedLang) setLang(savedLang);
                const savedCurr = localStorage.getItem('gw_curr'); if (savedCurr) setMainCurrency(savedCurr);
                return () => unsubscribe();
            }, []);

            useEffect(() => { if (!authLoading && authUser && safeData.user && !safeData.user.pet && !showPetSelector) { setShowPetSelector(true); } }, [safeData.user?.pet, authUser, authLoading]);
            
            useEffect(() => { 
                if (authUser && data && !authLoading) {
                    const timer = setTimeout(async () => {
                        setCloudSyncing(true);
                        try {
                            const doc = await db.collection('users').doc(authUser.uid).get();
                            let latestFriends = safeData.friends;
                            if (doc.exists) {
                                const cloudData = doc.data();
                                const mergedMap = new Map();
                                safeData.friends.forEach(f => mergedMap.set(f.uid, f));
                                (cloudData.friends || []).forEach(f => mergedMap.set(f.uid, f));
                                latestFriends = Array.from(mergedMap.values());
                                if (latestFriends.length > safeData.friends.length) { setData(prev => ({ ...prev, friends: latestFriends })); }
                            }
                            const dataToSave = { ...data, friends: latestFriends };
                            await db.collection('users').doc(authUser.uid).set(dataToSave);
                            localStorage.setItem(`gw_v28_data_${authUser.uid}`, JSON.stringify(dataToSave)); 
                        } catch (e) { console.error("Sync error", e); } finally { setCloudSyncing(false); }
                    }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [data, authUser, authLoading, safeData.friends]);
            
            useEffect(() => { document.body.setAttribute('data-theme', theme); localStorage.setItem('gw_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('gw_lang', lang); }, [lang]);
            useEffect(() => { localStorage.setItem('gw_curr', mainCurrency); }, [mainCurrency]);

            const t = (key) => TRANSLATIONS[lang]?.[key] || key;
            
            const currentStats = useMemo(() => {
                const rate = EXCHANGE_RATES[mainCurrency] || 1;
                const convertedExpense = safeData.transactions.filter(t => t.type === 'expense').reduce((a,c) => {
                    const acc = safeData.accounts.find(ac => ac.id == c.accountId);
                    const txRate = acc ? (EXCHANGE_RATES[acc.currency] || 1) : 1;
                    return a + (c.amount / txRate) * rate;
                }, 0);
                const convertedBalance = safeData.accounts.reduce((a,c) => {
                    const accRate = EXCHANGE_RATES[c.currency] || 1;
                    return a + (c.balance / accRate) * rate;
                }, 0);

                return { 
                    txCount: safeData.transactions.length, 
                    expenseTotal: convertedExpense, 
                    balance: convertedBalance, 
                    questCount: safeData.claimedQuests.length, 
                    level: safeData.user.level, 
                    itemCount: safeData.inventory.length, 
                    friendCount: safeData.friends.length 
                };
            }, [safeData, mainCurrency]);

            const checkUnlockables = (currentData) => {
                const rate = EXCHANGE_RATES[mainCurrency] || 1;
                const convertedExpense = (currentData.transactions||[]).filter(t => t.type === 'expense').reduce((a,c) => {
                    const acc = (currentData.accounts||[]).find(ac => ac.id == c.accountId);
                    const txRate = acc ? (EXCHANGE_RATES[acc.currency] || 1) : 1;
                    return a + (c.amount / txRate) * rate;
                }, 0);
                const convertedBalance = (currentData.accounts||[]).reduce((a,c) => {
                    const accRate = EXCHANGE_RATES[c.currency] || 1;
                    return a + (c.balance / accRate) * rate;
                }, 0);

                const stats = { 
                    txCount: (currentData.transactions||[]).length, 
                    expenseTotal: convertedExpense, 
                    balance: convertedBalance, 
                    questCount: (currentData.claimedQuests||[]).length, 
                    level: currentData.user.level, 
                    itemCount: (currentData.inventory||[]).length, 
                    friendCount: (currentData.friends||[]).length 
                };
                
                let newUser = { ...currentData.user, unlockedTitles: currentData.user.unlockedTitles || ['Novice'], unlockedAchievements: currentData.user.unlockedAchievements || [] }; 
                let logs = [...(currentData.logs||[])]; let updated = false;
                
                TITLES_LIST.forEach(tTitle => { if (!newUser.unlockedTitles.includes(tTitle.id) && tTitle.check(stats, 1)) { newUser.unlockedTitles.push(tTitle.id); logs = addLog('system', `${t('log_sys_title')}: ${tTitle.name}`, logs); updated = true; } });
                ACHIEVEMENTS_LIST.forEach(ach => {
                    if (!newUser.unlockedAchievements.includes(ach.id)) {
                        let achieved = false;
                        if (ach.type === 'txCount' && stats.txCount >= ach.target) achieved = true;
                        if (ach.type === 'expenseTotal' && stats.expenseTotal >= ach.target) achieved = true;
                        if (ach.type === 'balance' && stats.balance >= ach.target) achieved = true;
                        if (ach.type === 'questCount' && stats.questCount >= ach.target) achieved = true;
                        if (ach.type === 'level' && stats.level >= ach.target) achieved = true;
                        if (ach.type === 'friendCount' && stats.friendCount >= ach.target) achieved = true;
                        if (achieved) { newUser.unlockedAchievements.push(ach.id); logs = addLog('system', `Achievement Unlocked: ${ach.title}`, logs); updated = true; }
                    }
                });
                if (updated) { setData({ ...currentData, user: newUser, logs }); }
            };

            const handleAvatarUpload = (e) => { const file = e.target.files?.[0]; if (file && safeData.user) { const reader = new FileReader(); reader.onloadend = () => { setData(prev => ({ ...prev, user: { ...prev.user, avatarImage: reader.result } })); setShowProfileOptions(false); }; reader.readAsDataURL(file); } };
            const handleSelectPet = (petId) => { if (!safeData.user) return; const newPet = { id: petId, name: PET_DEFINITIONS[petId].name, exp: 0, level: 1, bond: 0 }; setData(prev => ({ ...prev, user: { ...prev.user, pet: newPet } })); setShowPetSelector(false); };
            const handleRenamePet = (newName) => { if (!safeData.user.pet) return; setData(prev => ({ ...prev, user: { ...prev.user, pet: { ...prev.user.pet, name: newName } } })); };
            const handleSetTitle = (titleId) => { setData(prev => ({ ...prev, user: { ...prev.user, title: titleId } })); };
            
            const handleSelectClass = (classId) => {
                const newLogs = addLog('system', `突破境界! 晉升為: ${CLASS_DEFINITIONS[classId].name}!`, safeData.logs);
                setData(prev => ({ ...prev, user: { ...prev.user, currentClass: classId }, logs: newLogs }));
            };
            
            const handleBuyItem = (item) => {
                const newGold = safeData.user.gold - item.cost; 
                const newItemInstance = { ...item, uniqueId: Date.now().toString() + Math.floor(Math.random()*1000), enhanceLevel: 0 };
                const newInventory = [...safeData.inventory, newItemInstance]; 
                const newLogs = addLog('system', `商會購買: ${item.name}`, safeData.logs);
                const newPurchase = { id: Date.now().toString(), itemId: item.id, itemName: item.name, cost: item.cost, date: new Date().toISOString() };
                setData(prev => ({ ...prev, user: { ...prev.user, gold: newGold }, inventory: newInventory, logs: newLogs, purchaseHistory: [newPurchase, ...safeData.purchaseHistory] }));
            };
            
            const handleEquipItem = (slot, item) => { 
                const newEquipped = { ...data.equipped }; 
                if (item) { 
                    if (slot === 'back' || slot === 'spiritRing') {
                        const currentArray = Array.isArray(newEquipped[slot]) ? newEquipped[slot] : (newEquipped[slot] ? [newEquipped[slot]] : []);
                        if (currentArray.some(i => i.uniqueId ? i.uniqueId === item.uniqueId : i.id === item.id)) {
                            newEquipped[slot] = currentArray.filter(i => i.uniqueId ? i.uniqueId !== item.uniqueId : i.id !== item.id);
                        } else {
                            newEquipped[slot] = [...currentArray, item];
                        }
                    } else {
                        newEquipped[slot] = item; 
                    }
                } else { 
                    delete newEquipped[slot]; 
                } 
                setData(prev => ({ ...prev, equipped: newEquipped })); 
                if ((slot !== 'back' && slot !== 'spiritRing') || !item) {
                    setEquipModalOpen(false); 
                }
            };

            const handleEnhanceItem = (item, goldCost, stoneCost, isSuccess) => {
                let newUser = { ...safeData.user, gold: safeData.user.gold - goldCost, stones: (safeData.user.stones || 0) - stoneCost };
                let newInventory = [...safeData.inventory];
                let newEquipped = { ...safeData.equipped };
                
                if (isSuccess) {
                    let updatedItem = null;
                    newInventory = newInventory.map(i => {
                        if ((i.uniqueId && i.uniqueId === item.uniqueId) || (!i.uniqueId && i.id === item.id)) {
                            updatedItem = { ...i, enhanceLevel: (i.enhanceLevel || 0) + 1 };
                            return updatedItem;
                        }
                        return i;
                    });
                    
                    if (updatedItem) {
                        for (const [slot, eqItem] of Object.entries(newEquipped)) {
                            if (Array.isArray(eqItem)) {
                                newEquipped[slot] = eqItem.map(ei => ((ei.uniqueId && ei.uniqueId === item.uniqueId) || (!ei.uniqueId && ei.id === item.id)) ? updatedItem : ei);
                            } else if (eqItem && ((eqItem.uniqueId && eqItem.uniqueId === item.uniqueId) || (!eqItem.uniqueId && eqItem.id === item.id))) {
                                newEquipped[slot] = updatedItem;
                            }
                        }
                    }
                }

                setData(prev => ({ ...prev, user: newUser, inventory: newInventory, equipped: newEquipped }));
            };

            const handleUpgradeTalent = (talentId, cost) => {
                const newTalents = { ...safeData.user.talents };
                newTalents[talentId] = (newTalents[talentId] || 0) + 1;
                setData(prev => ({ ...prev, user: { ...prev.user, talents: newTalents } }));
            };

            const handleResetTalent = (cost) => {
                let newUser = { ...safeData.user };
                newUser.gold -= cost;
                newUser.talents = {}; 
                newUser.hasResetTalent = true; 
                const newLogs = addLog('system', `Talent Reset!`, safeData.logs);
                setData(prev => ({ ...prev, user: newUser, logs: newLogs }));
            };
            
            const handleSaveTransaction = (tData) => {
                let newData = { ...safeData }; let newAccounts = [...safeData.accounts]; let newLogs = [...safeData.logs];
                if (editingTx) {
                    const oldAccIdx = newAccounts.findIndex(a => a.id == editingTx.accountId); if (oldAccIdx > -1) { newAccounts[oldAccIdx] = { ...newAccounts[oldAccIdx] }; newAccounts[oldAccIdx].balance += (editingTx.type === 'expense' ? editingTx.amount : -editingTx.amount); }
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const txIndex = newData.transactions.findIndex(t => t.id === editingTx.id); if (txIndex > -1) { newData.transactions[txIndex] = { ...editingTx, ...tData }; }
                    newLogs = addLog('system', `Edit Record: ${safeData.categories[tData.category]?.label || 'Other'}`, newLogs); newData.accounts = newAccounts; newData.logs = newLogs; setData(newData); checkUnlockables(newData);
                } else {
                    const newTx = { id: Date.now().toString(), ...tData, date: tData.date || new Date().toISOString().split('T')[0], timestamp: Date.now() };
                    const newAccIdx = newAccounts.findIndex(a => a.id == tData.accountId); if (newAccIdx > -1) { newAccounts[newAccIdx] = { ...newAccounts[newAccIdx] }; newAccounts[newAccIdx].balance += (tData.type === 'expense' ? -tData.amount : tData.amount); }
                    const earnedExp = 100; const earnedGold = tData.type === 'income' ? Math.floor(tData.amount * 0.1) + 50 : 50;
                    let newUser = { ...safeData.user }; newUser.gold += earnedGold; newUser.exp += earnedExp;
                    
                    if (newUser.pet) { 
                        newUser.pet.exp = (newUser.pet.exp || 0) + earnedExp;
                        let petExpReq = (newUser.pet.level || 1) * 100;
                        while (newUser.pet.exp >= petExpReq) {
                            newUser.pet.level = (newUser.pet.level || 1) + 1; newUser.pet.exp -= petExpReq;
                            const petDef = PET_DEFINITIONS[newUser.pet.id]; 
                            if (petDef && petDef.nextEvolution && petDef.nextEvolution[newUser.pet.level.toString()]) { 
                                const nextId = petDef.nextEvolution[newUser.pet.level.toString()]; 
                                newUser.pet = { ...newUser.pet, id: nextId, name: PET_DEFINITIONS[nextId].name }; 
                                newLogs = addLog('system', `靈獸進化: ${PET_DEFINITIONS[nextId].name}!`, newLogs); 
                            }
                            petExpReq = (newUser.pet.level || 1) * 100;
                        }
                    }

                    let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; }
                    newLogs = addLog(tData.type === 'income' ? 'finance_in' : 'finance_out', `${tData.type === 'income' ? t('log_income') : t('log_expense')} ${tData.amount} (${safeData.categories[tData.category]?.label || 'Other'})`, newLogs);
                    newData = { ...newData, user: newUser, transactions: [newTx, ...newData.transactions], accounts: newAccounts, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level });
                }
                setEditingTx(null); setShowAddModal(false);
            };

            const handleDeleteTransaction = (tx) => {
                if(!window.confirm(t('confirmDelete'))) return;
                let newData = { ...safeData }; let newAccounts = [...safeData.accounts]; const accIdx = newAccounts.findIndex(a => a.id == tx.accountId);
                if (accIdx > -1) { newAccounts[accIdx] = { ...newAccounts[accIdx] }; newAccounts[accIdx].balance += (tx.type === 'expense' ? tx.amount : -tx.amount); }
                newData.transactions = newData.transactions.filter(t => t.id !== tx.id); newData.accounts = newAccounts; newData.logs = addLog('system', `Delete Record: ${safeData.categories[tx.category]?.label || 'Other'}`, newData.logs); setData(newData); checkUnlockables(newData);
            };

            const handleClaimQuest = (quest) => { let newUser = { ...safeData.user }; newUser.gold += quest.coins; newUser.exp += quest.exp; let leveledUp = false; const expReq = newUser.level * 100; if (newUser.exp >= expReq) { newUser.level += 1; newUser.exp -= expReq; leveledUp = true; } const newClaimed = [...safeData.claimedQuests, quest.uniqueId || quest.id]; const newLogs = addLog('system', `Quest Claimed: ${quest.title}`, safeData.logs); const newData = { ...safeData, user: newUser, claimedQuests: newClaimed, logs: newLogs }; setData(newData); checkUnlockables(newData); if (leveledUp) setShowLevelUp({ show: true, level: newUser.level }); };
            
            const handleSaveAccount = () => { 
                if (!tempAccountName || tempAccountBalance === '') return; let finalAmount = 0; try { finalAmount = Function(`'use strict'; return (${tempAccountBalance || '0'})`)(); } catch(err) { finalAmount = parseFloat(tempAccountBalance); } if (isNaN(finalAmount)) return;
                let newAccounts = [...safeData.accounts]; 
                if (editingAccount) { newAccounts = newAccounts.map(a => a.id === editingAccount.id ? { ...a, name: tempAccountName, balance: finalAmount, currency: tempAccountCurrency, type: tempAccountType } : a); } 
                else { newAccounts.push({ id: Date.now(), name: tempAccountName, balance: finalAmount, currency: tempAccountCurrency, type: tempAccountType }); } 
                setData(prev => ({ ...prev, accounts: newAccounts })); setAssetModalOpen(false); 
            };
            
            const handleAssetPadClick = (val) => {
                if (val === 'C') setTempAccountBalance('');

                else if (val === '=') { 
                    try { 
                        const res = Function(`'use strict'; return (${tempAccountBalance || '0'})`)(); 
                        setTempAccountBalance(String(Number(res.toFixed(2)))); 
                    } catch(e) {} 
                } else { 
                    setTempAccountBalance(prev => { 
                        if (prev === '' || prev === '0') { 
                            if (['+','*','/'].includes(val)) return prev; 
                            return val === '.' ? '0.' : val; 
                        } 
                        return prev + val; 
                    }); 
                }
            };

            const handleSaveFixedExpenses = (newFixedExpenses) => {

            };

            const handleAddFriend = async (id) => { 
                if (!id || !id.trim() || safeData.friends.some(f => f.uid === id)) return; if (id === safeData.user.uid) { alert(t('cannot_add_self')); return; }
                try {
                    const snap = await db.collection('users').where('user.uid', '==', id).get(); if (snap.empty) { alert(t('user_not_found')); return; }
                    const targetDoc = snap.docs[0]; const targetData = targetDoc.data();
                    const newFriend = { uid: targetData.user.uid, name: targetData.user.name, level: targetData.user.level, title: targetData.user.title, currentClass: targetData.user.currentClass || 'novice', gender: targetData.user.gender, appearance: targetData.user.appearance, equipped: targetData.equipped || {}, lastLogin: 'Online', likes: 0 };
                    const newLogs = addLog('system', `結交道友: ${newFriend.name}`, safeData.logs); setData(prev => ({ ...prev, friends: [...prev.friends, newFriend], logs: newLogs }));

                    { id: 'm1_tx', type: 'main', title: t('q_main_tx1_title'), desc: t('q_main_tx1_desc'), exp: 2000, coins: 2000, progress: totalTxCount > 0 ? 1 : 0, target: 1 },

                    { id: 'm_fr5', type: 'main', title: t('q_main_fr5_title'), desc: t('q_main_fr5_desc'), exp: 8000, coins: 8000, progress: safeData.friends.length, target: 5 },

                    { id: 'c2', type: 'challenge', title: t('q_chal_ast2_title'), desc: t('q_chal_ast2_desc').replace('{target}', targetC2.toLocaleString() + ' ' + mainCurrency), exp: 10000, coins: 10000, progress: totalAssetVal, target: targetC2 },
                    { id: 'c3', type: 'challenge', title: t('q_chal_ast3_title'), desc: t('q_chal_ast3_desc').replace('{target}', targetC3.toLocaleString() + ' ' + mainCurrency), exp: 30000, coins: 30000, progress: totalAssetVal, target: targetC3 },

                                <div><input type="text" value={accountInput} onChange={e=>setAccountInput(e.target.value)} placeholder="傳音符號 (Account ID)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required /></div>
                                <div><input type="password" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} placeholder="靈魂密碼 (Password)" className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-4 text-sm font-bold outline-none focus:border-theme-accent text-theme-text placeholder-theme-sub/50 transition-colors" required minLength="6"/></div>

                    </div>

            return (

                              <div className="flex items-center gap-3">
                                  <div className="w-11 h-11 rounded-full bg-theme-card border-2 border-theme-accent overflow-hidden shadow-md flex items-center justify-center cursor-pointer active:scale-95" onClick={() => setShowProfileOptions(true)}>{safeData.user.avatarImage ? <img src={safeData.user.avatarImage} alt="avatar" className="w-full h-full object-cover" style={{imageRendering: 'pixelated'}} /> : <Icon name="UserPlus" size={20} className="text-theme-sub"/>}</div>
                                  <div className="flex flex-col items-start"><div className="flex items-center gap-2"><h1 className="font-bold text-sm text-theme-text">{safeData.user.name}</h1><button onClick={() => { setNewNameInput(safeData.user.name); setShowRenameModal(true); }} className="text-[10px] text-theme-sub hover:text-theme-accent transition-colors p-1"><Icon name="Edit" size={12}/></button></div><button onClick={() => setShowTitleSelect(true)} className="mt-0.5 hover:opacity-80 transition-opacity"><TitleBadge titleId={safeData.user.title}/></button></div>
                              </div>
                              <div className="flex gap-2 items-center">
                                   <div className="flex items-center gap-1 bg-yellow-100/80 px-2 py-1 rounded-full border border-yellow-300 shadow-sm mr-1"><Icon name="Coin" size={14} className="text-yellow-600"/><span className="text-[10px] font-bold text-yellow-800">{safeData.user.gold.toLocaleString()}</span></div>

                         </div>
                    </header>
                    <main className="flex-1 overflow-hidden relative z-10">
                        {view === 'home' && <HomeView user={safeData.user} equipped={safeData.equipped} accounts={safeData.accounts} onOpenAdd={() => setShowAddModal(true)} onOpenAsset={(acc) => { setEditingAccount(acc || null); setTempAccountName(acc?.name || ''); setTempAccountBalance(acc?.balance?.toString() || ''); setTempAccountCurrency(acc?.currency || mainCurrency); setTempAccountType(acc?.type || 'cash'); setAssetModalOpen(true); }} onOpenFixedExpense={() => setShowFixedExpenseModal(true)} lang={lang} translations={TRANSLATIONS} onRenamePet={handleRenamePet} onNavigate={(target) => setView(target)} />}
                        {view === 'shop' && <ShopView gold={safeData.user.gold} inventory={safeData.inventory} equipped={safeData.equipped} user={safeData.user} onBuy={handleBuyItem} lang={lang} translations={TRANSLATIONS} purchaseHistory={safeData.purchaseHistory} />}
                        {view === 'forge' && <ForgeView user={safeData.user} inventory={safeData.inventory} onEnhance={handleEnhanceItem} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'talent' && <TalentView user={safeData.user} onUpgradeTalent={handleUpgradeTalent} onResetTalent={handleResetTalent} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'character' && <CharacterView level={safeData.user.level} equipped={safeData.equipped} gender={safeData.user.gender} appearance={safeData.user.appearance} currentClass={safeData.user.currentClass} onToggleGender={() => setData(prev => ({ ...prev, user: { ...prev.user, gender: prev.user.gender === 'male' ? 'female' : 'male' } }))} onUpdateAppearance={(newApp) => setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } }))} onEquipSlot={(slot) => { setSelectedSlot(slot); setEquipModalOpen(true); }} onOpenClassSelector={() => setShowClassSelector(true)} lang={lang} translations={TRANSLATIONS} totalStats={calculatedStats.totalStats} derivedStats={calculatedStats.derivedStats} cp={calculatedStats.cp} />}
                        {view === 'boss' && <BossView cp={calculatedStats.cp} totalStats={calculatedStats.totalStats} derivedStats={calculatedStats.derivedStats} user={safeData.user} equipped={safeData.equipped} gender={safeData.user.gender} appearance={safeData.user.appearance} currentClass={safeData.user.currentClass} onBattleEnd={handleBossBattleEnd} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'journal' && <JournalView logs={safeData.logs} transactions={safeData.transactions} categories={safeData.categories} accounts={safeData.accounts} lang={lang} translations={TRANSLATIONS} onEditTx={(tx) => { setEditingTx(tx); setShowAddModal(true); }} onDeleteTx={handleDeleteTransaction} />}
                        {view === 'quests' && <QuestView activeQuests={activeQuests} onClaim={handleClaimQuest} lang={lang} translations={TRANSLATIONS} mainCurrency={mainCurrency} />}
                        {view === 'achievements' && <AchievementView achievements={ACHIEVEMENTS_LIST} unlockedIds={safeData.user.unlockedAchievements} currentStats={currentStats} lang={lang} translations={TRANSLATIONS} />}
                        {view === 'social' && <SocialView user={safeData.user} equipped={safeData.equipped} friends={safeData.friends} onAddFriend={handleAddFriend} onRemoveFriend={handleRemoveFriend} onLikeFriend={handleLikeFriend} onUpdateId={handleUpdateId} lang={lang} translations={TRANSLATIONS} />}
                    </main>
                    
                    <nav className="fixed bottom-0 w-full glass border-t border-theme-border px-0.5 sm:px-2 flex items-center z-30 h-20 rounded-t-3xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] shrink-0 pb-1 overflow-x-auto custom-scrollbar">
                        {[{ id: 'home', icon: 'Home', label: t('adventure') },
                          { id: 'quests', icon: 'Scroll', label: t('quests'), badge: pendingQuestCount },
                          { id: 'shop', icon: 'Shop', label: t('shop') },
                          { id: 'character', icon: 'Sword', label: t('character') },
                          { id: 'boss', icon: 'Ghost', label: t('boss') }, 
                          { id: 'social', icon: 'Users', label: t('social') },
                          { id: 'achievements', icon: 'Trophy', label: t('achievements') },
                          { id: 'journal', icon: 'Book', label: t('journal') }].map(nav => (
                            <button key={nav.id} onClick={() => setView(nav.id)} className={`flex flex-col items-center justify-center gap-0.5 min-w-[50px] sm:min-w-[55px] flex-1 h-12 rounded-2xl transition-all duration-300 relative ${view === nav.id ? 'text-theme-accent -translate-y-4 bg-theme-card shadow-lg border border-theme-border scale-110 z-10' : 'text-theme-sub hover:text-theme-text opacity-70'}`}><Icon name={nav.icon} size={20} strokeWidth={view === nav.id ? 2.5 : 2} /><span className={`text-[8px] sm:text-[9px] font-bold transition-all duration-300 ${view === nav.id ? 'text-theme-accent scale-105' : 'text-theme-sub opacity-80 whitespace-nowrap'}`}>{nav.label}</span>{nav.badge ? <span className="absolute top-0 right-2 sm:right-3 w-3 h-3 bg-red-500 rounded-full border border-white animate-bounce"></span> : null}</button>
                        ))}
                    </nav>

                    {showCategoryManager && <CategoryManagerModal categories={safeData.categories} onClose={() => setShowCategoryManager(false)} onSave={(newCats) => { setData(prev => ({...prev, categories: newCats})); setShowCategoryManager(false); }} lang={lang} translations={TRANSLATIONS} />}
                    
                    {showRenameModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center animate-[fadeIn_0.2s]">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowRenameModal(false)}></div>
                            <div className="bg-theme-card p-6 rounded-3xl shadow-2xl w-full max-w-sm relative z-10 animate-pop-in">
                                <h3 className="font-bold text-lg text-theme-text mb-4 text-center">修改道號 (Change Name)</h3>
                                <div className="mb-6"><input type="text" value={newNameInput} onChange={e => setNewNameInput(e.target.value)} className="w-full bg-theme-bg border-2 border-theme-border rounded-xl p-3 font-bold text-theme-text outline-none focus:border-theme-accent" autoFocus placeholder="New Name..." /></div>
                                <div className="flex gap-3"><button onClick={() => setShowRenameModal(false)} className="flex-1 py-3 rounded-xl font-bold bg-theme-bg border border-theme-border text-theme-sub active:scale-95">{t('cancel')}</button><button onClick={() => { if (!newNameInput.trim()) return; const newLogs = addLog('system', `Change Name: ${newNameInput}`, safeData.logs); setData(prev => ({ ...prev, user: { ...prev.user, name: newNameInput }, logs: newLogs })); if (authUser) { authUser.updateProfile({ displayName: newNameInput }).catch(e => console.error(e)); } setShowRenameModal(false); }} className="flex-1 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 bg-theme-accent"><Icon name="Check" size={16}/> {t('confirm')}</button></div>
                            </div>
                        </div>
                    )}

                    {showAddModal && <AddTransactionModal initialData={editingTx} accounts={safeData.accounts} categories={safeData.categories} onClose={() => { setShowAddModal(false); setEditingTx(null); }} onAdd={handleSaveTransaction} onManageCategories={() => setShowCategoryManager(true)} lang={lang} translations={TRANSLATIONS} />}
                    {showPetSelector && <PetSelectorModal onSelect={handleSelectPet} />}
                    {showClassSelector && <ClassSelectorModal currentClass={safeData.user.currentClass} level={safeData.user.level} gender={safeData.user.gender} appearance={safeData.user.appearance} userEquipped={safeData.equipped} onSelect={handleSelectClass} onClose={() => setShowClassSelector(false)} lang={lang} translations={TRANSLATIONS} />}
                    
                    {showProfileOptions && (
                        <SelectorSheet title="Avatar Settings" options={[{ value: 'edit', label: 'Dress Room', desc: 'Edit Appearance' }, { value: 'upload', label: 'Upload Image', desc: 'From Device' }, { value: 'remove', label: 'Remove Image', desc: 'Use Pixel Avatar' } ]} current="" onSelect={(val) => { if (val === 'edit') setShowAvatarEdit(true); if (val === 'upload') document.getElementById('hidden-file-input')?.click(); if (val === 'remove') setData(prev => ({...prev, user: {...prev.user, avatarImage: ''}})); setShowProfileOptions(false); }} onClose={() => setShowProfileOptions(false)} />
                    )}
                    <input type="file" id="hidden-file-input" className="hidden" accept="image/*" onChange={handleAvatarUpload}/>
                    
                    {showTitleSelect && <SelectorSheet title="更換稱號 (Change Title)" options={TITLES_LIST.map(title => {
                        let conditionText = title.condition;
                        if (!safeData.user.unlockedTitles.includes(title.id) && title.getProgress) { conditionText += ` (Prog: ${title.getProgress(currentStats, EXCHANGE_RATES[mainCurrency] || 1)})`; }
                        return { value: title.id, label: title.name, desc: title.desc, locked: !safeData.user.unlockedTitles.includes(title.id), condition: conditionText };
                    })} current={safeData.user.title} onSelect={handleSetTitle} onClose={() => setShowTitleSelect(false)} />}
                    
                    {showThemeSelect && <SelectorSheet title={t('theme')} options={THEMES.map(th => ({ value: th.id, label: th.name, color: th.color }))} current={theme} onSelect={setTheme} onClose={() => setShowThemeSelect(false)} getLabel={(opt) => TRANSLATIONS[lang]?.[`theme_${opt.label}`] || opt.label} />}
                    {showCurrencySelect && <SelectorSheet title={t('exchange')} options={MAIN_CURRENCIES.map(c => ({ value: c, label: c }))} current={mainCurrency} onSelect={setMainCurrency} onClose={() => setShowCurrencySelect(false)} />}
                    {showLevelUp.show && <LevelUpOverlay level={showLevelUp.level} onClose={() => setShowLevelUp({ ...showLevelUp, show: false })} />}
                    {showAvatarEdit && safeData.user && <AvatarEditor appearanceData={safeData.user.appearance} onSave={(newApp) => { setData(prev => ({ ...prev, user: { ...prev.user, appearance: newApp } })); setShowAvatarEdit(false); }} onClose={() => setShowAvatarEdit(false)} />}
                    
                    {equipModalOpen && <InventoryModal slot={selectedSlot} inventory={safeData.inventory} equipped={safeData.equipped} totalStats={calculatedStats.totalStats} onClose={() => setEquipModalOpen(false)} onEquip={handleEquipItem} lang={lang} translations={TRANSLATIONS} />}
                    
                    {showFixedExpenseModal && <FixedExpenseManagerModal fixedExpenses={safeData.fixedExpenses} categories={safeData.categories} accounts={safeData.accounts} onClose={() => setShowFixedExpenseModal(false)} onSave={handleSaveFixedExpenses} lang={lang} translations={TRANSLATIONS} />}

                    {assetModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex flex-col justify-center px-6 animate-[fadeIn_0.2s]">
                            <div className="bg-theme-card rounded-3xl p-6 shadow-2xl animate-[slideUp_0.2s]">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-lg text-theme-text">{editingAccount ? t('edit_account') : t('new_account')}</h3><button onClick={()=>setAssetModalOpen(false)} className="text-theme-text"><Icon name="X"/></button></div>
                                <div className="space-y-4">
                                    <input type="text" value={tempAccountName} onChange={e=>setTempAccountName(e.target.value)} className="w-full bg-theme-bg p-4 rounded-2xl outline-none font-bold text-theme-text border border-theme-border" placeholder={t('relic_name')}/>
                                    
                                    <div onClick={() => setShowAssetCalc(true)} className="relative w-full bg-theme-bg p-4 rounded-2xl border border-theme-border flex items-center justify-between cursor-pointer group">
                                        <span className={`font-bold ${tempAccountBalance ? 'text-theme-text' : 'text-theme-sub/50'}`}>{tempAccountBalance || t('mana_reserve')}</span>
                                        <div className="p-2 rounded-xl bg-theme-accent/10 text-theme-accent group-hover:scale-110 transition-transform"><Icon name="Calculator" size={20}/></div>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('currency_type')}</label><select value={tempAccountCurrency} onChange={e=>setTempAccountCurrency(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border">{MAIN_CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div className="flex-1"><label className="text-[10px] text-theme-sub font-bold uppercase mb-1 block">{t('container_type')}</label><select value={tempAccountType} onChange={e=>setTempAccountType(e.target.value)} className="w-full bg-theme-bg p-3 rounded-2xl outline-none font-bold text-theme-text border border-theme-border"><option value="cash">{t('cash')}</option><option value="bank">{t('bank')}</option><option value="card">{t('card')}</option></select></div>
                                    </div>

                                    <button onClick={handleSaveAccount} className="w-full py-4 bg-theme-accent text-white rounded-2xl font-bold shadow-md active:scale-95 transition-transform">{t('save')}</button>
                                    {editingAccount && <button onClick={() => { const newAccs = safeData.accounts.filter(a => a.id !== editingAccount.id); setData(prev => ({ ...prev, accounts: newAccs })); setAssetModalOpen(false); }} className="w-full py-3 text-red-400 font-bold active:scale-95 transition-transform">{t('delete')}</button>}
                                </div>
                            </div>
                            {showAssetCalc && <MagicAbacus value={tempAccountBalance} onPadClick={handleAssetPadClick} onClose={() => setShowAssetCalc(false)} />}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
